  assemblies:
  - ShapeEngine
  namespace: ShapeEngine.Lib
  summary: Get a frame independent rate to use in lerp functions as t value.
  example: []
  syntax:
    content: public static float FrameIndepentLerpRate(float speed, float dt, float power = 2)
    parameters:
    - id: speed
      type: System.Single
      description: >-
        Value has to be positive.
            A value of 1 means the halfway point is reached in 0.5 seconds.
            A value of 2 means twice as fast and so on.
    - id: dt
      type: System.Single
      description: The current delta time.
    - id: power
      type: System.Single
      description: The power to use.
    return:
      type: System.Single
      description: Returns the rate to be used in lerp functions.
