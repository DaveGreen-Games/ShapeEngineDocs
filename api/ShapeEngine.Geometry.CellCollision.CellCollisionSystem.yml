  assemblies:
  - ShapeEngine
  namespace: ShapeEngine.Geometry.CellCollision
  summary: Clears the collision system state and returns all pooled resources.
  remarks: >-
    This method clears the pending add/remove queues, unregisters all colliders,

    and returns any allocated pooled <xref href="ShapeEngine.Geometry.CellCollision.CellCollisionSystem.Cell" data-throw-if-not-resolved="false"></xref> instances back to the pool.

    After calling <xref href="ShapeEngine.Geometry.CellCollision.CellCollisionSystem.Clear" data-throw-if-not-resolved="false"></xref>, the system will be in an empty state with

    no registered colliders or active cells.
  example: []
  syntax:
    content: public void Clear()
    content.vb: Public Sub Clear()
  overload: ShapeEngine.Geometry.CellCollision.CellCollisionSystem.Clear*
