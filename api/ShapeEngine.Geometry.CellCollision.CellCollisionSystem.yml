  assemblies:
  - ShapeEngine
  namespace: ShapeEngine.Geometry.CellCollision
  summary: >-
    Copies all registered colliders of type <code class="typeparamref">T</code> into the provided result set.

    Iterates the internal registry and adds any collider that can be cast to <code class="typeparamref">T</code>.
  example: []
  syntax:
    content: 'public int GetAllColliders<T>(ref HashSet<T> result) where T : ICellCollider'
    parameters:
    - id: result
      type: System.Collections.Generic.HashSet{{T}}
      description: >-
        A reference to a <xref href="System.Collections.Generic.HashSet%601" data-throw-if-not-resolved="false"></xref> that will be populated with matching colliders.
            The set is modified in-place; duplicates are ignored.
    typeParameters:
    - id: T
      description: The collider concrete type to filter for. Must implement <xref href="ShapeEngine.Geometry.CellCollision.ICellCollider" data-throw-if-not-resolved="false"></xref>.
    return:
      type: System.Int32
      description: The number of colliders added to <code class="paramref">result</code> by this call.
    content.vb: Public Function GetAllColliders(Of T As ICellCollider)(result As HashSet(Of T)) As Integer
  overload: ShapeEngine.Geometry.CellCollision.CellCollisionSystem.GetAllColliders*
