    path: ../ShapeEngine/ShapeEngine/Geometry/CellCollision/CellCollisionSystem.cs
    startLine: 165
  assemblies:
  - ShapeEngine
  namespace: ShapeEngine.Geometry.CellCollision
  summary: >-
    Request registration of a collider with the cell collision system.

    If the collider is currently scheduled for removal this frame, the add will be rejected.

    The collider is enqueued and will be processed by <xref href="ShapeEngine.Geometry.CellCollision.CellCollisionSystem.ProcessPendingColliders" data-throw-if-not-resolved="false"></xref> on the next update.
  example: []
  syntax:
    content: public bool Add(ICellCollider collider)
    parameters:
    - id: collider
      type: ShapeEngine.Geometry.CellCollision.ICellCollider
      description: The <xref href="ShapeEngine.Geometry.CellCollision.ICellCollider" data-throw-if-not-resolved="false"></xref> to add.
    return:
      type: System.Boolean
      description: >-
        True if the collider was successfully queued for addition; false if it was already scheduled for removal

        or already present in the add queue.
    content.vb: Public Function Add(collider As ICellCollider) As Boolean
  overload: ShapeEngine.Geometry.CellCollision.CellCollisionSystem.Add*
