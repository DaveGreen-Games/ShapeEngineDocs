    id: Remove
    path: ../ShapeEngine/ShapeEngine/Geometry/CellCollision/CellCollisionSystem.cs
    startLine: 182
  assemblies:
  - ShapeEngine
  namespace: ShapeEngine.Geometry.CellCollision
  summary: >-
    Schedule a collider to be unregistered from the collision system.

    If the collider is currently queued for addition this frame, it will be removed from the add queue.

    The actual removal will be processed by <xref href="ShapeEngine.Geometry.CellCollision.CellCollisionSystem.ProcessPendingColliders" data-throw-if-not-resolved="false"></xref> on the next update,

    which will call <xref href="ShapeEngine.Geometry.CellCollision.CellCollisionSystem.RemoveCollider(ShapeEngine.Geometry.CellCollision.ICellCollider)" data-throw-if-not-resolved="false"></xref> to perform the removal and trigger

    any necessary exit/collision end callbacks.
  example: []
  syntax:
    content: public bool Remove(ICellCollider collider)
    parameters:
    - id: collider
      type: ShapeEngine.Geometry.CellCollision.ICellCollider
      description: The <xref href="ShapeEngine.Geometry.CellCollision.ICellCollider" data-throw-if-not-resolved="false"></xref> instance to remove.
    return:
      type: System.Boolean
      description: >-
        True if the collider was successfully queued for removal (i.e. added to the internal removal set);

        false if it was already present in the removal queue.
    content.vb: Public Function Remove(collider As ICellCollider) As Boolean
  overload: ShapeEngine.Geometry.CellCollision.CellCollisionSystem.Remove*
