  namespace: ShapeEngine.Geometry
  summary: >-
    Exposes the canonical <xref href="ShapeEngine.Geometry.ShapeType" data-throw-if-not-resolved="false"></xref> for a concrete shape type.

    Implementers should return the <xref href="ShapeEngine.Geometry.ShapeType" data-throw-if-not-resolved="false"></xref> that represents the concrete

    shape instance.

    Consumers (for example <xref href="ShapeEngine.Geometry.ShapeHandle%601" data-throw-if-not-resolved="false"></xref>) can use this

    to perform fast, allocation-free type checks and mappings.
