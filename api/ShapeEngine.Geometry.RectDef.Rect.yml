  assemblies:
  - ShapeEngine
  namespace: ShapeEngine.Geometry.RectDef
  summary: Returns a new rectangle representing a progress bar with margins applied based on the specified progress and directions.
  remarks: >-
    This method is useful for creating progress bars in various directions, such as left-to-right, right-to-left, bottom-to-top, or center-outward.

    The margin values determine which sides of the rectangle are affected by the progress.
  example:
  - '<ul><li>Standard progress bar from left to right: Left: 0, <code>Right: 1</code>, Top: 0, Bottom: 0</li><li>Progress bar from right to left: <code>Left: 1</code>, Right: 0, Top: 0, Bottom: 0</li><li>Progress bar bottom to top: Left: 0, Right: 0, <code>Top: 1</code>, Bottom: 0</li><li>Progress bar top to bottom: Left: 0, Right: 0, Top: 0, <code>Bottom: 1</code></li><li>Progress bar from center to left and right: Left: <code>0.5f</code>, <code>Right: 0.5f</code>, Top: 0, Bottom: 0</li></ul>'
  syntax:
    content: public Rect GetProgressRect(float f, float left = 1, float right = 0, float top = 0, float bottom = 0)
    parameters:
    - id: f
      type: System.Single
      description: The progress value between 0 and 1, where 0 is empty and 1 is full.
    - id: left
      type: System.Single
      description: The fraction of progress that reduces the left margin (0 to 1).
    - id: right
      type: System.Single
      description: The fraction of progress that reduces the right margin (0 to 1).
    - id: top
      type: System.Single
      description: The fraction of progress that reduces the top margin (0 to 1).
    - id: bottom
      type: System.Single
      description: The fraction of progress that reduces the bottom margin (0 to 1).
    return:
      type: ShapeEngine.Geometry.RectDef.Rect
      description: A new <xref href="ShapeEngine.Geometry.RectDef.Rect" data-throw-if-not-resolved="false"></xref> with margins applied to represent the progress.
    content.vb: Public Function GetProgressRect(f As Single, left As Single = 1, right As Single = 0, top As Single = 0, bottom As Single = 0) As Rect
  overload: ShapeEngine.Geometry.RectDef.Rect.GetProgressRect*
  nameWithType.vb: Rect.GetProgressRect(Single, Single, Single, Single, Single)
  fullName.vb: ShapeEngine.Geometry.RectDef.Rect.GetProgressRect(Single, Single, Single, Single, Single)
  name.vb: GetProgressRect(Single, Single, Single, Single, Single)
