  assemblies:
  - ShapeEngine
  namespace: ShapeEngine.Geometry.RectDef
  summary: Returns the closest point on the rectangle (defined by four corners) to a given point.
  remarks: This method checks all four edges of the rectangle and returns the closest point on any edge.
  example: []
  syntax:
    content: public static Vector2 GetClosestPointRectPoint(Vector2 a, Vector2 b, Vector2 c, Vector2 d, Vector2 p, out float disSquared)
    parameters:
    - id: a
      type: System.Numerics.Vector2
      description: Top-left corner of the rectangle.
    - id: b
      type: System.Numerics.Vector2
      description: Bottom-left corner of the rectangle.
    - id: c
      type: System.Numerics.Vector2
      description: Bottom-right corner of the rectangle.
    - id: d
      type: System.Numerics.Vector2
      description: Top-right corner of the rectangle.
    - id: p
      type: System.Numerics.Vector2
      description: The point to find the closest point to.
    - id: disSquared
      type: System.Single
      description: The squared distance from <code class="paramref">p</code> to the closest point on the rectangle.
