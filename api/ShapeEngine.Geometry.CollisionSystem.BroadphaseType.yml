    id: BoundingBox
    path: ../ShapeEngine/ShapeEngine/Geometry/CollisionSystem/BroadphaseType.cs
    startLine: 16
  assemblies:
  - ShapeEngine
  namespace: ShapeEngine.Geometry.CollisionSystem
  summary: >-
    Balanced performance for general use cases.

    The bounding box is used for broadphase checks, but not the full shape.

    This is not recommended for very large objects. Especially large thin objects, like lines, segments, or rays.
  example: []
  syntax:
    content: BoundingBox = 1
    return:
      type: ShapeEngine.Geometry.CollisionSystem.BroadphaseType
