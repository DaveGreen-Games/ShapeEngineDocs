  summary: Initializes a new instance of the <xref href="ShapeEngine.Input.ModifierKeyGamepadButton" data-throw-if-not-resolved="false"></xref> class.
  remarks: >-
    The <code class="paramref">reverseModifier</code> parameter is used to prevent an input from being triggered when a modifier combination is pressed.

    For example, if you have two inputs: RB + A and A, configuring input A with RB as a reverse modifier ensures that pressing RB + A will not also trigger A.
  example: []
  syntax:
    content: public ModifierKeyGamepadButton(ShapeGamepadButton modifierKey, float joyAxisDeadzone = 0.15, float triggerAxisDeadzone = 0.15, bool reverseModifier = false)
    parameters:
    - id: modifierKey
      type: ShapeEngine.Input.ShapeGamepadButton
      description: The gamepad button to use as a modifier.
    - id: joyAxisDeadzone
      type: System.Single
      description: >-
        The deadzone threshold for joystick axes,
            used to ignore minor input noise.
    - id: triggerAxisDeadzone
      type: System.Single
      description: >-
        The deadzone threshold for trigger axes,
            used to ignore minor input noise.
    - id: reverseModifier
      type: System.Boolean
      description: If set to <code>true</code>, the modifier is considered active when the button is not pressed.
    content.vb: Public Sub New(modifierKey As ShapeGamepadButton, joyAxisDeadzone As Single = 0.15, triggerAxisDeadzone As Single = 0.15, reverseModifier As Boolean = False)
