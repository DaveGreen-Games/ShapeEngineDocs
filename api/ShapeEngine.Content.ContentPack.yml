- uid: ShapeEngine.Content.ContentPack.CreateCache(System.Boolean,System.Collections.Generic.List{System.String},System.String,System.Int32)
  commentId: M:ShapeEngine.Content.ContentPack.CreateCache(System.Boolean,System.Collections.Generic.List{System.String},System.String,System.Int32)
  id: CreateCache(System.Boolean,System.Collections.Generic.List{System.String},System.String,System.Int32)
  parent: ShapeEngine.Content.ContentPack
  langs:
  - csharp
  - vb
  name: CreateCache(bool, List<string>?, string, int)
  nameWithType: ContentPack.CreateCache(bool, List<string>?, string, int)
  fullName: ShapeEngine.Content.ContentPack.CreateCache(bool, System.Collections.Generic.List<string>?, string, int)
  type: Method
  source:
    remote:
      path: ShapeEngine/Content/ContentPack.cs
      branch: copilot/update-docs-publishing-pipeline
      repo: https://github.com/DaveGreen-Games/ShapeEngine.git
    id: CreateCache
    path: ../ShapeEngine/ShapeEngine/Content/ContentPack.cs
    startLine: 189
  assemblies:
  - ShapeEngine
  namespace: ShapeEngine.Content
  summary: >-
    Unpacks the content pack into memory, optionally using parallel processing.

    Skips files with extensions listed in <code class="paramref">extensionExceptions</code>.

    For text packs, allows batch size control via <code class="paramref">textFileUnpackingBatchSize</code>.

    Returns true if cache creation succeeds and files are loaded.
  remarks: >-
    Returns false if the content pack is already loaded or if the source file does not exist.

    Use <xref href="ShapeEngine.Content.ContentPack.IsLoaded" data-throw-if-not-resolved="false"></xref> to check load status.

    Use <xref href="ShapeEngine.Content.ContentPack.Clear" data-throw-if-not-resolved="false"></xref> to unload and clear the cache/index.
  example: []
  syntax:
    content: public bool CreateCache(bool parallelProcessing = false, List<string>? extensionExceptions = null, string directoryRestriction = "", int textFileUnpackingBatchSize = 16)
    parameters:
    - id: parallelProcessing
      type: System.Boolean
      description: If true, uses parallel processing for unpacking.
    - id: extensionExceptions
      type: System.Collections.Generic.List{System.String}
      description: List of file extensions to skip during unpacking.
    - id: directoryRestriction
      type: System.String
      description: >-
        If set, only files whose relative path starts with this directory restriction will be unpacked.

        Example: setting to `Audio/Music/Background` will only load resources within that directory path.
    - id: textFileUnpackingBatchSize
      type: System.Int32
      description: Batch size for parallel text file unpacking.
    return:
      type: System.Boolean
      description: True if cache was created and files loaded; otherwise, false.
    content.vb: Public Function CreateCache(parallelProcessing As Boolean = False, extensionExceptions As List(Of String) = Nothing, directoryRestriction As String = "", textFileUnpackingBatchSize As Integer = 16) As Boolean
  overload: ShapeEngine.Content.ContentPack.CreateCache*
  nameWithType.vb: ContentPack.CreateCache(Boolean, List(Of String), String, Integer)
  fullName.vb: ShapeEngine.Content.ContentPack.CreateCache(Boolean, System.Collections.Generic.List(Of String), String, Integer)
  name.vb: CreateCache(Boolean, List(Of String), String, Integer)
- uid: ShapeEngine.Content.ContentPack.CreateCacheAsync(System.Boolean,System.Collections.Generic.List{System.String},System.String,System.Int32,System.Threading.CancellationToken)
  commentId: M:ShapeEngine.Content.ContentPack.CreateCacheAsync(System.Boolean,System.Collections.Generic.List{System.String},System.String,System.Int32,System.Threading.CancellationToken)
  id: CreateCacheAsync(System.Boolean,System.Collections.Generic.List{System.String},System.String,System.Int32,System.Threading.CancellationToken)
