  fullName: ShapeEngine.Content.ContentPack.CreateCacheAsync(bool, System.Collections.Generic.List<string>?, string, int, System.Threading.CancellationToken)
  type: Method
  source:
    remote:
      path: ShapeEngine/Content/ContentPack.cs
      branch: copilot/update-docs-publishing-pipeline
      repo: https://github.com/DaveGreen-Games/ShapeEngine.git
    id: CreateCacheAsync
    path: ../ShapeEngine/ShapeEngine/Content/ContentPack.cs
    startLine: 276
  assemblies:
  - ShapeEngine
  namespace: ShapeEngine.Content
  summary: >-
    Asynchronously unpacks the content pack into memory, optionally using parallel processing.

    Use <xref href="ShapeEngine.Content.ContentPack.OnAsyncCacheLoaded" data-throw-if-not-resolved="false"></xref> event to get notified when loading is complete.

    Alternatively, await this method (see Example).
  remarks: >-
    Returns false if the content pack is already loaded or if the source file does not exist.

    Use <xref href="ShapeEngine.Content.ContentPack.IsLoaded" data-throw-if-not-resolved="false"></xref> to check load status.

    Use <xref href="ShapeEngine.Content.ContentPack.Clear" data-throw-if-not-resolved="false"></xref> to unload and clear the cache/index.
  example:
  - >-
    How to use CreateCacheAsync():


    <pre><code class="lang-csharp">public async Task LoadAndUseContentPackAsync()

    {
        var pack = new ContentPack("Resources/Pack.bin");
        bool loaded = await pack.CreateCacheAsync();

        if (loaded)
        {
            // Notify: ContentPack is ready
            // Now use pack normally
            var data = pack.GetFileData("Textures/Logo.png");
            // ... use data
        }
        else
        {
            // Notify: loading failed
        }
    }</code></pre>
  syntax:
    content: public Task<bool> CreateCacheAsync(bool parallelProcessing = false, List<string>? extensionExceptions = null, string directoryRestriction = "", int textFileUnpackingBatchSize = 16, CancellationToken cancellationToken = default)
    parameters:
    - id: parallelProcessing
      type: System.Boolean
      description: If true, uses parallel processing for unpacking.
    - id: extensionExceptions
      type: System.Collections.Generic.List{System.String}
      description: List of file extensions to skip during unpacking.
    - id: directoryRestriction
      type: System.String
      description: >-
        If set, only files whose relative path starts with this directory restriction will be unpacked.

        Example: setting to `Audio/Music/Background` will only load resources within that directory path.
    - id: textFileUnpackingBatchSize
      type: System.Int32
      description: Batch size for parallel text file unpacking.
    - id: cancellationToken
      type: System.Threading.CancellationToken
      description: Token to cancel the async operation.
    return:
      type: System.Threading.Tasks.Task{System.Boolean}
      description: True if cache was created and files loaded; otherwise, false.
    content.vb: Public Function CreateCacheAsync(parallelProcessing As Boolean = False, extensionExceptions As List(Of String) = Nothing, directoryRestriction As String = "", textFileUnpackingBatchSize As Integer = 16, cancellationToken As CancellationToken = Nothing) As Task(Of Boolean)
  overload: ShapeEngine.Content.ContentPack.CreateCacheAsync*
