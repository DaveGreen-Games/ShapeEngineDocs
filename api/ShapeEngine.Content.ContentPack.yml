  namespace: ShapeEngine.Content
  summary: >-
    Unpacks a binary content pack file into memory.

    Reads all files from the specified <code class="paramref">sourceFilePath</code>, decompresses them, and stores them in a dictionary.

    Skips files with extensions listed in <code class="paramref">extensionExceptions</code>.

    If <code class="paramref">debug</code> is true, logs detailed unpacking information.

    Returns a dictionary mapping relative file paths to their decompressed byte data.
  example: []
  syntax:
    content: public static Dictionary<string, byte[]> UnpackFileToMemory(string sourceFilePath, out long totalBytesUnpacked, List<string>? extensionExceptions = null, string directoryRestriction = "", bool debug = false)
    parameters:
    - id: sourceFilePath
      type: System.String
      description: The path to the packed binary file.
    - id: totalBytesUnpacked
      type: System.Int64
      description: Outputs the total number of bytes unpacked.
    - id: extensionExceptions
      type: System.Collections.Generic.List{System.String}
      description: Optional list of file extensions to skip during unpacking.
    - id: directoryRestriction
      type: System.String
      description: >-
        If set, only files whose relative path starts with this directory restriction will be unpacked.

        Example: setting to `Audio/Music/Background` will only load resources within that directory path.
    - id: debug
      type: System.Boolean
      description: If true, enables debug logging.
    return:
      type: System.Collections.Generic.Dictionary{System.String,System.Byte[]}
      description: A dictionary of relative file paths and their corresponding decompressed byte arrays.
