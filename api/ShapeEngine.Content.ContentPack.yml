    path: ../ShapeEngine/ShapeEngine/Content/ContentPack.cs
    startLine: 136
  assemblies:
  - ShapeEngine
  namespace: ShapeEngine.Content
  summary: >-
    Retrieves the file data for the specified file path from the content pack.

    Returns null if the content pack is not loaded or the file does not exist.
  remarks: >-
    For example, if the following directory structure was packed:


    <ul><li>Resources/</li><li>Resources/Textures/...</li><li>Resources/Sounds/...</li><li>Resources/Music/</li><li>Resources/Music/myBackgroundMusic.mp3</li><li>Resources/...</li></ul>


    The relative <code class="paramref">filePath</code> stored in the pack to access myBackgroundMusic.mp3 would be <code>Music/myBackgroundMusic.mp3</code>.
  example: []
  syntax:
    content: public byte[]? GetFileData(string filePath)
    parameters:
    - id: filePath
      type: System.String
      description: The relative path of the file within the content pack.
    return:
      type: System.Byte[]
      description: The file data as a byte array, or null if not found.
    content.vb: Public Function GetFileData(filePath As String) As Byte()
