    id: UnpackTextToMemoryParallelAsync
    path: ../ShapeEngine/ShapeEngine/Content/ContentPack.cs
    startLine: 1240
  assemblies:
  - ShapeEngine
  namespace: ShapeEngine.Content
  summary: >-
    Asynchronously unpacks a packed text file (.txt) into memory using parallel processing and batching.

    Each file is stored as two lines: the relative path and the base64-encoded compressed data.
  example:
  - >-
    <pre><code class="lang-csharp">public async Task LoadContentPackAsync()

    {
        string packPath = "Resources/Pack.bin";
        Dictionary string, byte[] files = await ContentPack.UnpackTextToMemoryParallelAsync(packPath);

        foreach (var kvp in files)
        {
            string filePath = kvp.Key;
            byte[] data = kvp.Value;
            // Use filePath and data as needed
            Console.WriteLine($"Loaded {filePath} ({data.Length} bytes)");
        }
    }</code></pre>
  syntax:
    content: public static Task<Dictionary<string, byte[]>> UnpackTextToMemoryParallelAsync(string sourceFilePath, Action<long>? setTotalBytesUnpacked = null, List<string>? extensionExceptions = null, string directoryRestriction = "", int batchSize = 16, bool debug = false)
    parameters:
    - id: sourceFilePath
      type: System.String
      description: The path to the packed text file (.txt).
    - id: setTotalBytesUnpacked
      type: System.Action{System.Int64}
      description: Optional callback to set the total number of bytes unpacked.
    - id: extensionExceptions
      type: System.Collections.Generic.List{System.String}
      description: Optional list of file extensions to skip during unpacking.
    - id: directoryRestriction
      type: System.String
      description: >-
        If set, only files whose relative path starts with this directory restriction will be unpacked.

        Example: setting to `Audio/Music/Background` will only load resources within that directory path.
    - id: batchSize
      type: System.Int32
      description: Batch size for parallel text file unpacking.
    - id: debug
      type: System.Boolean
      description: If true, enables debug logging.
    return:
      type: System.Threading.Tasks.Task{System.Collections.Generic.Dictionary{System.String,System.Byte[]}}
      description: >-
        A task that represents the asynchronous operation.
             The task result contains a dictionary of relative file paths and their corresponding decompressed byte arrays.
    content.vb: Public Shared Function UnpackTextToMemoryParallelAsync(sourceFilePath As String, setTotalBytesUnpacked As Action(Of Long) = Nothing, extensionExceptions As List(Of String) = Nothing, directoryRestriction As String = "", batchSize As Integer = 16, debug As Boolean = False) As Task(Of Dictionary(Of String, Byte()))
  overload: ShapeEngine.Content.ContentPack.UnpackTextToMemoryParallelAsync*
