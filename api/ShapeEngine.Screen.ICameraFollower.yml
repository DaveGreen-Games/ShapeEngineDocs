  namespace: ShapeEngine.Screen
  summary: Updates the follower's state based on the elapsed time and current camera rectangle.
  example: []
  syntax:
    content: Rect Update(float dt, Rect cameraRect)
    parameters:
    - id: dt
      type: System.Single
      description: The elapsed time since the last update, in seconds.
    - id: cameraRect
      type: ShapeEngine.Geometry.RectDef.Rect
