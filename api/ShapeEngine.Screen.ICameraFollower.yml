  assemblies:
  - ShapeEngine
  namespace: ShapeEngine.Screen
  summary: >-
    Defines methods for objects that follow or interact with a camera in the scene.

    Can update the camera's position and area based on a target.
  remarks: Implement this interface for objects that need to control or follow a camera, such as player or object tracking systems.
