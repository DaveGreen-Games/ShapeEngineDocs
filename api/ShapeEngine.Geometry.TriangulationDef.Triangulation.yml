    startLine: 389
  assemblies:
  - ShapeEngine
  namespace: ShapeEngine.Geometry.TriangulationDef
  summary: Recursively subdivides triangles in this triangulation using area limits, optional random retention, and narrow-triangle rejection, writing accepted triangles into <code class="paramref">result</code>.
  remarks: If the triangulation is empty, the method returns immediately without modifying <code class="paramref">result</code>. Unlike the other <code>Subdivide</code> overload, this method does not clear <code class="paramref">result</code> before appending accepted triangles.
  example: []
  syntax:
    content: public void Subdivide(Triangulation result, float minArea, float maxArea, float keepChance = 0.5, float narrowValue = 0.2)
    parameters:
    - id: result
      type: ShapeEngine.Geometry.TriangulationDef.Triangulation
      description: The destination triangulation that receives the accepted triangles.
    - id: minArea
      type: System.Single
      description: Triangles with area smaller than this value are kept without further subdivision.
    - id: maxArea
      type: System.Single
      description: Triangles with area greater than this value are always subdivided.
    - id: keepChance
      type: System.Single
      description: The probability of keeping a triangle whose area lies between <code class="paramref">minArea</code> and <code class="paramref">maxArea</code>. Values outside the range [0, 1] cause a probability to be derived from the triangle area.
    - id: narrowValue
      type: System.Single
      description: Triangles considered narrow by this threshold are kept without further subdivision.
    content.vb: Public Sub Subdivide(result As Triangulation, minArea As Single, maxArea As Single, keepChance As Single = 0.5, narrowValue As Single = 0.2)
