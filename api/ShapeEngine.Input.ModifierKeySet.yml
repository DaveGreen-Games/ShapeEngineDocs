    id: ModifierKeySet
    path: ../ShapeEngine/ShapeEngine/Input/ModifierKeySet.cs
    startLine: 27
  assemblies:
  - ShapeEngine
  namespace: ShapeEngine.Input
  summary: A set of modifier keys that are evaluated together based on a specified operator.
  remarks: >-
    This class is used to define combinations of modifier keys (like Shift, Ctrl, Alt)

    that must be active for an input to be triggered.

    The keys can be combined

    using either an <code>AND</code> or an <code>OR</code> logic.
  example:
  - >-
    <p>
     Any combination of modifier keys is allowed. However, gamepad-related modifier keys only function with gamepad-related input.
     </p>
     <p>
     For example, while <code>"[Shift] + Right Bumper"</code> is technically valid, the order and context matter: <code>"[Right Bumper] + Shift"</code> does not work because gamepad modifiers require a gamepad input context.
     Combinations like <code>"[Shift] + Left Mouse Button"</code> or <code>"[Middle Mouse Button] + Space"</code> are valid, as they involve keyboard or mouse modifiers.
     Always ensure that gamepad modifiers are paired with gamepad inputs for correct behavior.
     </p>
    <p>
     <code>So you can pair any modifier type with gamepad input, but gamepad modifiers will only work with gamepad input.</code>
     </p>
