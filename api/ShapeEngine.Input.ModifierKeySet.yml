    id: IsActive
    path: ../ShapeEngine/ShapeEngine/Input/ModifierKeySet.cs
    startLine: 206
  assemblies:
  - ShapeEngine
  namespace: ShapeEngine.Input
  summary: Checks if the modifier key set is currently active.
  remarks: >-
    <p>

    If the set is empty, this method returns <code>true</code>.

    (No modifier keys means no restrictions, so input should be allowed.)

    </p>


    For <xref href="ShapeEngine.Input.ModifierKeyOperator.And" data-throw-if-not-resolved="false"></xref>, all keys must be active.

    For <xref href="ShapeEngine.Input.ModifierKeyOperator.Or" data-throw-if-not-resolved="false"></xref>, at least one key must be active.
  example: []
  syntax:
    content: public bool IsActive(GamepadDevice? gamepad = null)
    parameters:
    - id: gamepad
      type: ShapeEngine.Input.GamepadDevice
      description: The gamepad device to check against. If <code>null</code>, only keyboard/mouse modifiers are considered. Default is <code>null</code>.
    return:
      type: System.Boolean
      description: <code>true</code> if the conditions of the modifier set are met; otherwise, <code>false</code>.
    content.vb: Public Function IsActive(gamepad As GamepadDevice = Nothing) As Boolean
