  assemblies:
  - ShapeEngine
  namespace: ShapeEngine.Geometry.QuadDef
  summary: >-
    Generates striped segments clipped to the given outside quad while excluding the area of an inside shape.

    The method casts parallel lines/rays across the outside quad and subtracts intersections with the

    provided inside shape to produce the final visible stripe segments.
  example: []
  syntax:
    content: 'public bool GenerateStripedSegments<T>(Segments result, T insideShape, float spacing, float angleDeg, float spacingOffset = 0) where T : IClosedShapeTypeProvider'
    parameters:
    - id: result
      type: ShapeEngine.Geometry.SegmentsDef.Segments
      description: The `Segments` collection to populate with stripe segments that lie inside this quad but outside the insideShape.
    - id: insideShape
      type: '{T}'
      description: Shape to be excluded from the stripes.
    - id: spacing
      type: System.Single
      description: Distance between adjacent stripes. Values = 0 will produce an empty result.
    - id: angleDeg
      type: System.Single
      description: Orientation of the stripes in degrees (0 = vertical, 90 = horizontal).
    - id: spacingOffset
      type: System.Single
      description: Normalized offset in the range [0,1] used to shift the pattern (useful for animation).
    typeParameters:
    - id: T
      description: >-
        Type of the inside shape.
            Allowed types are handled inside the method.
            Supported inside shape types: <xref href="ShapeEngine.Geometry.TriangleDef.Triangle" data-throw-if-not-resolved="false"></xref>, <xref href="ShapeEngine.Geometry.CircleDef.Circle" data-throw-if-not-resolved="false"></xref>,
            <xref href="ShapeEngine.Geometry.RectDef.Rect" data-throw-if-not-resolved="false"></xref>, <xref href="ShapeEngine.Geometry.QuadDef.Quad" data-throw-if-not-resolved="false"></xref>, <xref href="ShapeEngine.Geometry.PolygonDef.Polygon" data-throw-if-not-resolved="false"></xref>.
    return:
      type: System.Boolean
      description: <a href="https://learn.microsoft.com/dotnet/csharp/language-reference/builtin-types/bool">true</a> if at least one striped segment was generated and added to <code class="paramref">result</code>; otherwise, <a href="https://learn.microsoft.com/dotnet/csharp/language-reference/builtin-types/bool">false</a>.
    content.vb: Public Function GenerateStripedSegments(Of T As IClosedShapeTypeProvider)(result As Segments, insideShape As T, spacing As Single, angleDeg As Single, spacingOffset As Single = 0) As Boolean
