  assemblies:
  - ShapeEngine
  namespace: ShapeEngine.Geometry.QuadDef
  summary: Determines whether a point is contained within a quadrilateral defined by four vertices.
  remarks: >-
    Uses the even-odd rule for point-in-polygon testing.

    This rule is a common algorithm to determine if a point is inside a polygon:

    you draw a ray from the point and count how many times it crosses the polygon's edges.

    If the number of crossings is odd, the point is inside; if even, it's outside.

    This method is robust for convex and concave polygons, including quadrilaterals.
  example: []
  syntax:
    content: public static bool ContainsQuadPoint(Vector2 qA, Vector2 qB, Vector2 qC, Vector2 qD, Vector2 point)
    parameters:
    - id: qA
      type: System.Numerics.Vector2
      description: First vertex of the quad (CCW order).
    - id: qB
      type: System.Numerics.Vector2
      description: Second vertex of the quad (CCW order).
    - id: qC
      type: System.Numerics.Vector2
      description: Third vertex of the quad (CCW order).
    - id: qD
      type: System.Numerics.Vector2
      description: Fourth vertex of the quad (CCW order).
    - id: point
      type: System.Numerics.Vector2
      description: The point to test.
    return:
      type: System.Boolean
      description: <code>true</code> if the point is inside the quad; otherwise, <code>false</code>.
    content.vb: Public Shared Function ContainsQuadPoint(qA As Vector2, qB As Vector2, qC As Vector2, qD As Vector2, point As Vector2) As Boolean
  overload: ShapeEngine.Geometry.QuadDef.Quad.ContainsQuadPoint*
