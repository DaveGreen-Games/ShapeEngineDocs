  summary: Draws a striped pattern inside this quad while excluding the area covered by the specified inner shape.
  example: []
  syntax:
    content: 'public void DrawStriped<T>(T insideShape, float spacing, float angleDeg, LineDrawingInfo striped, float spacingOffset = 0) where T : IClosedShapeTypeProvider'
    parameters:
    - id: insideShape
      type: '{T}'
      description: The inner shape in which no stripes should be drawn.
    - id: spacing
      type: System.Single
      description: The distance between adjacent stripes. Values less than or equal to 0 produce no output.
    - id: angleDeg
      type: System.Single
      description: The stripe orientation in degrees, where 0 is vertical and 90 is horizontal.
    - id: striped
      type: ShapeEngine.Geometry.LineDrawingInfo
      description: The drawing information used for the generated stripe segments.
    - id: spacingOffset
      type: System.Single
      description: A normalized offset in the range \[0, 1\] used to shift the stripe pattern.
    typeParameters:
    - id: T
      description: >-
        The closed shape type to exclude from drawing.

        Supported runtime types are <xref href="ShapeEngine.Geometry.CircleDef.Circle" data-throw-if-not-resolved="false"></xref>, <xref href="ShapeEngine.Geometry.RectDef.Rect" data-throw-if-not-resolved="false"></xref>, <xref href="ShapeEngine.Geometry.QuadDef.Quad" data-throw-if-not-resolved="false"></xref>,

