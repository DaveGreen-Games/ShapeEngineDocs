      description: If true, draws the parts inside the mask instead of outside.
    typeParameters:
    - id: T
      description: >-
        The mask type. Must implement <xref href="ShapeEngine.Geometry.IClosedShapeTypeProvider" data-throw-if-not-resolved="false"></xref> to provide closed-shape semantics

        required for segment clipping.
