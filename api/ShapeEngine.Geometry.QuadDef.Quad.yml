  assemblies:
  - ShapeEngine
  namespace: ShapeEngine.Geometry.QuadDef
  summary: Draws a gapped outline for a quadrilateral, creating a dashed or segmented effect along the quad's perimeter.
  remarks: >-
    - If <code class="paramref">gapDrawingInfo.Gaps.Gaps</code> is 0 or <code class="paramref">gapDrawingInfo.GapPerimeterPercentage.GapPerimeterPercentage</code> is 0, the outline is drawn solid.

    - If <code class="paramref">gapDrawingInfo.GapPerimeterPercentage.GapPerimeterPercentage</code> is 1 or greater, no outline is drawn.
  example: []
  syntax:
    content: public float DrawGappedOutline(float perimeter, LineDrawingInfo lineInfo, GappedOutlineDrawingInfo gapDrawingInfo)
    parameters:
    - id: perimeter
      type: System.Single
      description: >-
        The total length of the quad's perimeter.

        If zero or negative, the method calculates it automatically.

        Providing a known length avoids redundant calculations and improves performance, especially for static segments.
    - id: lineInfo
      type: ShapeEngine.Geometry.LineDrawingInfo
      description: Parameters describing how to draw the outline.
    - id: gapDrawingInfo
      type: ShapeEngine.Core.Structs.GappedOutlineDrawingInfo
      description: Parameters describing the gap configuration.
    return:
      type: System.Single
      description: >-
        The perimeter of the quad if positive; otherwise, -1.

        If the shape does not change, the valid length can be reused in subsequent frames to avoid recalculating.
    content.vb: Public Function DrawGappedOutline(perimeter As Single, lineInfo As LineDrawingInfo, gapDrawingInfo As GappedOutlineDrawingInfo) As Single
