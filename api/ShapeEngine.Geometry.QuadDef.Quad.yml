    - id: color
      type: ShapeEngine.Color.ColorRgba
      description: The color used to draw the outline.
    - id: cornerLength
      type: System.Single
      description: The chamfer length applied uniformly to all four corners. If less than or equal to zero, the regular quad outline is drawn.
