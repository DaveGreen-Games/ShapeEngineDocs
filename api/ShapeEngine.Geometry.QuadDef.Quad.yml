  summary: Draws a quad with scaled sides based on a specific draw type.
  example: []
  syntax:
    content: public void DrawScaled(ColorRgba color, float sideScaleFactor, float sideScaleOrigin, int drawType)
    parameters:
    - id: color
      type: ShapeEngine.Color.ColorRgba
      description: The color of the drawn shape.
    - id: sideScaleFactor
      type: System.Single
      description: The scale factor of the sides (0 to 1). If &gt;= 1, the full quad is drawn. If &lt;= 0, nothing is drawn.
    - id: sideScaleOrigin
      type: System.Single
      description: The origin point for scaling the sides (0 = start, 1 = end, 0.5 = center).
    - id: drawType
      type: System.Int32
      description: >-
        The style of drawing:


        <ul><li>0: [Filled] Drawn as 6 filled triangles, effectively cutting off the corners.</li><li>1: [Sides] Each side is connected to the quad's center.</li><li>2: [Sides Inverse] The start of 1 side is connected to the end of the next side and is connected to the quad's center.</li></ul>
