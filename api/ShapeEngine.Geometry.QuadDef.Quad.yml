  syntax:
    content: public Quad ChangeDiagonalSize(float amount, AnchorPoint alignment)
    parameters:
    - id: amount
      type: System.Single
      description: >-
        The distance to add to each corner's current distance from the anchor point.

        Positive values expand the quad; negative values contract it.
    - id: alignment
      type: ShapeEngine.Core.Structs.AnchorPoint
      description: The anchor point used as the origin for the diagonal resize.
    return:
      type: ShapeEngine.Geometry.QuadDef.Quad
      description: A new <xref href="ShapeEngine.Geometry.QuadDef.Quad" data-throw-if-not-resolved="false"></xref> with all corners adjusted radially from the anchor point.
