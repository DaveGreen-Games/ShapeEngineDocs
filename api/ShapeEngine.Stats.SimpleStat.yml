      type: System.UInt32
      description: The unique identifier for the modifier.
    - id: value
      type: System.Single
      description: The value of the modifier.
    - id: kind
      type: ShapeEngine.Stats.StatModifierKind
      description: The kind of modifier.
    - id: duration
      type: System.Single
      description: The duration of the modifier. Use <xref href="ShapeEngine.Stats.SimpleStat.PermanentDuration" data-throw-if-not-resolved="false"></xref> for permanent modifiers. 0 counts as permanent too!
    - id: stacks
      type: System.Int32
      description: The number of stacks to start with.
    - id: maxStacks
      type: System.Int32
      description: The maximum number of stacks allowed for this modifier.
    - id: priority
      type: System.Int32
      description: The priority of the modifier (used for override, min, and max kinds).
    return:
      type: System.Boolean
      description: True if the modifier was successfully added or updated; otherwise, false.
