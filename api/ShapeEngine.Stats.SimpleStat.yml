- uid: ShapeEngine.Stats.SimpleStat.BoundsModifierTieBehaviourId
  commentId: F:ShapeEngine.Stats.SimpleStat.BoundsModifierTieBehaviourId
  id: BoundsModifierTieBehaviourId
  parent: ShapeEngine.Stats.SimpleStat
  langs:
