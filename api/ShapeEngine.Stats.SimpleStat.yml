  type: Field
  source:
    remote:
      path: ShapeEngine/Stats/SimpleStat.cs
      branch: main
      repo: https://github.com/DaveGreen-Games/ShapeEngine.git
    id: BoundsModifierTieBehaviourId
    path: ../ShapeEngine/ShapeEngine/Stats/SimpleStat.cs
    startLine: 64
  assemblies:
  - ShapeEngine
  namespace: ShapeEngine.Stats
  summary: >-
    Determines how tied priorities are resolved when multiple <xref href="ShapeEngine.Stats.StatModifierKind.Min" data-throw-if-not-resolved="false"></xref> or <xref href="ShapeEngine.Stats.StatModifierKind.Max" data-throw-if-not-resolved="false"></xref> modifiers compete.

    When <code>true</code>, the modifier with the higher ID takes precedence.

    When <code>false</code>, the stricter bound is applied (highest minimum or lowest maximum).
  example:
  - >-
    <p>Min Modifier Tie Resolution:</p>

    <ul><li>Min modifier: 10 (priority 5)</li><li>Min modifier: 20 (priority 3)</li><li>When <code>true</code>: value of 10 is used (higher ID wins).</li><li>When <code>false</code>: value of 20 is used (stricter lower bound wins).</li></ul>

    <p>Max Modifier Tie Resolution:</p>

    <ul><li>Max modifier: 100 (priority 5)</li><li>Max modifier: 60 (priority 3)</li><li>When <code>true</code>: value of 100 is used (higher ID wins).</li><li>When <code>false</code>: value of 60 is used (stricter upper bound wins).</li></ul>
  syntax:
    content: public static bool BoundsModifierTieBehaviourId
    return:
      type: System.Boolean
    content.vb: Public Shared BoundsModifierTieBehaviourId As Boolean
