    id: SimpleStat
    path: ../ShapeEngine/ShapeEngine/Stats/SimpleStat.cs
    startLine: 33
  assemblies:
  - ShapeEngine
  namespace: ShapeEngine.Stats
  summary: >-
    Represents a simple stat with a base value and modifiers that affect it.

    Use SimpleStat When:


    <ul><li>Small-scale games: Mobile puzzle game with 3-5 stats</li><li>Prototypes: Quick iteration, don't need polish</li><li>Isolated systems: One-off calculations, temporary stats</li><li>Performance-critical: Thousands of stat instances updated per frame</li><li>No UI needs: Players don't need to see "why" values are what they are</li></ul>


    For are more advanced systems, use <xref href="ShapeEngine.Stats.StatSet" data-throw-if-not-resolved="false"></xref>.
  remarks: <ul><li>A base value and upper/lower bounds can be set.</li><li>Modifiers can be added, removed, and stacks of modifiers can be adjusted (reduced, increased).</li><li>Modifiers have an ID to identify them.</li><li>Modifiers can be permanent or timed. Timed modifiers that will run out are completely removed.</li><li>Adding stacks refreshes the modifier's remaining duration, if it is timed.</li><li>Removing stacks to 0 or below will remove the modifier.</li><li>Max stacks can be used to cap the stack number that can be reached. Timer will still be refreshed on timed modifiers.</li><li>There are flat, additive percentage, multiplicative percentage, override, min, and max modifiers.</li><li>Flat modifiers are summed up and added to the base value. Stacks apply.</li><li>Additive percentage modifiers are summed up and then multiplied with the current value. Stacks apply.</li><li>Each multiplicative modifier is multiplied with the current value separately for the amount of stacks it has.</li><li>If at least 1 override modifier is active the override value with the highest priority is used to set the current value directly. No flat or percentage modifiers are applied. Stacks are ignored.</li><li>The min and max modifiers with the highest priority are used to clamp the current value. Stacks are ignored.</li><li>The stats bounds are used (if set) to clamp the current value.</li><li>If priority is tied for 2 modifiers, the modifier with the higher ID wins.</li></ul>
  example: []
  syntax:
    content: public class SimpleStat
    content.vb: Public Class SimpleStat
