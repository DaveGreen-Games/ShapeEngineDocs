  name: ShapeClipperFillRule
  nameWithType: ShapeClipperFillRule
  fullName: ShapeEngine.ShapeClipper.ShapeClipperFillRule
  type: Enum
  source:
    remote:
      path: ShapeEngine/ShapeClipper/ShapeClipperFillRule.cs
      branch: copilot/update-docs-publishing-pipeline
      repo: https://github.com/DaveGreen-Games/ShapeEngine.git
    id: ShapeClipperFillRule
    path: ../ShapeEngine/ShapeEngine/ShapeClipper/ShapeClipperFillRule.cs
    startLine: 28
  assemblies:
  - ShapeEngine
  namespace: ShapeEngine.ShapeClipper
  summary: >-
    Filling rules determine which sub-regions of complex polygons are considered "inside".

    Complex polygons are defined by one or more closed contours; only portions of these contours

    may contribute to filled regions, so a filling rule is required to decide which sub-regions

    are treated as inside when performing clipping operations.
  remarks: >-
    The supported fill rules are based on winding numbers derived from the orientation of each path:


    <ul><li>Even-Odd: toggles inside/outside each time a contour is crossed.</li><li>Non-Zero: considers the sum of winding contributions; non-zero means inside.</li><li>Positive / Negative: depend on the sign of the winding number.</li></ul>


    Notes:


    <ul><li>The most commonly used rules are Even-Odd and Non-Zero.</li><li>Reversing a path reverses its orientation (and the sign of winding numbers) but does not affect parity or whether a winding number is zero.</li><li>Filling rules are required only for clipping operations; they do not affect polygon offsetting.</li></ul>
  example:
  - >-
    Example algorithm (winding number):

    From a point outside the polygon draw a ray through the polygon. Start with winding number 0.

    For each contour crossed, increment the winding number if the crossing goes right-to-left

    relative to the ray, otherwise decrement. Each sub-region gets the current winding number.
  syntax:
    content: public enum ShapeClipperFillRule
    content.vb: Public Enum ShapeClipperFillRule
