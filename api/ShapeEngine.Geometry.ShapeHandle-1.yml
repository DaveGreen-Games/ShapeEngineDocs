            Supports: <xref href="ShapeEngine.Geometry.SegmentDef.Segment" data-throw-if-not-resolved="false"></xref>, <xref href="ShapeEngine.Geometry.LineDef.Line" data-throw-if-not-resolved="false"></xref>, <xref href="ShapeEngine.Geometry.RayDef.Ray" data-throw-if-not-resolved="false"></xref>, <xref href="ShapeEngine.Geometry.CircleDef.Circle" data-throw-if-not-resolved="false"></xref>
