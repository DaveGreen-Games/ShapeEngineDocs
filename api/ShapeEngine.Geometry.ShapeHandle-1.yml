  namespace: ShapeEngine.Geometry
  summary: A lightweight, readonly handle that wraps a non-null shape instance of type <code class="typeparamref">T</code>.
  remarks: >-
    Exposes the wrapped value via <xref href="ShapeEngine.Geometry.ShapeHandle%601.Value" data-throw-if-not-resolved="false"></xref> and a cached <xref href="ShapeEngine.Geometry.ShapeHandle%601.ShapeType" data-throw-if-not-resolved="false"></xref>.

    Provides fast type-aware accessors (TryGet) for the underlying shape.
  example: []
  syntax:
    content: 'public readonly struct ShapeHandle<T> where T : IShapeTypeProvider'
    typeParameters:
    - id: T
      description: >-
