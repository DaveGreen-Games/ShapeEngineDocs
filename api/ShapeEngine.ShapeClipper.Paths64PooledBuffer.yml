  summary: Resizes <xref href="ShapeEngine.ShapeClipper.Paths64PooledBuffer.Buffer" data-throw-if-not-resolved="false"></xref> to contain exactly <code class="paramref">targetCount</code> paths by renting or returning pooled paths as needed.
