  namespace: ShapeEngine.ShapeClipper
  summary: Maintains a reusable <xref href="Clipper2Lib.Paths64" data-throw-if-not-resolved="false"></xref> buffer backed by a pool of <xref href="Clipper2Lib.Path64" data-throw-if-not-resolved="false"></xref> instances.
  remarks: >-
    This type helps reduce allocations when repeatedly resizing collections of Clipper paths.

    Paths moved out of <xref href="ShapeEngine.ShapeClipper.Paths64PooledBuffer.Buffer" data-throw-if-not-resolved="false"></xref> are returned to the internal pool for later reuse.
