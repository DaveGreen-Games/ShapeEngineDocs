  assemblies:
  - ShapeEngine
  namespace: ShapeEngine.Input
  summary: >-
    Initializes a new instance of the <xref href="ShapeEngine.Input.InputDeviceUsageDetectionSettings.MouseSettings" data-throw-if-not-resolved="false"></xref> struct with custom detection, move threshold, and wheel threshold values.

    Other values are set to their defaults: MinPressCount = 2, MinPressInterval = 1f, MinUsedDuration = 0.5f.
  example: []
  syntax:
    content: public MouseSettings(bool detection, float moveThreshold, float wheelThreshold, float selectionCooldownDuration = 2, HashSet<ShapeMouseButton>? exceptionButtons = null)
    parameters:
    - id: detection
      type: System.Boolean
      description: Indicates whether mouse detection is enabled.
    - id: moveThreshold
      type: System.Single
      description: The minimum movement threshold to consider the mouse as "used".
    - id: wheelThreshold
      type: System.Single
      description: The minimum mouse wheel movement threshold to consider the mouse as "used".
    - id: selectionCooldownDuration
      type: System.Single
      description: >-
        Specifies the cooldown duration (in seconds) after this device is selected

        during which no other input device can be selected.

        <code>Default is 2 seconds.</code>
    - id: exceptionButtons
      type: System.Collections.Generic.HashSet{ShapeEngine.Input.ShapeMouseButton}
      description: The set of mouse buttons that will never select this device, even if pressed.
