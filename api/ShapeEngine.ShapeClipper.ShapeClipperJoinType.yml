    id: Round
    path: ../ShapeEngine/ShapeEngine/ShapeClipper/ShapeClipperJoinType.cs
    startLine: 32
  assemblies:
  - ShapeEngine
  namespace: ShapeEngine.ShapeClipper
  summary: >-
    Convex joins are rounded using an arc with radius equal to the offset distance and the

    original join vertex as the arc center.
  example: []
  syntax:
    content: Round = 3
    return:
      type: ShapeEngine.ShapeClipper.ShapeClipperJoinType
