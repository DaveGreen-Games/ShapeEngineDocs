    id: Square
    path: ../ShapeEngine/ShapeEngine/ShapeClipper/ShapeClipperJoinType.cs
    startLine: 20
  assemblies:
  - ShapeEngine
  namespace: ShapeEngine.ShapeClipper
  summary: >-
    Convex joins are truncated with a squared edge. The midpoint of the squared edge is

    exactly the offset distance from the original vertex.
  example: []
  syntax:
    content: Square = 1
    return:
      type: ShapeEngine.ShapeClipper.ShapeClipperJoinType
