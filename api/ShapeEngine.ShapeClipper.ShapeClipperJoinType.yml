  source:
    remote:
      path: ShapeEngine/ShapeClipper/ShapeClipperJoinType.cs
      branch: main
      repo: https://github.com/DaveGreen-Games/ShapeEngine.git
    id: Miter
    path: ../ShapeEngine/ShapeEngine/ShapeClipper/ShapeClipperJoinType.cs
    startLine: 14
  assemblies:
  - ShapeEngine
  namespace: ShapeEngine.ShapeClipper
  summary: >-
    Edges are offset a specified distance and extended to their intersection points.

    A miter limit is enforced to prevent very long spikes at acute angles; when the limit is

    exceeded the join is converted to a squared/bevel form.
  example: []
  syntax:
    content: Miter = 0
    return:
      type: ShapeEngine.ShapeClipper.ShapeClipperJoinType
