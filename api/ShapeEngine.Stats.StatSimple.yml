  assemblies:
  - ShapeEngine
  namespace: ShapeEngine.Stats
  summary: Represents a simple stat with a base value and a current value that reflects all applied buffs.
  remarks: Add or remove buff values to modify the total buff. <xref href="ShapeEngine.Stats.StatSimple.CurValue" data-throw-if-not-resolved="false"></xref> always reflects the base value with all buffs applied.
  example:
  - >-
    <pre><code class="lang-csharp">var id = 1;

    var baseValue = 10f;

    var stat = new StatSimple(id, baseValue);

    var flatValue = 4f;

    var bonusValue = 1f; (+100%)

    stat.AddBuff(new BuffValue(bonusValue, flatValue));

    float current = stat.CurValue; // 28 -&gt; (10 + flatValue) * (1 + bonusValue)</code></pre>
  syntax:
