  summary: Draws the outline of a polygon with a color gradient between the start and end colors.
  remarks: The outline is drawn by interpolating the color between the start and end colors for each segment.
  example: []
  syntax:
    content: public static void DrawOutline(this List<Vector2> points, float lineThickness, ColorRgba startColorRgba, ColorRgba endColorRgba, LineCapType capType = LineCapType.CappedExtended, int capPoints = 2)
