  summary: Draws cornered outlines for a polygon using <xref href="ShapeEngine.Geometry.LineDrawingInfo" data-throw-if-not-resolved="false"></xref> and a uniform relative corner factor.
  remarks: A corner is drawn from the <code>previous point [i-1]</code> to the <code>current point [i]</code> to the <code>next point [i+1]</code>
  example: []
  syntax:
    content: public static void DrawOutlineCorneredRelative(this List<Vector2> points, LineDrawingInfo lineInfo, float cornerF)
    parameters:
    - id: points
      type: System.Collections.Generic.List{System.Numerics.Vector2}
      description: The list of points defining the polygon.
    - id: lineInfo
      type: ShapeEngine.Geometry.LineDrawingInfo
      description: The line drawing information (thickness, color, cap type, etc.).
    - id: cornerF
      type: System.Single
      description: >-
        A uniform factor (0-1) for each corner, representing the relative length.

        <ul><li>Previous to current is interpolated with <code class="paramref">cornerF</code>. </li><li>Current to next is interpolated with <code class="paramref">cornerF</code>. </li></ul>
