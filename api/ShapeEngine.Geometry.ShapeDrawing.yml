  namespace: ShapeEngine.Geometry
  summary: Draws cornered outlines for a polygon, using relative corner factors.
  remarks: >-
    Each corner is drawn with a length relative to the side, allowing for proportional corner effects.

    A corner is drawn from the <code>previous point [i-1]</code> to the <code>current point [i]</code> to the <code>next point [i+1]</code>.
  example: []
  syntax:
    content: public static void DrawOutlineCorneredRelative(this List<Vector2> points, float lineThickness, ColorRgba color, List<float> cornerFactors, LineCapType capType = LineCapType.CappedExtended, int capPoints = 2)
    parameters:
    - id: points
      type: System.Collections.Generic.List{System.Numerics.Vector2}
      description: The list of points defining the polygon.
    - id: lineThickness
      type: System.Single
      description: The thickness of the outline.
    - id: color
      type: ShapeEngine.Color.ColorRgba
      description: The color of the outline.
    - id: cornerFactors
      type: System.Collections.Generic.List{System.Single}
      description: >-
        A list of factors (0-1) for each corner, representing the relative length.

        <ul><li>Previous to current is interpolated with the specified corner factor. </li><li>Current to next is interpolated with the specified corner factor. </li></ul>
    - id: capType
      type: ShapeEngine.Geometry.LineCapType
      description: The type of line cap to use at the ends of each segment.
    - id: capPoints
      type: System.Int32
      description: The number of points used for the cap.
