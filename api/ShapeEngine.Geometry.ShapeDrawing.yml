      description: The line drawing information (thickness, color, cap type, etc.).
    - id: sideScaleFactor
      type: System.Single
      description: >-
        The scale factor for each side:

        <ul><li>0: no polygon is drawn</li><li>1: the normal polygon is drawn</li><li>0.5: each side is half as long</li></ul>
    - id: sideScaleOrigin
      type: System.Single
      description: >-
        The point along the line to scale from, in both directions. 

        Default is 0.5 (midpoint).
