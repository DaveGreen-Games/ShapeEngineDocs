  assemblies:
  - ShapeEngine
  namespace: ShapeEngine.Geometry
  summary: Draws a specified percentage of the polygon's outline.
  remarks: Useful for progress indicators or animated outlines.
  example: []
  syntax:
    content: public static void DrawOutlinePercentage(this List<Vector2> shapePoints, float f, float lineThickness, ColorRgba color, LineCapType capType = LineCapType.CappedExtended, int capPoints = 2)
    parameters:
    - id: shapePoints
      type: System.Collections.Generic.List{System.Numerics.Vector2}
      description: The list of points defining the polygon.
    - id: f
      type: System.Single
      description: >-
        The percentage of the outline to draw, with the following behavior:

        <ul><li>If negative, the outline is drawn in the clockwise direction.</li><li>The integer part determines the starting corner index.</li><li>The fractional part determines the percentage of the outline to draw.</li><li>Example: <code>0.35</code> starts at corner 0 and draws 35% in CCW; <code>-2.7</code> starts at corner 2 and draws 70% in CW.</li></ul>
    - id: lineThickness
      type: System.Single
      description: The thickness of the outline.
    - id: color
      type: ShapeEngine.Color.ColorRgba
      description: The color of the outline.
    - id: capType
      type: ShapeEngine.Geometry.LineCapType
      description: The type of line cap to use at the ends of each segment.
    - id: capPoints
      type: System.Int32
      description: The number of points used for the cap.
    content.vb: Public Shared Sub DrawOutlinePercentage(shapePoints As List(Of Vector2), f As Single, lineThickness As Single, color As ColorRgba, capType As LineCapType = LineCapType.CappedExtended, capPoints As Integer = 2)
