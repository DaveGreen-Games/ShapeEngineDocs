    - id: broadphase
      type: ShapeEngine.Geometry.CollisionSystem.IBroadphase
      description: The broadphase algorithm to use for collision detection.
    - id: startingCapacity
      type: System.Int32
      description: The initial capacity for the collision handler. Default is 1024.
    return:
      type: System.Boolean
      description: Returns true if a new <xref href="ShapeEngine.Core.Scene.CollisionHandler" data-throw-if-not-resolved="false"></xref> was created; false if one already exists.
