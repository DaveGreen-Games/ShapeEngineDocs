  summary: >-
    Minimum length (in world units) that a segment must have to be drawn.

    Segments with a squared length less than <xref href="ShapeEngine.Geometry.SegmentDef.SegmentDrawing.MinSegmentDrawLengthSquared" data-throw-if-not-resolved="false"></xref> are skipped to avoid rendering

    extremely short or degenerate geometry that can cause visual artifacts or unnecessary draw calls.
