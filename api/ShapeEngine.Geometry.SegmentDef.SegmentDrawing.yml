  assemblies:
  - ShapeEngine
  namespace: ShapeEngine.Geometry.SegmentDef
  summary: >-
    Draws the portion(s) of <code class="paramref">segment</code> that are masked by a generic closed-shape <code class="paramref">mask</code>.

    This generic overload dispatches to the concrete shape-specific overload (Circle, Triangle, Quad, Rect, or Polygon)

    based on <code>mask.GetClosedShapeType()</code>.
  remarks: >-
    If the concrete mask type is not one of the supported closed shapes, no drawing occurs.

    Use the concrete overloads when the exact mask type is known to avoid the runtime dispatch and cast.
  example: []
  syntax:
    content: 'public static void DrawMasked<T>(this Segment segment, T mask, LineDrawingInfo lineInfo, bool reversedMask = false) where T : IClosedShapeTypeProvider'
    parameters:
    - id: segment
      type: ShapeEngine.Geometry.SegmentDef.Segment
      description: The segment to be drawn or clipped against the mask.
    - id: mask
      type: '{T}'
      description: The mask shape that provides its closed-shape type. The method will attempt to cast to the concrete shape type.
    - id: lineInfo
      type: ShapeEngine.Geometry.LineDrawingInfo
      description: Drawing parameters (thickness, color, cap type and cap points).
    - id: reversedMask
      type: System.Boolean
      description: >-
        If <code>false</code> draw the parts of the segment outside the mask (default).

        If <code>true</code> draw the parts of the segment inside the mask.
    typeParameters:
    - id: T
