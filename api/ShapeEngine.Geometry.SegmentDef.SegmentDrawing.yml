  remarks: Creates a gradient glow effect along each segment.
  example: []
  syntax:
    content: public static void DrawGlow(this Segments segments, float width, float endWidth, ColorRgba color, ColorRgba endColorRgba, int steps, LineCapType capType = LineCapType.None, int capPoints = 0)
    parameters:
    - id: segments
      type: ShapeEngine.Geometry.SegmentsDef.Segments
      description: The collection of segments to draw with a glow effect.
    - id: width
