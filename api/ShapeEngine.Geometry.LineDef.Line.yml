      description: >-
        A <xref href="ShapeEngine.Geometry.CollisionSystem.ClosestPointResult" data-throw-if-not-resolved="false"></xref> containing the closest points on both lines, their normals, and the squared distance between them.

        If the lines intersect, the points are identical and the distance is zero. If the lines are parallel, an empty result is returned.
