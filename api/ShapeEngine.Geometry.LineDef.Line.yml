  assemblies:
  - ShapeEngine
  namespace: ShapeEngine.Geometry.LineDef
  summary: Determines whether an infinite line and a polygon overlap (i.e., the line passes through or touches the polygon).
  example: []
  syntax:
    content: public static bool OverlapLinePolygon(Vector2 linePoint, Vector2 lineDirection, List<Vector2> points)
    parameters:
    - id: linePoint
      type: System.Numerics.Vector2
      description: A point on the infinite line.
    - id: lineDirection
      type: System.Numerics.Vector2
      description: The direction vector of the infinite line.
    - id: points
      type: System.Collections.Generic.List{System.Numerics.Vector2}
      description: A list of vertices defining the polygon. The polygon is assumed to be closed and non-self-intersecting.
    return:
      type: System.Boolean
      description: True if the line and polygon overlap; otherwise, false.
    content.vb: Public Shared Function OverlapLinePolygon(linePoint As Vector2, lineDirection As Vector2, points As List(Of Vector2)) As Boolean
