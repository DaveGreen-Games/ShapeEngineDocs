  summary: Determines whether this instance is equal to another <xref href="ShapeEngine.Geometry.LineDef.Line" data-throw-if-not-resolved="false"></xref> using quantized comparison.
  remarks: >-
    For valid lines, equality depends on a canonicalized direction and the line's perpendicular offset from the origin.

