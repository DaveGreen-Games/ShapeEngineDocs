      description: The direction vector of the infinite line.
    - id: points
      type: System.Collections.Generic.List{System.Numerics.Vector2}
      description: A list of vertices defining the polyline. The polyline is assumed to be open and non-self-intersecting.
    return:
      type: System.Boolean
      description: True if the line and polyline overlap; otherwise, false.
