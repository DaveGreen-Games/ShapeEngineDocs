    - id: rayPoint
      type: System.Numerics.Vector2
      description: The starting point of the ray.
    - id: rayDirection
      type: System.Numerics.Vector2
      description: The direction vector of the ray.
    - id: disSquared
      type: System.Single
      description: Outputs the squared distance between the closest points on the line and the ray.
    return:
      type: System.ValueTuple{System.Numerics.Vector2,System.Numerics.Vector2}
      description: A tuple containing the closest point on the line and the closest point on the ray, respectively.
