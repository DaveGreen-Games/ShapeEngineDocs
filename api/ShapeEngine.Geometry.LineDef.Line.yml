  - ShapeEngine
  namespace: ShapeEngine.Geometry.LineDef
  summary: Calculates the closest points between this line and another line.
  example: []
  syntax:
    content: public ClosestPointResult GetClosestPoint(Line other)
    parameters:
    - id: other
      type: ShapeEngine.Geometry.LineDef.Line
