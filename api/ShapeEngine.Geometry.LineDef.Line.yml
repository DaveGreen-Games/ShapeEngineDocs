  assemblies:
  - ShapeEngine
  namespace: ShapeEngine.Geometry.LineDef
  summary: Determines whether an infinite line overlaps (intersects) with any segment in a list of segments.
  example: []
  syntax:
    content: public static bool OverlapLineSegments(Vector2 linePoint, Vector2 lineDirection, List<Segment> segments)
    parameters:
    - id: linePoint
      type: System.Numerics.Vector2
      description: A point on the infinite line.
    - id: lineDirection
      type: System.Numerics.Vector2
      description: The direction vector of the infinite line.
    - id: segments
      type: System.Collections.Generic.List{ShapeEngine.Geometry.SegmentDef.Segment}
      description: A list of <xref href="ShapeEngine.Geometry.SegmentDef.Segment" data-throw-if-not-resolved="false"></xref> objects to check for overlap with the line.
    return:
      type: System.Boolean
      description: True if the line overlaps with any segment in the list; otherwise, false.
    content.vb: Public Shared Function OverlapLineSegments(linePoint As Vector2, lineDirection As Vector2, segments As List(Of Segment)) As Boolean
