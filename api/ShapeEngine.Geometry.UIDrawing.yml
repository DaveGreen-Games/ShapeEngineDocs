  fullName.vb: ShapeEngine.Geometry.UIDrawing.DrawBar(ShapeEngine.Geometry.RectDef.Rect, Single, ShapeEngine.Color.ColorRgba, ShapeEngine.Color.ColorRgba, Single, Single, Single, Single)
  name.vb: DrawBar(Rect, Single, ColorRgba, ColorRgba, Single, Single, Single, Single)
