  assemblies:
  - ShapeEngine
  namespace: ShapeEngine.Geometry
  summary: Draws a filled bar inside a rectangle, representing progress with customizable margins and colors.
  remarks: >-
    The bar is drawn inside the rectangle, with the filled area shrinking as the progress value increases.

    The default margin values represent a bar that fills from the left to the right.
  example:
  - <ul><li>left 1, right 0, top 0, bottom 0 -&gt; bar fills from right to left. </li><li>left 0, right 0, top 1, bottom 0 -&gt; bar fills from bottom to top. </li><li>left 0, right 0, top 0, bottom 1 -&gt; bar fills from top to bottom. </li><li>left 0.5, right 0.5, top 0, bottom 0 -&gt; bar fills from center to left and right edges. </li></ul>
  syntax:
    content: public static void DrawBar(this Rect rect, float f, ColorRgba barColorRgba, ColorRgba bgColorRgba, float left = 0, float right = 1, float top = 0, float bottom = 0)
    parameters:
    - id: rect
      type: ShapeEngine.Geometry.RectDef.Rect
      description: The rectangle to draw the bar in.
    - id: f
      type: System.Single
      description: The progress value (0 to 1) indicating how much of the bar to fill.
    - id: barColorRgba
      type: ShapeEngine.Color.ColorRgba
      description: The color of the filled bar.
    - id: bgColorRgba
      type: ShapeEngine.Color.ColorRgba
      description: The background color of the rectangle.
    - id: left
      type: System.Single
      description: The left margin <code>left * (1 - f)</code> to determine the fill behavior (default 0).
    - id: right
      type: System.Single
      description: The right margin <code>right * (1 - f)</code> to determine the fill behavior (default 1).
    - id: top
      type: System.Single
      description: The top margin <code>top * (1 - f)</code> to determine the fill behavior  (default 0).
    - id: bottom
      type: System.Single
      description: The bottom margin <code>bottom * (1 - f)</code> to determine the fill behavior (default 0).
    content.vb: Public Shared Sub DrawBar(rect As Rect, f As Single, barColorRgba As ColorRgba, bgColorRgba As ColorRgba, left As Single = 0, right As Single = 1, top As Single = 0, bottom As Single = 0)
