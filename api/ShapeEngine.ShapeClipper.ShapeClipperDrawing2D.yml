  assemblies:
  - ShapeEngine
  namespace: ShapeEngine.ShapeClipper
  summary: Provides immediate-style drawing helpers for polygons and polylines backed by ShapeClipper triangulation.
  remarks: >-
    These helpers generate temporary triangulated meshes through <xref href="ShapeEngine.ShapeClipper.ShapeClipperTriangulation2D" data-throw-if-not-resolved="false"></xref>

    and draw them immediately using a shared reusable <xref href="ShapeEngine.ShapeClipper.TriMesh" data-throw-if-not-resolved="false"></xref> buffer.

    The class is intended for sequential use and is not thread-safe.
