  assemblies:
  - ShapeEngine
  namespace: ShapeEngine.Core.Shapes
  summary: Calculates the closest points between two infinite lines in 2D space.
  remarks: If the lines intersect, the returned points are identical and <code class="paramref">disSquared</code> is 0. If the lines are parallel, the original points are returned and <code class="paramref">disSquared</code> is -1.
  example: []
  syntax:
    content: public static (Vector2 self, Vector2 other) GetClosestPointLineLine(Vector2 line1Point, Vector2 line1Direction, Vector2 line2Point, Vector2 line2Direction, out float disSquared)
    parameters:
    - id: line1Point
      type: System.Numerics.Vector2
      description: A point on the first line.
    - id: line1Direction
      type: System.Numerics.Vector2
      description: The direction vector of the first line.
    - id: line2Point
      type: System.Numerics.Vector2
      description: A point on the second line.
    - id: line2Direction
      type: System.Numerics.Vector2
      description: The direction vector of the second line.
    - id: disSquared
      type: System.Single
      description: Outputs the squared distance between the closest points on the two lines. Returns 0 if the lines intersect, -1 if they are parallel.
    return:
      type: System.ValueTuple{System.Numerics.Vector2,System.Numerics.Vector2}
      description: A tuple containing the closest points on each line, respectively.
    content.vb: Public Shared Function GetClosestPointLineLine(line1Point As Vector2, line1Direction As Vector2, line2Point As Vector2, line2Direction As Vector2, disSquared As Single) As (self As Vector2, other As Vector2)
