  namespace: ShapeEngine.Core.Shapes
  summary: Calculates the closest point on an infinite line to a given point in 2D space.
  remarks: The direction vector is normalized internally. The squared distance is clamped to zero to avoid negative values due to floating point errors.
  example: []
  syntax:
    content: public static Vector2 GetClosestPointLinePoint(Vector2 linePoint, Vector2 lineDirection, Vector2 point, out float disSquared)
    parameters:
    - id: linePoint
      type: System.Numerics.Vector2
      description: A point through which the line passes.
    - id: lineDirection
      type: System.Numerics.Vector2
      description: The direction vector of the line (does not need to be normalized).
    - id: point
      type: System.Numerics.Vector2
      description: The point from which the closest point on the line is sought.
    - id: disSquared
      type: System.Single
      description: Outputs the squared distance between the closest point on the line and the given point.
    return:
      type: System.Numerics.Vector2
      description: The closest point on the line to the specified point.
    content.vb: Public Shared Function GetClosestPointLinePoint(linePoint As Vector2, lineDirection As Vector2, point As Vector2, disSquared As Single) As Vector2
