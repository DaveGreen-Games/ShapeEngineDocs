  summary: Calculates the geometric points for drawing an arrow with a fixed head width and length.
  remarks: Returns empty shapes if parameters are invalid.
  example: []
  syntax:
    content: public static (Segment tail, Triangle head) CalculateArrowPoints(Vector2 tailPoint, Vector2 headPoint, float headWidth, float headLength)
    parameters:
    - id: tailPoint
      type: System.Numerics.Vector2
      description: The starting point of the arrow (tail).
    - id: headPoint
      type: System.Numerics.Vector2
      description: The end point of the arrow (head).
    - id: headWidth
      type: System.Single
      description: The width of the arrow head.
    - id: headLength
      type: System.Single
      description: The length of the arrow head.
    return:
      type: System.ValueTuple{ShapeEngine.Geometry.SegmentDef.Segment,ShapeEngine.Geometry.TriangleDef.Triangle}
      description: >-
        A tuple containing:


        <ul><li>The tail segment of the arrow.</li><li>The triangle representing the arrow head.</li></ul>
