  summary: Called every frame before Draw.
  remarks: Use this method to update logic that should run every frame, such as input handling, animations, or non-physics updates.
  example: []
  syntax:
    content: void Update(GameTime time, ScreenInfo game, ScreenInfo gameUi, ScreenInfo ui)
