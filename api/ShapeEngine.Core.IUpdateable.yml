  assemblies:
  - ShapeEngine
  namespace: ShapeEngine.Core
  summary: >-
    Called every frame after <xref href="ShapeEngine.Core.IUpdateable.FixedUpdate(ShapeEngine.Core.Structs.GameTime%2cShapeEngine.Core.Structs.ScreenInfo%2cShapeEngine.Core.Structs.ScreenInfo%2cShapeEngine.Core.Structs.ScreenInfo)" data-throw-if-not-resolved="false"></xref> when <xref href="ShapeEngine.Core.GameDef.Game.FixedPhysicsFramerate" data-throw-if-not-resolved="false"></xref> is enabled,

    to interpolate between fixed updates.
  remarks: Use this method to interpolate visual state for smooth rendering between fixed updates.
  example: []
  syntax:
    content: void InterpolateFixedUpdate(GameTime time, ScreenInfo game, ScreenInfo gameUi, ScreenInfo ui, float f)
    parameters:
    - id: time
      type: ShapeEngine.Core.Structs.GameTime
      description: The current game time for this frame.
    - id: game
      type: ShapeEngine.Core.Structs.ScreenInfo
      description: Screen information for the main game view.
    - id: gameUi
      type: ShapeEngine.Core.Structs.ScreenInfo
      description: Screen information for the game UI overlay.
    - id: ui
      type: ShapeEngine.Core.Structs.ScreenInfo
      description: Screen information for the global UI.
    - id: f
      type: System.Single
      description: The interpolation factor between the last and next fixed update (0.0 to 1.0).
