  assemblies:
  - ShapeEngine
  namespace: ShapeEngine.ShapeClipper
  summary: Represents a mutable triangle mesh stored as a flat vertex buffer.
  remarks: >-
    Every 3 consecutive vertices form one triangle. This type is optimized for pooled/buffer-oriented workflows,

    while still providing helpers for copying, transforming, hashing, drawing, and conversion to <xref href="ShapeEngine.Geometry.TriangulationDef.Triangulation" data-throw-if-not-resolved="false"></xref>.
