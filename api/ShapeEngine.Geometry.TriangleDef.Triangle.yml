      description: The second vertex of the triangle.
    - id: tC
      type: System.Numerics.Vector2
      description: The third vertex of the triangle.
    - id: point
      type: System.Numerics.Vector2
      description: The point to test for containment.
    return:
      type: System.Boolean
      description: True if the point is inside or on the boundary of the triangle; otherwise, false.
