  assemblies:
  - ShapeEngine
  namespace: ShapeEngine.Input
  summary: >-
    Determines if the specified access tag has access.

    <remarks>

    <xref href="ShapeEngine.Input.InputSystem.AllAccessTag" data-throw-if-not-resolved="false"></xref> always returns true (has access).


    <ul><li>If <code>tag</code> is contained in the current blacklist, this function will return false (no access).</li><li>If <code>tag</code> is not contained in the current blacklist and <code>tag</code> is contained in the current whitelist,

    or the current whitelist is empty, this function will return true (has access).</li></ul>

    </remarks>
  example: []
