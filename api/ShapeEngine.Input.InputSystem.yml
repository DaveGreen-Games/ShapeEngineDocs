    id: NextAccessTag
    path: ../ShapeEngine/ShapeEngine/Input/InputSystem.cs
    startLine: 278
  assemblies:
  - ShapeEngine
  namespace: ShapeEngine.Input
  summary: >-
    Gets the next available access tag.

    <code>1</code> is reserved for <xref href="ShapeEngine.Input.InputSystem.AllAccessTag" data-throw-if-not-resolved="false"></xref>, <code>2</code> is reserved for <xref href="ShapeEngine.Input.InputSystem.DefaultAccessTag" data-throw-if-not-resolved="false"></xref>.

    Only power of 2 values are used for access tags.
