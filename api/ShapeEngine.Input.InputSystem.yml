    id: CurrentInputActionDeviceType
    path: ../ShapeEngine/ShapeEngine/Input/InputSystem.cs
    startLine: 52
  assemblies:
  - ShapeEngine
  namespace: ShapeEngine.Input
  summary: >-
    Current <xref href="ShapeEngine.Input.InputAction" data-throw-if-not-resolved="false"></xref> based device type detected by <xref href="ShapeEngine.Input.InputSystem.ActiveInputActionTreeGroup" data-throw-if-not-resolved="false"></xref>.

    The first non-None <xref href="ShapeEngine.Input.InputDeviceType" data-throw-if-not-resolved="false"></xref> detected during the update of the <xref href="ShapeEngine.Input.InputSystem.ActiveInputActionTreeGroup" data-throw-if-not-resolved="false"></xref> is used.
  remarks: >-
    For an <xref href="ShapeEngine.Input.InputAction" data-throw-if-not-resolved="false"></xref>s <xref href="ShapeEngine.Input.IInputType" data-throw-if-not-resolved="false"></xref>s <xref href="ShapeEngine.Input.InputDeviceType" data-throw-if-not-resolved="false"></xref> to be considered the following conditions must be met:


    <ul><li>The <xref href="ShapeEngine.Input.InputAction" data-throw-if-not-resolved="false"></xref> must be part of an <xref href="ShapeEngine.Input.InputActionTree" data-throw-if-not-resolved="false"></xref> within the <xref href="ShapeEngine.Input.InputSystem.ActiveInputActionTreeGroup" data-throw-if-not-resolved="false"></xref>.</li><li>The <xref href="ShapeEngine.Input.InputAction" data-throw-if-not-resolved="false"></xref> must be active.</li><li>The <xref href="ShapeEngine.Input.IInputType" data-throw-if-not-resolved="false"></xref>'s <xref href="ShapeEngine.Input.InputState" data-throw-if-not-resolved="false"></xref> must be down.</li><li>The <xref href="ShapeEngine.Input.IInputType" data-throw-if-not-resolved="false"></xref> must not be blocked (when <xref href="ShapeEngine.Input.InputAction.BlocksInput" data-throw-if-not-resolved="false"></xref> is <code>true</code>).</li></ul>
  example: []
  syntax:
    content: public InputDeviceType CurrentInputActionDeviceType { get; }
    parameters: []
    return:
      type: ShapeEngine.Input.InputDeviceType
    content.vb: Public Property CurrentInputActionDeviceType As InputDeviceType
  overload: ShapeEngine.Input.InputSystem.CurrentInputActionDeviceType*
