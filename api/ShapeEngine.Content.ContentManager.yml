      repo: https://github.com/DaveGreen-Games/ShapeEngine.git
    id: .ctor
    path: ../ShapeEngine/ShapeEngine/Content/ContentManager.cs
    startLine: 94
  assemblies:
  - ShapeEngine
  namespace: ShapeEngine.Content
  summary: Initializes a new instance of the <xref href="ShapeEngine.Content.ContentManager" data-throw-if-not-resolved="false"></xref> class with the specified root directory.
  remarks: >-
    The <code class="paramref">rootDirectory</code> parameter specifies the base directory from which all content paths are resolved.

    It acts as the root for loading, caching, and managing content files.

    All relative file paths used by the ContentManager are interpreted with respect to this directory.

    If a relative path used for loading a resource contains the <xref href="ShapeEngine.Content.ContentManager.RootDirectory" data-throw-if-not-resolved="false"></xref>,

    the <xref href="ShapeEngine.Content.ContentManager.RootDirectory" data-throw-if-not-resolved="false"></xref> will be stripped from the path before further processing.

    If no content pack is found for a given relative path, the ContentManager will attempt to load the resource

    directly from the file system using the combined path of <xref href="ShapeEngine.Content.ContentManager.RootDirectory" data-throw-if-not-resolved="false"></xref> and the relative path.
  example: []
  syntax:
    content: public ContentManager(string rootDirectory)
    parameters:
    - id: rootDirectory
      type: System.String
      description: The root directory for all content managed by this ContentManager.
    content.vb: Public Sub New(rootDirectory As String)
  overload: ShapeEngine.Content.ContentManager.#ctor*
  nameWithType.vb: ContentManager.New(String)
  fullName.vb: ShapeEngine.Content.ContentManager.New(String)
  name.vb: New(String)
