    id: Fracture
    path: ../ShapeEngine/ShapeEngine/Geometry/FractureHelper.cs
    startLine: 70
  assemblies:
  - ShapeEngine
  namespace: ShapeEngine.Geometry
  summary: Fractures a polygon by cutting it with another polygon and subdividing the resulting pieces.
  remarks: <ul><li>The method first computes the intersection and difference between the original shape and the cut shape.</li><li>The intersection pieces are triangulated and subdivided according to the area and randomness parameters.</li></ul>
  example: []
  syntax:
    content: public FractureInfo Fracture(Polygon shape, Polygon cutShape)
    parameters:
    - id: shape
      type: ShapeEngine.Geometry.PolygonDef.Polygon
      description: The original polygon to be fractured.
    - id: cutShape
      type: ShapeEngine.Geometry.PolygonDef.Polygon
      description: The polygon used to cut the original shape.
    return:
      type: ShapeEngine.Geometry.FractureInfo
      description: A <xref href="ShapeEngine.Geometry.FractureInfo" data-throw-if-not-resolved="false"></xref> object containing the new shapes, cutouts, and fracture pieces.
    content.vb: Public Function Fracture(shape As Polygon, cutShape As Polygon) As FractureInfo
  overload: ShapeEngine.Geometry.FractureHelper.Fracture*
