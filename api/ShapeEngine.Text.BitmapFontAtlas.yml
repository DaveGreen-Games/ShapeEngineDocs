  assemblies:
  - ShapeEngine
  namespace: ShapeEngine.Text
  summary: >-
    Draws the specified text using the atlas, fitting each character into a grid within the given rectangle.

    Only characters present in the atlas will be drawn.
  remarks: >-
    Glyphs may be distorted if the grid cell aspect ratio does not match the glyph aspect ratio.

    Use <xref href="ShapeEngine.Text.BitmapFontAtlas.Draw(System.String%2cShapeEngine.Geometry.RectDef.Rect%2cShapeEngine.Color.ColorRgba%2cSystem.Single%2cSystem.Single%2cShapeEngine.Core.Structs.AnchorPoint)" data-throw-if-not-resolved="false"></xref> for uniform scaling of glyphs.
  example: []
  syntax:
    content: public void Draw(string text, Rect rect, ColorRgba color)
    parameters:
    - id: text
      type: System.String
      description: The text string to render.
    - id: rect
      type: ShapeEngine.Geometry.RectDef.Rect
      description: The rectangle area where the text will be drawn.
    - id: color
      type: ShapeEngine.Color.ColorRgba
      description: The color to apply to the rendered text.
    content.vb: Public Sub Draw(text As String, rect As Rect, color As ColorRgba)
