  assemblies:
  - ShapeEngine
  namespace: ShapeEngine.Text
  summary: >-
    Draws the specified text using the atlas,

    fitting each character into a grid within the given rectangle,

    and applies custom horizontal and vertical padding to each glyph. 

    Only characters present in the atlas will be drawn.
  example: []
  syntax:
    content: public void Draw(string text, Rect rect, ColorRgba color, float paddingX, float paddingY, AnchorPoint alignment)
    parameters:
    - id: text
      type: System.String
      description: The text string to render.
    - id: rect
      type: ShapeEngine.Geometry.RectDef.Rect
      description: The rectangle area where the text will be drawn.
    - id: color
      type: ShapeEngine.Color.ColorRgba
      description: The color to apply to the rendered text.
    - id: paddingX
      type: System.Single
      description: Horizontal padding to apply to each glyph.
    - id: paddingY
      type: System.Single
      description: Vertical padding to apply to each glyph.
    - id: alignment
      type: ShapeEngine.Core.Structs.AnchorPoint
      description: >-
        AnchorPoint value where X is between 0 and 1, determining horizontal alignment (0 = left, 1 = right, 0.5 = center),

        and Y is between 0 and 1 for vertical alignment (0 = top, 1 = bottom, 0.5 = center).
    content.vb: Public Sub Draw(text As String, rect As Rect, color As ColorRgba, paddingX As Single, paddingY As Single, alignment As AnchorPoint)
