  assemblies:
  - ShapeEngine
  namespace: ShapeEngine.Text
  summary: >-
    Draws the specified text using the atlas, scaling each glyph uniformly to fit within the given rectangle,

    and wraps text to new lines as needed. Optionally prevents splitting words across lines.

    The text is centered and scaled to maintain the glyph aspect ratio.

    Only characters present in the atlas will be drawn.
  example: []
  syntax:
    content: public void DrawWithLineWrap(string text, Rect rect, ColorRgba color, float paddingX = 0, float paddingY = 0, bool dontSplitWords = false)
    parameters:
    - id: text
      type: System.String
      description: The text string to render.
    - id: rect
      type: ShapeEngine.Geometry.RectDef.Rect
      description: The rectangle area where the text will be drawn.
    - id: color
      type: ShapeEngine.Color.ColorRgba
      description: The color to apply to the rendered text.
    - id: paddingX
      type: System.Single
      description: Absolute horizontal padding to apply to each glyph.
    - id: paddingY
      type: System.Single
      description: Absolute vertical padding to apply to each glyph.
    - id: dontSplitWords
      type: System.Boolean
      description: If true, words will not be split across lines when wrapping.
    content.vb: Public Sub DrawWithLineWrap(text As String, rect As Rect, color As ColorRgba, paddingX As Single = 0, paddingY As Single = 0, dontSplitWords As Boolean = False)
  overload: ShapeEngine.Text.BitmapFontAtlas.DrawWithLineWrap*
