  summary: Initializes a new instance of the <xref href="ShapeEngine.Core.Structs.GappedOutlineDrawingInfo" data-throw-if-not-resolved="false"></xref> struct.
  example: []
  syntax:
    content: public GappedOutlineDrawingInfo(int gaps, float startOffset = 0, float gapPerimeterPercentage = 0.5)
    parameters:
    - id: gaps
      type: System.Int32
      description: The count of outline areas that are not drawn. The count of outline areas drawn always equals the count of gaps.
    - id: startOffset
      type: System.Single
      description: >-
        Value between 0 and 1 to change where the first part is drawn (useful for animating it).
            The offset value is wrapped between 0 and 1. Examples:

            <ul><li>1.5 would result in 0.5.</li><li>-0.2 would result in 0.8</li></ul>
    - id: gapPerimeterPercentage
      type: System.Single
      description: >-
        How much of the total perimeter should be a gap (not drawn).


        <ul><li> <code>1 - gapPercentage</code> equals the total amount of perimeter drawn.</li><li>If 0 normal outline is drawn, if 1 nothing is drawn.</li></ul>
