  assemblies:
  - ShapeEngine
  namespace: ShapeEngine.Core.Structs
  summary: >-
    Value between 0 and 1 to change where the first part is drawn (useful for animating it).

    The offset value is wrapped between 0 and 1.
  example:
  - >-
    For example:


    <ul><li>If <code>startOffset</code> is 1.5, it wraps to 0.5.</li><li>If <code>startOffset</code> is -0.2, it wraps to 0.8.</li></ul>
