    remote:
      path: ShapeEngine/Core/Structs/GappedOutlineDrawingInfo.cs
      branch: main
      repo: https://github.com/DaveGreen-Games/ShapeEngine.git
    id: Gaps
    path: ../ShapeEngine/ShapeEngine/Core/Structs/GappedOutlineDrawingInfo.cs
    startLine: 39
  assemblies:
  - ShapeEngine
  namespace: ShapeEngine.Core.Structs
  summary: >-
    The number of gap segments (not drawn) in the outline.

    The number of drawn segments always equals the number of gaps.
  remarks: >-
    The total gap length, defined by <xref href="ShapeEngine.Core.Structs.GappedOutlineDrawingInfo.GapPerimeterPercentage" data-throw-if-not-resolved="false"></xref>, is divided equally among all <xref href="ShapeEngine.Core.Structs.GappedOutlineDrawingInfo.Gaps" data-throw-if-not-resolved="false"></xref>.

    The total drawn length, defined by <code>1 - GapPerimeterPercentage</code>, is also divided equally among all <xref href="ShapeEngine.Core.Structs.GappedOutlineDrawingInfo.Gaps" data-throw-if-not-resolved="false"></xref>.
  example:
  - >-
    For example:


    <ul><li>6 gaps result in 6 drawn segments and 6 gaps. If <xref href="ShapeEngine.Core.Structs.GappedOutlineDrawingInfo.GapPerimeterPercentage" data-throw-if-not-resolved="false"></xref> is 0.5, all segments and gaps are equal in length.</li><li>If <xref href="ShapeEngine.Core.Structs.GappedOutlineDrawingInfo.GapPerimeterPercentage" data-throw-if-not-resolved="false"></xref> is 0.75, then 75% of the perimeter is divided into 6 gaps and 25% into 6 drawn segments.</li></ul>
  syntax:
    content: public readonly int Gaps
    return:
      type: System.Int32
    content.vb: Public ReadOnly Gaps As Integer
