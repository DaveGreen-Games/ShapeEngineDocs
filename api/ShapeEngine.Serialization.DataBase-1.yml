  assemblies:
  - ShapeEngine
  namespace: ShapeEngine.Serialization
  summary: Represents a generic database for storing and managing objects of type <code class="typeparamref">T</code>.
  remarks: >-
    The database organizes objects by their runtime type, enabling efficient storage and lookup for polymorphic scenarios. 

    Use the provided Add methods to insert single objects, collections, or entire dictionaries.
  example: []
  syntax:
    content: 'public class DataBase<T> where T : DataObject'
    typeParameters:
    - id: T
      description: >-
        The base type of objects stored in the database. <code class="typeparamref">T</code> must inherit from <xref href="ShapeEngine.Serialization.DataObject" data-throw-if-not-resolved="false"></xref>.


        <p>

        This class supports storing multiple derived types of <code class="typeparamref">T</code>. Each derived type is managed in its own internal dictionary, allowing for type-safe retrieval and organization.

        </p>
    content.vb: Public Class DataBase(Of T As DataObject)
