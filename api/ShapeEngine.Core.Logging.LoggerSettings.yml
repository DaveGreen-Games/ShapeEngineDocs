  summary: >-
    Initializes a new instance of the <xref href="ShapeEngine.Core.Logging.LoggerSettings" data-throw-if-not-resolved="false"></xref> struct with a specified minimum log level,

    log file path, and an option to also log to the console.
  remarks: >-
    If the <code class="paramref">logFilePath</code> is not valid the <xref href="ShapeEngine.Core.Logging.LogOutputType" data-throw-if-not-resolved="false"></xref>

    will be set to <xref href="ShapeEngine.Core.Logging.LogOutputType.Console" data-throw-if-not-resolved="false"></xref> and the <xref href="ShapeEngine.Core.Logging.LoggerSettings.LogFilePath" data-throw-if-not-resolved="false"></xref> will be empty.

    If the specified log file already exists it will be cleared before starting logging.
  example: []
