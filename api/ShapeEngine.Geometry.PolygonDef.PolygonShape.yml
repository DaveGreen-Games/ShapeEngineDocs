  namespace: ShapeEngine.Geometry.PolygonDef
  summary: Represents a polygon shape that can be transformed and recalculated based on a relative set of points or a segment.
  remarks: >-
    This class is used to define a polygon in a transformed space.

    The shape is recalculated whenever the transform changes.
