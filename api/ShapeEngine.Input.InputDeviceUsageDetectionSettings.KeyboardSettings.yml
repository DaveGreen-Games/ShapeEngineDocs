  assemblies:
  - ShapeEngine
  namespace: ShapeEngine.Input
  summary: >-
    The minimum duration (in seconds) of consecutive keyboard use (movement or holding at least one button down)

    required to consider the keyboard device as "used".
  remarks: >-
    <code>Default is 0.5f seconds.</code>

    Does work in combination with <xref href="ShapeEngine.Input.InputDeviceUsageDetectionSettings.KeyboardSettings.MinPressCount" data-throw-if-not-resolved="false"></xref> / <xref href="ShapeEngine.Input.InputDeviceUsageDetectionSettings.KeyboardSettings.MinPressInterval" data-throw-if-not-resolved="false"></xref> but has a higher priority.

    <xref href="ShapeEngine.Input.InputDeviceUsageDetectionSettings.KeyboardSettings.MinUsedDuration" data-throw-if-not-resolved="false"></xref> system will be checked first and if it triggers,

    <xref href="ShapeEngine.Input.InputDeviceUsageDetectionSettings.KeyboardSettings.MinPressCount" data-throw-if-not-resolved="false"></xref> / <xref href="ShapeEngine.Input.InputDeviceUsageDetectionSettings.KeyboardSettings.MinPressInterval" data-throw-if-not-resolved="false"></xref> system will be reset as well and not checked in the same frame.
  example: []
  syntax:
    content: public float MinUsedDuration
    return:
      type: System.Single
    content.vb: Public MinUsedDuration As Single
