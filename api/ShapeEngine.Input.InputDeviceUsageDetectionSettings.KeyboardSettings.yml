    startLine: 65
  assemblies:
  - ShapeEngine
  namespace: ShapeEngine.Input
  summary: >-
    Initializes a new instance of the <xref href="ShapeEngine.Input.InputDeviceUsageDetectionSettings.KeyboardSettings" data-throw-if-not-resolved="false"></xref> struct with custom detection, minimum press count,

    minimum press interval, and minimum used duration values. Other values are set to their defaults.
  example: []
  syntax:
    content: public KeyboardSettings(bool detection, int minPressCount = 2, float minPressInterval = 1, float minUsedDuration = 0.5, float selectionCooldownDuration = 2, HashSet<ShapeKeyboardButton>? exceptionButtons = null)
    parameters:
    - id: detection
      type: System.Boolean
      description: Indicates whether keyboard detection is enabled.
    - id: minPressCount
      type: System.Int32
      description: The minimum number of keyboard button presses required within the specified interval.
    - id: minPressInterval
      type: System.Single
      description: The time interval (in seconds) from the first keyboard button press within which <code class="paramref">minPressCount</code> must be reached.
    - id: minUsedDuration
      type: System.Single
      description: The minimum duration (in seconds) of consecutive keyboard use required to consider the keyboard device as "used".
    - id: selectionCooldownDuration
      type: System.Single
      description: >-
        Specifies the cooldown duration (in seconds) after this device is selected

        during which no other input device can be selected.

        <code>Default is 2 seconds.</code>
    - id: exceptionButtons
      type: System.Collections.Generic.HashSet{ShapeEngine.Input.ShapeKeyboardButton}
      description: The set of keyboard buttons that will never select this device, even if pressed. Optional.
    content.vb: Public Sub New(detection As Boolean, minPressCount As Integer = 2, minPressInterval As Single = 1, minUsedDuration As Single = 0.5, selectionCooldownDuration As Single = 2, exceptionButtons As HashSet(Of ShapeKeyboardButton) = Nothing)
