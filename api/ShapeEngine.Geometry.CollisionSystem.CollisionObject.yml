    id: AdvancedCollisionNotification
    path: ../ShapeEngine/ShapeEngine/Geometry/CollisionSystem/CollisionObject.cs
    startLine: 164
  assemblies:
  - ShapeEngine
  namespace: ShapeEngine.Geometry.CollisionSystem
  summary: >-
    Gets or sets whether advanced collision notification is enabled.

    <p>

    If set to <code>true</code>:

    <ul><li>

    <xref href="ShapeEngine.Geometry.CollisionSystem.CollisionObject.ColliderIntersected(ShapeEngine.Geometry.CollisionSystem.Collision)" data-throw-if-not-resolved="false"></xref>,

    <xref href="ShapeEngine.Geometry.CollisionSystem.CollisionObject.ColliderOverlapped(ShapeEngine.Geometry.CollisionSystem.Overlap)" data-throw-if-not-resolved="false"></xref>,

    and <xref href="ShapeEngine.Geometry.CollisionSystem.CollisionObject.ColliderContactEnded(ShapeEngine.Geometry.CollisionSystem.Collider%2cShapeEngine.Geometry.CollisionSystem.Collider)" data-throw-if-not-resolved="false"></xref> virtual functions will be called.

    Override them for custom logic.

    </li><li>

    <xref href="ShapeEngine.Geometry.CollisionSystem.CollisionObject.OnColliderIntersected" data-throw-if-not-resolved="false"></xref>,

    <xref href="ShapeEngine.Geometry.CollisionSystem.CollisionObject.OnColliderOverlapped" data-throw-if-not-resolved="false"></xref>,

    and <xref href="ShapeEngine.Geometry.CollisionSystem.CollisionObject.OnColliderContactEnded" data-throw-if-not-resolved="false"></xref> events will be invoked.

    </li><li>

    <xref href="ShapeEngine.Geometry.CollisionSystem.Collider" data-throw-if-not-resolved="false"></xref>-level

    <xref href="ShapeEngine.Geometry.CollisionSystem.Collider.Intersected(ShapeEngine.Geometry.CollisionSystem.Collision)" data-throw-if-not-resolved="false"></xref>,

    <xref href="ShapeEngine.Geometry.CollisionSystem.Collider.Overlapped(ShapeEngine.Geometry.CollisionSystem.Overlap)" data-throw-if-not-resolved="false"></xref>,

    and <xref href="ShapeEngine.Geometry.CollisionSystem.Collider.ContactEnded(ShapeEngine.Geometry.CollisionSystem.Collider)" data-throw-if-not-resolved="false"></xref> virtual functions will be called.

    </li></ul>

    </p>
  example: []
  syntax:
    content: public bool AdvancedCollisionNotification
    return:
      type: System.Boolean
    content.vb: Public AdvancedCollisionNotification As Boolean
