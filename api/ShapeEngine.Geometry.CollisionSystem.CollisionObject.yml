    id: Passive
    path: ../ShapeEngine/ShapeEngine/Geometry/CollisionSystem/CollisionObject.cs
    startLine: 99
  assemblies:
  - ShapeEngine
  namespace: ShapeEngine.Geometry.CollisionSystem
  summary: >-
    Gets or sets whether this object is passive in collision calculations.

    <p>

    If <code>true</code>, when a passive object checks for collisions against non-passive objects,

    the collision information is generated as if the non-passive object checked for the collision.

    This affects collision normal direction. Only relevant for colliders that compute intersections.

    </p>
  example: []
  syntax:
    content: public bool Passive
    return:
      type: System.Boolean
    content.vb: Public Passive As Boolean
