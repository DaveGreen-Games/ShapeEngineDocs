  assemblies:
  - ShapeEngine
  namespace: ShapeEngine.Geometry.CollisionSystem
  summary: >-
    Represents a broadphase collision detection system interface.

    Inherits from <xref href="ShapeEngine.Core.IBounds" data-throw-if-not-resolved="false"></xref>.

    Provides methods for managing collision objects and retrieving candidate buckets for collision checks.

    <xref href="ShapeEngine.Geometry.CollisionSystem.CollisionHandlerDef.CollisionHandler" data-throw-if-not-resolved="false"></xref> is using this interface to perform broadphase collision detection.
