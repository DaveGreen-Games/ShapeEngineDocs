  assemblies:
  - ShapeEngine
  namespace: ShapeEngine.Geometry.CollisionSystem
  summary: Populates the broadphase system with the provided collection of collision bodies.
  remarks: >-
    The collision handler will call fill every frame before performing collision checks. You can either rebuild the broadphase from scratch or update existing entries.

    <code class="paramref">collisionBodies</code> contains all active collision bodies currently in the system.
  example: []
  syntax:
    content: void Fill(IEnumerable<CollisionObject> collisionBodies)
    parameters:
    - id: collisionBodies
      type: System.Collections.Generic.IEnumerable{ShapeEngine.Geometry.CollisionSystem.CollisionObject}
      description: An enumerable collection of <xref href="ShapeEngine.Geometry.CollisionSystem.CollisionObject" data-throw-if-not-resolved="false"></xref> instances to add to the broadphase.
    content.vb: Sub Fill(collisionBodies As IEnumerable(Of CollisionObject))
