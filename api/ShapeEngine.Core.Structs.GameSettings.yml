  namespace: ShapeEngine.Core.Structs
  summary: >-
    The directory where save game data is stored.

    Uses <code>Environment.SpecialFolder.LocalApplicationData</code> by default.

    Savegame location will be <xref href="ShapeEngine.Core.Structs.GameSettings.SaveDirectory" data-throw-if-not-resolved="false"></xref> \ <xref href="ShapeEngine.Core.Structs.GameSettings.ApplicationName" data-throw-if-not-resolved="false"></xref>.
  remarks: >-
    Good alternatives for save game locations include:

    <ul><li><code>Environment.SpecialFolder.ApplicationData</code> \- for roaming user data.</li><li><code>Environment.SpecialFolder.MyDocuments</code> \- for user-accessible files.</li><li><code>Environment.SpecialFolder.CommonApplicationData</code> \- for data shared among all users.</li></ul>

    Choose based on your application's requirements and platform conventions.
  example: []
  syntax:
