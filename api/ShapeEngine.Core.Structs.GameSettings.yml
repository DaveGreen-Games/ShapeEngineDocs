  assemblies:
  - ShapeEngine
  namespace: ShapeEngine.Core.Structs
  summary: >-
    Gets the fixed framerate used for the fixed update loop.

    <ul><li>The physics update uses a delta time of <code>1 / FixedFramerate</code>.</li><li>If set to 0 or less, the fixed update loop is disabled and <code>FixedUpdate</code>/<code>InterpolateFixedUpdate</code> will not be called.</li><li>Values greater than 0 but less than 30 are clamped to 30.</li><li>When enabled, the physics update runs after the normal update function.</li></ul>
  example: []
  syntax:
    content: public readonly int FixedFramerate
    return:
      type: System.Int32
    content.vb: Public ReadOnly FixedFramerate As Integer
