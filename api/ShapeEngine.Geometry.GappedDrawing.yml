  assemblies:
  - ShapeEngine
  namespace: ShapeEngine.Geometry
  summary: Draws a line segment with gaps, creating a dashed or segmented effect.
  remarks: >-
    - If <code class="paramref">gapDrawingInfo.Gaps.Gaps</code> is 0 or <code class="paramref">gapDrawingInfo.GapPerimeterPercentage.GapPerimeterPercentage</code> is 0, the line is drawn solid.

    - If <code class="paramref">gapDrawingInfo.GapPerimeterPercentage.GapPerimeterPercentage</code> is 1 or greater, no line is drawn.
  example: []
  syntax:
    content: public static float DrawGappedSegment(Vector2 start, Vector2 end, float length, LineDrawingInfo lineInfo, GappedOutlineDrawingInfo gapDrawingInfo)
    parameters:
    - id: start
      type: System.Numerics.Vector2
      description: The starting point of the line segment.
    - id: end
      type: System.Numerics.Vector2
      description: The ending point of the line segment.
    - id: length
      type: System.Single
      description: >-
        The length of the line.

        If zero or negative, the method calculates it automatically.

        Providing a known length avoids redundant calculations and improves performance, especially for static segments.
    - id: lineInfo
      type: ShapeEngine.Geometry.LineDrawingInfo
      description: Parameters describing how to draw the line (e.g., color, thickness).
    - id: gapDrawingInfo
      type: ShapeEngine.Core.Structs.GappedOutlineDrawingInfo
      description: Parameters describing the gap configuration (number of gaps, gap percentage, etc.).
    return:
      type: System.Single
      description: >-
        The length of the line if positive; otherwise, -1.

        If the shape does not change, the valid length can be reused in subsequent frames to avoid recalculating.
    content.vb: Public Shared Function DrawGappedSegment(start As Vector2, [end] As Vector2, length As Single, lineInfo As LineDrawingInfo, gapDrawingInfo As GappedOutlineDrawingInfo) As Single
