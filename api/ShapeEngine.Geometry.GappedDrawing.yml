  assemblies:
  - ShapeEngine
  namespace: ShapeEngine.Geometry
  summary: Draws a gapped outline for a ring (annulus), creating dashed or segmented outlines for both inner and outer circles.
  remarks: >-
    - If both radii are zero or negative, nothing is drawn.

    - The number of sides for each circle is determined by the radius and <code class="paramref">sideLength</code>.
  example: []
  syntax:
    content: public static void DrawGappedRing(Vector2 center, float innerRadius, float outerRadius, LineDrawingInfo lineInfo, GappedOutlineDrawingInfo gapDrawingInfo, float rotDeg, float sideLength = 8)
    parameters:
    - id: center
      type: System.Numerics.Vector2
      description: The center of the ring.
    - id: innerRadius
      type: System.Single
      description: The radius of the inner circle. If zero or negative, only the outer circle is drawn.
    - id: outerRadius
      type: System.Single
      description: The radius of the outer circle. If zero or negative, only the inner circle is drawn.
    - id: lineInfo
      type: ShapeEngine.Geometry.LineDrawingInfo
      description: Parameters describing how to draw the outlines.
    - id: gapDrawingInfo
      type: ShapeEngine.Core.Structs.GappedOutlineDrawingInfo
      description: Parameters describing the gap configuration.
    - id: rotDeg
      type: System.Single
      description: The rotation of the ring in degrees.
    - id: sideLength
      type: System.Single
      description: The approximate length of each side used to approximate the circles.
