    id: ExecutionOrder
    path: ../ShapeEngine/ShapeEngine/Input/InputActionTree.cs
    startLine: 135
  assemblies:
  - ShapeEngine
  namespace: ShapeEngine.Input
  summary: >-
    The execution order of this <xref href="ShapeEngine.Input.InputActionTree" data-throw-if-not-resolved="false"></xref> instance.

    Used to determine the order in which input action trees are processed in the <xref href="ShapeEngine.Input.InputActionTreeGroup" data-throw-if-not-resolved="false"></xref> class.
  remarks: >-
    <p>

    The <code>ExecutionOrder</code> property is assigned during construction using a static counter,

    guaranteeing each tree a unique and incrementing execution order.

    Set the <code>ExecutionOrder</code> property to a specific value if you need to control the order of processing manually.

    </p>

    <p>

    The <xref href="ShapeEngine.Input.InputActionTree.CompareTo(ShapeEngine.Input.InputActionTree)" data-throw-if-not-resolved="false"></xref> method sorts trees by <code>ExecutionOrder</code> first, and by <code>Id</code> if execution orders are equal.

    </p>
  example:
  - >-
    <pre><code class="lang-csharp">var tree5 = new InputActionTree();

    var tree1 = new InputActionTree();

    var tree2 = new InputActionTree();

    var tree3 = new InputActionTree();

    var tree4 = new InputActionTree();

    tree4.ExecutionOrder = -10;

    InputActionTrees trees = [tree1, tree2, tree3, tree4, tree5];

    trees.Update(dt);// The update function will process tree4 first, then tree5, then tree1, tree2, and tree3.</code></pre>
  syntax:
    content: public int ExecutionOrder
    return:
      type: System.Int32
    content.vb: Public ExecutionOrder As Integer
