  assemblies:
  - ShapeEngine
  namespace: ShapeEngine.Input
  summary: >-
    Represents a sorted collection of <xref href="ShapeEngine.Input.InputAction" data-throw-if-not-resolved="false"></xref> objects, ordered by their execution order and ID.

    Provides methods for updating and retrieving input actions based on various criteria.

    <p>

    Implements a blocking system for <xref href="ShapeEngine.Input.IInputType" data-throw-if-not-resolved="false"></xref>s.

    When an <xref href="ShapeEngine.Input.InputAction" data-throw-if-not-resolved="false"></xref> in this tree is processed and its <xref href="ShapeEngine.Input.InputAction.BlocksInput" data-throw-if-not-resolved="false"></xref> property is set to <code>true</code>,

    it blocks the associated <xref href="ShapeEngine.Input.IInputType" data-throw-if-not-resolved="false"></xref>s from being used by subsequent <xref href="ShapeEngine.Input.InputAction" data-throw-if-not-resolved="false"></xref>s in the same update cycle.

    This ensures that input types are only handled by the first eligible action, preventing conflicts or duplicate processing.

    </p>
  remarks: A different tree for each used gamepad is recommended. Multiple trees can be grouped together using <xref href="ShapeEngine.Input.InputActionTreeGroup" data-throw-if-not-resolved="false"></xref>.
