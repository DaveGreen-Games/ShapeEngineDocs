  assemblies:
  - ShapeEngine
  namespace: ShapeEngine.Core
  summary: Represents a renderable texture surface that allows drawing operations onto an off-screen texture.
  remarks: >-
    The texture is created with a fixed size and cannot be resized after creation. 

    You must manually unload the texture using <xref href="ShapeEngine.Core.TextureSurface.Unload" data-throw-if-not-resolved="false"></xref> to free resources.

    Use <xref href="ShapeEngine.Core.TextureSurface.BeginDraw" data-throw-if-not-resolved="false"></xref> and <xref href="ShapeEngine.Core.TextureSurface.EndDraw" data-throw-if-not-resolved="false"></xref> to perform drawing operations on the texture.
