  assemblies:
  - ShapeEngine
  namespace: ShapeEngine.Geometry.SegmentDef
  summary: Draws the portion(s) of this segment that are masked by the provided <code class="paramref">mask</code> triangle.
  remarks: >-
    This method handles the following cases:

    - Both endpoints inside the triangle (draws whole segment when <code class="paramref">reversedMask</code> is true).

    - Both endpoints outside with two intersection points (draws subsegments determined by intersections).

    - Single intersection point (draws the appropriate subsegment depending on which endpoint is inside).

    - No intersections (draws whole segment when outside and <code class="paramref">reversedMask</code> is false).

    Intersection computations are delegated to <xref href="ShapeEngine.Geometry.SegmentDef.Segment.IntersectTriangle(ShapeEngine.Geometry.TriangleDef.Triangle)" data-throw-if-not-resolved="false"></xref>.
  example: []
  syntax:
    content: public void DrawMasked(Triangle mask, LineDrawingInfo lineInfo, bool reversedMask = false)
    parameters:
    - id: mask
      type: ShapeEngine.Geometry.TriangleDef.Triangle
      description: Triangle used as a closed mask for clipping the segment.
    - id: lineInfo
      type: ShapeEngine.Geometry.LineDrawingInfo
      description: Drawing parameters (thickness, color, cap type and cap points).
    - id: reversedMask
      type: System.Boolean
      description: >-
        If <code>false</code> draw the parts of the segment outside the triangle (default).

        If <code>true</code> draw the parts of the segment inside the triangle.
    content.vb: Public Sub DrawMasked(mask As Triangle, lineInfo As LineDrawingInfo, reversedMask As Boolean = False)
  overload: ShapeEngine.Geometry.SegmentDef.Segment.DrawMasked*
  nameWithType.vb: Segment.DrawMasked(Triangle, LineDrawingInfo, Boolean)
