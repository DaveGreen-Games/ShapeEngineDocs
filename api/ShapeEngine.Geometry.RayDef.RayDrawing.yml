  assemblies:
  - ShapeEngine
  namespace: ShapeEngine.Geometry.RayDef
  summary: Draws a ray using a <code>Ray</code> object, with a specified length, thickness, and color.
  remarks: >-
    Returns immediately without drawing if <code class="paramref">ray</code> is not valid,

    or if <code class="paramref">length</code> or <code class="paramref">thickness</code> is less than or equal to zero.
  example: []
  syntax:
    content: public static void Draw(this Ray ray, float length, float thickness, ColorRgba color)
    parameters:
    - id: ray
      type: ShapeEngine.Geometry.RayDef.Ray
      description: The <code>Ray</code> object to draw. Must be valid.
    - id: length
      type: System.Single
      description: The length of the ray. Must be greater than zero.
    - id: thickness
      type: System.Single
      description: The thickness of the ray. Must be greater than zero.
    - id: color
      type: ShapeEngine.Color.ColorRgba
      description: The color of the ray.
    content.vb: Public Shared Sub Draw(ray As Ray, length As Single, thickness As Single, color As ColorRgba)
