  assemblies:
  - ShapeEngine
  namespace: ShapeEngine.Geometry.RayDef
  summary: Draws a ray starting from a given point in a specified direction, with a given length, thickness, and color.
  remarks: >-
    Returns immediately without drawing if <code class="paramref">length</code> or <code class="paramref">thickness</code> is less than or equal to zero,

    or if <code class="paramref">direction</code> is a zero vector.
  example: []
  syntax:
    content: public static void DrawRay(Vector2 point, Vector2 direction, float length, float thickness, ColorRgba color)
    parameters:
    - id: point
      type: System.Numerics.Vector2
      description: The starting point of the ray.
    - id: direction
      type: System.Numerics.Vector2
      description: The direction vector of the ray. Must not be zero.
    - id: length
      type: System.Single
      description: The length of the ray. Must be greater than zero.
    - id: thickness
      type: System.Single
      description: The thickness of the ray. Must be greater than zero.
    - id: color
      type: ShapeEngine.Color.ColorRgba
      description: The color of the ray.
    content.vb: Public Shared Sub DrawRay(point As Vector2, direction As Vector2, length As Single, thickness As Single, color As ColorRgba)
