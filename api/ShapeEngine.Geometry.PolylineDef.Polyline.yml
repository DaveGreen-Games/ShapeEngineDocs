    path: ../ShapeEngine/ShapeEngine/Geometry/PolylineDef/PolylineDrawing.cs
    startLine: 267
  assemblies:
  - ShapeEngine
  namespace: ShapeEngine.Geometry.PolylineDef
  summary: Draws a gapped outline for a polyline (open or closed), creating a dashed or segmented effect along the polyline's length.
  remarks: >-
    - If <code class="paramref">gapDrawingInfo.Gaps.Gaps</code> is 0 or <code class="paramref">gapDrawingInfo.GapPerimeterPercentage.GapPerimeterPercentage</code> is 0, the polyline is drawn solid.

    - If <code class="paramref">gapDrawingInfo.GapPerimeterPercentage.GapPerimeterPercentage</code> is 1 or greater, no polyline is drawn.
  example: []
  syntax:
    content: public float DrawGappedOutline(float perimeter, LineDrawingInfo lineInfo, GappedOutlineDrawingInfo gapDrawingInfo)
    parameters:
    - id: perimeter
      type: System.Single
      description: >-
        The total length of the polyline.

        If zero or negative, the method calculates it automatically.

        Providing a known length avoids redundant calculations and improves performance, especially for static segments.
    - id: lineInfo
      type: ShapeEngine.Geometry.LineDrawingInfo
      description: Parameters describing how to draw the polyline.
    - id: gapDrawingInfo
      type: ShapeEngine.Core.Structs.GappedOutlineDrawingInfo
      description: Parameters describing the gap configuration.
    return:
      type: System.Single
      description: >-
        The perimeter of the polyline if positive; otherwise, -1.

        If the shape does not change, the valid length can be reused in subsequent frames to avoid recalculating.
    content.vb: Public Function DrawGappedOutline(perimeter As Single, lineInfo As LineDrawingInfo, gapDrawingInfo As GappedOutlineDrawingInfo) As Single
