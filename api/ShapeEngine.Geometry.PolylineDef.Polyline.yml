  assemblies:
  - ShapeEngine
  namespace: ShapeEngine.Geometry.PolylineDef
  summary: >-
    Draws the polyline as a layered glow by rendering multiple stroked passes

    with interpolated thickness and color values.
  remarks: This is useful for soft outlines, energy trails, and other expanding stroke effects.
  example: []
  syntax:
    content: public void DrawGlow(ValueRange thicknessRange, ValueRangeColor colorRange, int steps, float miterLimit = 2, bool beveled = false, LineCapType capType = LineCapType.CappedExtended, bool useDelaunay = false)
    parameters:
    - id: thicknessRange
      type: ShapeEngine.Core.Structs.ValueRange
      description: The stroke thickness range used from the first pass to the final pass.
    - id: colorRange
      type: ShapeEngine.Core.Structs.ValueRangeColor
      description: The color range used from the first pass to the final pass.
    - id: steps
      type: System.Int32
      description: The number of glow passes to render. A value of 1 draws a single pass using the maximum thickness and color.
    - id: miterLimit
      type: System.Single
      description: The maximum miter length factor used for sharp joins before beveling is applied.
    - id: beveled
      type: System.Boolean
      description: If true, sharp joins are beveled instead of using extended miters.
    - id: capType
      type: ShapeEngine.Geometry.LineCapType
      description: The cap style used for the open ends of the polyline.
    - id: useDelaunay
      type: System.Boolean
      description: If true, applies Delaunay refinement when triangulating the stroke mesh.
    content.vb: Public Sub DrawGlow(thicknessRange As ValueRange, colorRange As ValueRangeColor, steps As Integer, miterLimit As Single = 2, beveled As Boolean = False, capType As LineCapType = LineCapType.CappedExtended, useDelaunay As Boolean = False)
