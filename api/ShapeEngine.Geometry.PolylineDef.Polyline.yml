  assemblies:
  - ShapeEngine
  namespace: ShapeEngine.Geometry.PolylineDef
  summary: Builds a new open <xref href="ShapeEngine.Geometry.PolylineDef.Polyline" data-throw-if-not-resolved="false"></xref> representing the first portion of this polyline up to the specified traveled distance.
  remarks: >-
    The resulting polyline follows the original vertex order from the first point toward the last point and does not wrap.

    If the requested distance ends in the middle of a segment, an interpolated endpoint is added.
  example: []
  syntax:
    content: public void ToPolylinePerimeter(float perimeterToDraw, Polyline result)
    parameters:
    - id: perimeterToDraw
      type: System.Single
      description: The distance to trace along the polyline. Values less than or equal to zero are ignored.
    - id: result
      type: ShapeEngine.Geometry.PolylineDef.Polyline
      description: The destination polyline that will be cleared and populated with the traced points.
    content.vb: Public Sub ToPolylinePerimeter(perimeterToDraw As Single, result As Polyline)
