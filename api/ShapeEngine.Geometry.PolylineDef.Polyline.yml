  summary: Draws the polyline with each side scaled towards its origin, allowing for variable side lengths.
  remarks: This method is useful for creating effects where the polyline appears to shrink or grow from its sides.
  example: []
  syntax:
    content: public void DrawLinesScaled(LineDrawingInfo lineInfo, float sideScaleFactor, float sideScaleOrigin = 0.5)
    parameters:
    - id: lineInfo
      type: ShapeEngine.Geometry.LineDrawingInfo
      description: The drawing information, including thickness, color, and cap type.
    - id: sideScaleFactor
      type: System.Single
      description: >-
        <p>The scale factor for each side.</p>

        <ul><li>0: No polyline is drawn.</li><li>1: The normal polyline is drawn.</li><li>0.5: Each side is half as long.</li></ul>
    - id: sideScaleOrigin
      type: System.Single
      description: >-
        The point along the line to scale from, in both directions (0 to 1).


        <ul><li>0: Start of Segment</li><li>0.5: Center of Segment</li><li>1: End of Segment</li></ul>
