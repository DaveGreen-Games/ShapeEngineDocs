  summary: >-
    Returns a new <xref href="ShapeEngine.Core.Structs.ValueRange" data-throw-if-not-resolved="false"></xref> updated to include <code class="paramref">newValue</code>.

    If <code class="paramref">newValue</code> is less than Min, sets Min to <code class="paramref">newValue</code>.

    If <code class="paramref">newValue</code> is greater than Max, sets Max to <code class="paramref">newValue</code>.

    Otherwise, returns the current range unchanged.
