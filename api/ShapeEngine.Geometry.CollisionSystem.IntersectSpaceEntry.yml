  assemblies:
  - ShapeEngine
  namespace: ShapeEngine.Geometry.CollisionSystem
  summary: Validates the collision points in this entry using the other collider's velocity as the reference direction and its position as the reference point.
  remarks: >-
    Removes:

    - Invalid <xref href="ShapeEngine.Geometry.CollisionSystem.IntersectionPoint" data-throw-if-not-resolved="false"></xref>s

    - Points with normals facing in the same direction as the reference direction

    - Points with normals facing in the opposite direction as the reference point (from <xref href="ShapeEngine.Geometry.CollisionSystem.IntersectionPoint" data-throw-if-not-resolved="false"></xref> towards the reference point)
  example: []
  syntax:
    content: public bool ValidateByOther(out IntersectionPoint combined, out IntersectionPoint closest)
    parameters:
    - id: combined
      type: ShapeEngine.Geometry.CollisionSystem.IntersectionPoint
      description: An averaged <xref href="ShapeEngine.Geometry.CollisionSystem.IntersectionPoint" data-throw-if-not-resolved="false"></xref> of all remaining valid collision points.
    - id: closest
      type: ShapeEngine.Geometry.CollisionSystem.IntersectionPoint
      description: The <xref href="ShapeEngine.Geometry.CollisionSystem.IntersectionPoint" data-throw-if-not-resolved="false"></xref> that is closest to the reference point.
    return:
      type: System.Boolean
      description: Returns <code>true</code> if there are valid points remaining after validation; otherwise, <code>false</code>.
    content.vb: Public Function ValidateByOther(combined As IntersectionPoint, closest As IntersectionPoint) As Boolean
