  namespace: ShapeEngine.Geometry.CollisionSystem
  summary: Represents an entry in the intersection space, containing collision points and information about the other collider involved in the intersection.
  remarks: >-
    This class extends <xref href="ShapeEngine.Geometry.CollisionSystem.IntersectionPoints" data-throw-if-not-resolved="false"></xref> and is used to store collision points resulting from intersection tests with another collider.

    It also stores the velocity of the other collider at the time of intersection.
