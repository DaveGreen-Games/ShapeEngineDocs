  assemblies:
  - ShapeEngine
  namespace: ShapeEngine.Geometry
  summary: Draws a point as a circle at the specified position.
  example: []
  syntax:
    content: public static void Draw(this Vector2 p, float radius, ColorRgba color, float smoothness = 0.25)
    parameters:
    - id: p
      type: System.Numerics.Vector2
      description: The position of the point.
    - id: radius
      type: System.Single
      description: The radius of the circle to draw.
    - id: color
      type: ShapeEngine.Color.ColorRgba
      description: The color of the circle.
    - id: smoothness
      type: System.Single
      description: >-
        The smoothness value (0-1). This controls the visual quality of the circle by inversely interpolating the current <xref href="ShapeEngine.Geometry.CircleDef.Circle.CircleSideLengthRange" data-throw-if-not-resolved="false"></xref>.

        A value of 0 uses the maximum side length (fewer sides, less smooth), while 1 uses the minimum side length (more sides, smoother).

        The resulting side length determines the number of polygon sides used to approximate the circle.
    content.vb: Public Shared Sub Draw(p As Vector2, radius As Single, color As ColorRgba, smoothness As Single = 0.25)
