  assemblies:
  - ShapeEngine
  namespace: ShapeEngine.Geometry
  summary: Draws each point in a collection as a circle.
  example: []
  syntax:
    content: public static void Draw(this Points points, float r, ColorRgba color, float smoothness = 0.25)
    parameters:
    - id: points
      type: ShapeEngine.Geometry.PointsDef.Points
      description: The collection of points to draw.
    - id: r
      type: System.Single
      description: The radius of each circle.
    - id: color
      type: ShapeEngine.Color.ColorRgba
      description: The color of the circles.
    - id: smoothness
      type: System.Single
      description: >-
        The smoothness value (0-1). This controls the visual quality of the circle by inversely interpolating the current <xref href="ShapeEngine.Geometry.CircleDef.Circle.CircleSideLengthRange" data-throw-if-not-resolved="false"></xref>.

        A value of 0 uses the maximum side length (fewer sides, less smooth), while 1 uses the minimum side length (more sides, smoother).

        The resulting side length determines the number of polygon sides used to approximate the circle.
    content.vb: Public Shared Sub Draw(points As Points, r As Single, color As ColorRgba, smoothness As Single = 0.25)
