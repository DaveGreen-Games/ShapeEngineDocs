  assemblies:
  - ShapeEngine
  namespace: ShapeEngine.Geometry.CollisionSystem
  summary: >-
    Adds a new entry for the specified <code class="paramref">collider</code> to the register.

    If the collider already exists, retrieves its associated <xref href="System.Collections.Generic.HashSet%601" data-throw-if-not-resolved="false"></xref> and <xref href="ShapeEngine.Geometry.RectDef.Rect" data-throw-if-not-resolved="false"></xref>.

    Otherwise, creates a new entry with the given <code class="paramref">capacity</code> for the <xref href="System.Collections.Generic.HashSet%601" data-throw-if-not-resolved="false"></xref>.

    Returns <code>true</code> if the collider was already registered; <code>false</code> if a new entry was created.
  example: []
  syntax:
    content: public bool AddEntry(Collider collider, int capacity, out HashSet<T> coordinates, out Rect rect)
    parameters:
    - id: collider
      type: ShapeEngine.Geometry.CollisionSystem.Collider
      description: The collider to register or retrieve.
    - id: capacity
      type: System.Int32
      description: Initial capacity for the <xref href="System.Collections.Generic.HashSet%601" data-throw-if-not-resolved="false"></xref> if a new entry is created.
    - id: coordinates
      type: System.Collections.Generic.HashSet{{T}}
      description: The set of type <code class="typeparamref">T</code> associated with the collider.
    - id: rect
      type: ShapeEngine.Geometry.RectDef.Rect
      description: The bounding <xref href="ShapeEngine.Geometry.RectDef.Rect" data-throw-if-not-resolved="false"></xref> associated with the collider.
    return:
      type: System.Boolean
      description: <code>true</code> if the collider was already registered; otherwise, <code>false</code>.
    content.vb: Public Function AddEntry(collider As Collider, capacity As Integer, coordinates As HashSet(Of T), rect As Rect) As Boolean
