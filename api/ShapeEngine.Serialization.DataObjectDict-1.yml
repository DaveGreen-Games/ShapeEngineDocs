  namespace: ShapeEngine.Serialization
  summary: Represents a dictionary of <code class="typeparamref">T</code> objects, providing advanced random selection and filtering capabilities.
  remarks: >-
    This class extends Dictionary&lt;string, T&gt; and adds methods for random selection, weighted selection, and type-based filtering.

    Useful for scenarios such as loot tables, spawn systems, or any context where random or weighted selection of objects is required.
  example: []
  syntax:
    content: 'public class DataObjectDict<T> : Dictionary<string, T>, IDictionary<string, T>, ICollection<KeyValuePair<string, T>>, IReadOnlyDictionary<string, T>, IReadOnlyCollection<KeyValuePair<string, T>>, IEnumerable<KeyValuePair<string, T>>, IDictionary, ICollection, IEnumerable, IDeserializationCallback, ISerializable where T : DataObject'
    typeParameters:
    - id: T
      description: The type of objects stored in the dictionary. Must inherit from <xref href="ShapeEngine.Serialization.DataObject" data-throw-if-not-resolved="false"></xref> and typically provides a <code>SpawnWeight</code> property for weighted random selection.
