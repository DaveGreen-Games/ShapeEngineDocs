    id: StatSet
    path: ../ShapeEngine/ShapeEngine/Stats/StatSet.cs
    startLine: 57
  assemblies:
  - ShapeEngine
  namespace: ShapeEngine.Stats
  summary: >-
    Manages stats and their active modifier sources. This is the new entry point of the stat system.

    You create stats, add modifier sources, call Update(dt) each frame if you have timed effects, and read the final stat values back out.


    <ul><li>Holds <xref href="ShapeEngine.Stats.Stat" data-throw-if-not-resolved="false"></xref> objects and <xref href="ShapeEngine.Stats.IStatModifierSource" data-throw-if-not-resolved="false"></xref> (like <xref href="ShapeEngine.Stats.StatModifierSource" data-throw-if-not-resolved="false"></xref>, <xref href="ShapeEngine.Stats.TimedStatModifierSource" data-throw-if-not-resolved="false"></xref>, <xref href="ShapeEngine.Stats.StackableStatModifierSource" data-throw-if-not-resolved="false"></xref>)</li><li>Formula: ((Base + Flat) * (1 + AdditivePercent)) * MultiplicativeFactor</li></ul>
  remarks: >-
    Main flow:


    <ul><li>You define a stat with new Stat(...).</li><li>You register it in StatSet.AddStat(...).</li><li>You register one or more sources with StatSet.AddSource(...).</li><li>StatSet recalculates all stats from all active sources.</li><li>If you have timed sources, you call StatSet.Update(dt) each frame.</li><li>You read the result with StatSet.GetValue(statId) or stat.Value.</li></ul>


    What each class is for


    <ul><li><xref href="ShapeEngine.Stats.StatId" data-throw-if-not-resolved="false"></xref>: a lightweight wrapper around uint, used as the stable key for stats.</li><li><xref href="ShapeEngine.Stats.Stat" data-throw-if-not-resolved="false"></xref>: one actual stat definition plus its current computed value, name, base value, optional min/max, and optional tags.</li><li><xref href="ShapeEngine.Stats.StatModifier" data-throw-if-not-resolved="false"></xref>: one contribution to one stat, like “+5 flat” or “+20% multiplicative”.</li><li><xref href="ShapeEngine.Stats.StatModifierKind" data-throw-if-not-resolved="false"></xref>: says how the modifier participates in the calculation pipeline.</li><li><xref href="ShapeEngine.Stats.StatModifierSource" data-throw-if-not-resolved="false"></xref>: a permanent or manually removed source, like an item affix or passive.</li><li><xref href="ShapeEngine.Stats.TimedStatModifierSource" data-throw-if-not-resolved="false"></xref>: a source with duration and expiry.</li><li><xref href="ShapeEngine.Stats.StackableStatModifierSource" data-throw-if-not-resolved="false"></xref>: a timed source whose modifiers scale by stack count.</li><li><xref href="ShapeEngine.Stats.StatSet" data-throw-if-not-resolved="false"></xref>: the manager that holds everything, updates timed sources, and recalculates values.</li></ul>


    How stacking works:


    <ul><li>Sources have a stable Id.</li><li>If you add a source with an id that already exists, StatSet does not add a second copy.</li><li>Instead, it calls Reapply(...) on the existing source.</li><li>For timed sources, Reapply(...) refreshes duration.</li><li>For stackable sources, Reapply(...) adds stacks and refreshes duration by default.</li><li><xref href="ShapeEngine.Stats.StatSet.AddStacks(System.UInt32%2cSystem.Int32)" data-throw-if-not-resolved="false"></xref> and <xref href="ShapeEngine.Stats.StatSet.RemoveStacks(System.UInt32%2cSystem.Int32)" data-throw-if-not-resolved="false"></xref> let you manipulate an existing source directly.</li></ul>
