  syntax:
    content: public static void DrawRingLinesScaled(Vector2 center, float innerRadius, float outerRadius, float innerRotDeg, float outerRotDeg, int sides, LineDrawingInfo lineInfo, float sideScaleFactor, float sideScaleOrigin = 0.5)
    parameters:
    - id: center
      type: System.Numerics.Vector2
      description: The center position of the ring.
    - id: innerRadius
      type: System.Single
      description: The radius of the inner circle.
    - id: outerRadius
      type: System.Single
      description: The radius of the outer circle.
    - id: innerRotDeg
      type: System.Single
      description: Rotation of the inner circle in degrees.
    - id: outerRotDeg
      type: System.Single
      description: Rotation of the outer circle in degrees.
    - id: sides
      type: System.Int32
      description: Number of sides for the ring.
