      type: ShapeEngine.Geometry.LineDrawingInfo
      description: How to draw the lines.
    - id: sideScaleFactor
      type: System.Single
      description: >-
        <p>The scale factor for each side.</p>

        <ul><li>0: No ring is drawn.</li><li>1: The normal ring is drawn.</li><li>0.5: Each side is half as long.</li></ul>
    - id: sideScaleOrigin
      type: System.Single
      description: >-
        The point along the line to scale from, in both directions (0 to 1).

