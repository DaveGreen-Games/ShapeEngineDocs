    path: ../ShapeEngine/ShapeEngine/Pathfinding/Pathfinder.cs
    startLine: 36
  assemblies:
  - ShapeEngine
  namespace: ShapeEngine.Pathfinding
  summary: >-
    How many agent requests are handled each frame.

    If the value is smaller or equal to zero, all incoming requests are handled.

    This also affects the maximum number of requests that are handled in parallel processing,

    when <xref href="ShapeEngine.Pathfinding.Pathfinder.ParallelProcessing" data-throw-if-not-resolved="false"></xref> is <code>true</code>.
