  commentId: M:ShapeEngine.Pathfinding.Pathfinder.GetPathAsync(System.Numerics.Vector2,System.Numerics.Vector2,System.UInt32,System.Threading.CancellationToken)
  id: GetPathAsync(System.Numerics.Vector2,System.Numerics.Vector2,System.UInt32,System.Threading.CancellationToken)
