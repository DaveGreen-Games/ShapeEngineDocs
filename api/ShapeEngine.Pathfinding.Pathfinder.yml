    startLine: 516
  assemblies:
  - ShapeEngine
  namespace: ShapeEngine.Pathfinding
  summary: >-
    Executes multiple pathfinding requests in parallel and returns an array of results.

    Each element in the returned array corresponds to the request at the same index in <code class="paramref">requests</code>.

    Returns <code>null</code> if <code class="paramref">requests</code> is empty or if the operation was cancelled.
  remarks: >-
    Path is a pooled class.

    Instances should be returned to the pool via <xref href="ShapeEngine.Pathfinding.Path.ReturnPath(ShapeEngine.Pathfinding.Path)" data-throw-if-not-resolved="false"></xref> or <xref href="ShapeEngine.Pathfinding.Path.ReturnInstance" data-throw-if-not-resolved="false"></xref> when no longer needed.

    Returned instances should not be accessed afterward.
  example: []
  syntax:
    content: public Path?[]? GetPathsParallel(List<(Vector2 start, Vector2 end, uint layer)> requests, CancellationToken cancellationToken = default)
    parameters:
    - id: requests
      type: System.Collections.Generic.List{System.ValueTuple{System.Numerics.Vector2,System.Numerics.Vector2,System.UInt32}}
      description: A list of tuples where each tuple contains the start position, end position and traversal layer.
    - id: cancellationToken
      type: System.Threading.CancellationToken
      description: Optional cancellation token to cancel the parallel operation.
    return:
      type: ShapeEngine.Pathfinding.Path[]
      description: An array of <xref href="ShapeEngine.Pathfinding.Path" data-throw-if-not-resolved="false"></xref>? results matching the request order, or <code>null</code> if no requests were provided or the operation was cancelled.
    content.vb: Public Function GetPathsParallel(requests As List(Of (start As Vector2, [end] As Vector2, layer As UInteger)), cancellationToken As CancellationToken = Nothing) As Path()
  overload: ShapeEngine.Pathfinding.Pathfinder.GetPathsParallel*
