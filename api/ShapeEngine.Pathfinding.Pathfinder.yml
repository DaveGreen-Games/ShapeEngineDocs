  nameWithType: Pathfinder.GetPathAsync(Vector2, Vector2, uint, CancellationToken)
  fullName: ShapeEngine.Pathfinding.Pathfinder.GetPathAsync(System.Numerics.Vector2, System.Numerics.Vector2, uint, System.Threading.CancellationToken)
  type: Method
  source:
    remote:
      path: ShapeEngine/Pathfinding/Pathfinder.cs
      branch: main
      repo: https://github.com/DaveGreen-Games/ShapeEngine.git
    id: GetPathAsync
    path: ../ShapeEngine/ShapeEngine/Pathfinding/Pathfinder.cs
    startLine: 428
  assemblies:
  - ShapeEngine
  namespace: ShapeEngine.Pathfinding
  summary: >-
    Asynchronously finds a path between two world positions using A\* on this pathfinder.

    The start and end positions are clamped to the pathfinder bounds. If the clamped start or end

    cell is not traversable, the nearest traversable cell will be used; if none is available the

    method returns null.

    Using the async version makes sense when pathfinding may take a long time, e.g. on large grids or very complex paths.
  remarks: >-
    Path is a pooled classed.

    Instances should be returned to the pool via <xref href="ShapeEngine.Pathfinding.Path.ReturnPath(ShapeEngine.Pathfinding.Path)" data-throw-if-not-resolved="false"></xref> or <xref href="ShapeEngine.Pathfinding.Path.ReturnInstance" data-throw-if-not-resolved="false"></xref> when no longer needed.

    Returned instances should not be accessed afterwards.
