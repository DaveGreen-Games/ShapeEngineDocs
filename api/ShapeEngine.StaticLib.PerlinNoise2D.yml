    startLine: 84
  assemblies:
  - ShapeEngine
  namespace: ShapeEngine.StaticLib
  summary: >-
    Generates a 2D Perlin Noise value for a given coordinate (x, y) at a specified grid scale.

    The noise is smooth, continuous, and typically normalized to the range [-1.0, 1.0].
  example: []
  syntax:
    content: public static float Noise(float x, float y, float gridSize)
    parameters:
    - id: x
      type: System.Single
      description: The world/sample X coordinate. Interpreted in the same units as gridSize.
    - id: y
      type: System.Single
      description: The world/sample Y coordinate. Interpreted in the same units as gridSize.
    - id: gridSize
      type: System.Single
      description: The size of each lattice cell. Larger values produce lower-frequency (smoother) noise; smaller values produce higher-frequency detail.
    return:
      type: System.Single
      description: Perlin noise value at (x,y), approximately in the range [-1, 1].
    content.vb: Public Shared Function Noise(x As Single, y As Single, gridSize As Single) As Single
