  summary: Projects the circle's shape into a polygon along the specified vector and writes the convex hull into <code class="paramref">result</code>.
  remarks: This method samples the circle, adds a projected copy of each sample offset by <code class="paramref">v</code>, and computes the convex hull of those points.
  example: []
  syntax:
    content: public bool ProjectShape(Polygon result, Vector2 v, int pointCount = 8, bool useBuffer = false)
    parameters:
    - id: result
      type: ShapeEngine.Geometry.PolygonDef.Polygon
      description: The destination polygon that will receive the projected shape.
    - id: v
      type: System.Numerics.Vector2
      description: The vector along which the circle shape is projected.
    - id: pointCount
      type: System.Int32
      description: The number of circle sample points to generate before projection. Must be at least 4.
    - id: useBuffer
      type: System.Boolean
      description: >-
        <code>true</code> to reuse the internal points buffer and avoid a temporary allocation; <code>false</code> to allocate a new temporary buffer.
            Set this to <code>false</code> when calling from parallel or multi\-threaded code, since the internal buffer is shared and not thread\-safe.
    return:
      type: System.Boolean
      description: <code>true</code> if valid parameters were provided and <code class="paramref">result</code> was populated; otherwise, <code>false</code>.
