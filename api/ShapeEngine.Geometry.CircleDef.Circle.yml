  assemblies:
  - ShapeEngine
  namespace: ShapeEngine.Geometry.CircleDef
  summary: >-
    Determines whether a point [<code class="paramref">p</code>] is within a sector of the circle,

    defined by a center angle [<code class="paramref">rotationRad</code>] and a sector angle [<code class="paramref">sectorAngleRad</code>] (in radians).

    The sector is centered at <code class="paramref">rotationRad</code> and spans <code class="paramref">sectorAngleRad</code>.
  remarks: >-
    <code class="paramref">rotationRad</code> is used to calculate the direction of the sector.

    <code class="paramref">sectorAngleRad</code> defines the sector centered around the calculated direction.

    If the angle between the sector direction and the direction from the circle <xref href="ShapeEngine.Geometry.CircleDef.Circle.Center" data-throw-if-not-resolved="false"></xref> to <code class="paramref">p</code> has a smaller

    absolute angle than <code class="paramref">sectorAngleRad</code>,

    the function returns true, otherwise false.
  example: []
  syntax:
    content: public bool ContainsPointSector(Vector2 p, float rotationRad, float sectorAngleRad)
    parameters:
    - id: p
      type: System.Numerics.Vector2
      description: The point to check.
    - id: rotationRad
      type: System.Single
      description: The center angle of the sector in radians.
    - id: sectorAngleRad
      type: System.Single
      description: The angle of the sector in radians.
    return:
      type: System.Boolean
      description: <code>true</code> if the point is within the sector; otherwise, <code>false</code>.
    content.vb: Public Function ContainsPointSector(p As Vector2, rotationRad As Single, sectorAngleRad As Single) As Boolean
