    parameters:
    - id: result
      type: ShapeEngine.Geometry.TriangulationDef.Triangulation
      description: The destination triangulation that will receive the generated outline triangles.
    - id: startAngleDeg
      type: System.Single
      description: The starting sector angle in degrees.
    - id: endAngleDeg
      type: System.Single
      description: The ending sector angle in degrees.
    - id: sides
      type: System.Int32
      description: The number of sides used to approximate the curved arc of the sector.
    - id: lineThickness
      type: System.Single
      description: The thickness of the generated outline.
    - id: miterLimit
      type: System.Single
      description: The maximum miter length used when generating the outline joins.
    - id: beveled
      type: System.Boolean
      description: <code>true</code> to use beveled joins; otherwise, mitered joins are used.
    - id: useDelaunay
