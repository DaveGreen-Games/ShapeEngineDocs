    - id: angleDifRad
      type: System.Single
      description: Output total angular difference in radians.
    - id: angleStepRad
      type: System.Single
      description: Output angle step per side in radians.
    - id: sides
      type: System.Int32
      description: Output number of sides.
    - id: clampSides
      type: System.Boolean
      description: If true, clamps the number of sides to a min/max range set in <xref href="ShapeEngine.Geometry.CircleDef.Circle.CircleSideCountRange" data-throw-if-not-resolved="false"></xref>.
    return:
      type: System.Boolean
      description: True if parameters were calculated successfully.
