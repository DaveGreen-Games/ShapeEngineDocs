  summary: Generates a triangulated outline for a circle sector and writes it into <code class="paramref">result</code>.
  remarks: The method returns immediately without modifying <code class="paramref">result</code> if the circle radius is not positive, <code class="paramref">sides</code> is less than 3, the sector angle span is effectively zero, or the absolute angle span is 360 degrees or greater.
