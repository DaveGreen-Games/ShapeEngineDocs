    parameters:
    - id: collider
      type: ShapeEngine.Geometry.CollisionSystem.Collider
      description: >-
        The collider to test for overlap with this circle.
            The collider can represent various shapes such as circles, segments, rays, lines, triangles, rectangles, quads, polygons, or polylines.
    return:
      type: System.Boolean
      description: <code>true</code> if this circle overlaps with the specified collider; otherwise, <code>false</code>.
