  fullName: ShapeEngine.Geometry.CollisionSystem.MotionType.Static
  type: Field
  source:
    remote:
      path: ShapeEngine/Geometry/CollisionSystem/MotionType.cs
      branch: copilot/update-docs-publishing-pipeline
      repo: https://github.com/DaveGreen-Games/ShapeEngine.git
    id: Static
    path: ../ShapeEngine/ShapeEngine/Geometry/CollisionSystem/MotionType.cs
    startLine: 17
  assemblies:
  - ShapeEngine
  namespace: ShapeEngine.Geometry.CollisionSystem
  summary: The object is static and does not move. Optimized for non-moving objects.
  remarks: >-
    If you move a <xref href="ShapeEngine.Geometry.CollisionSystem.CollisionObject" data-throw-if-not-resolved="false"></xref> with <xref href="ShapeEngine.Geometry.CollisionSystem.MotionType.Static" data-throw-if-not-resolved="false"></xref>,

    you either have to remove and re-add it to the <xref href="ShapeEngine.Geometry.CollisionSystem.CollisionHandlerDef.CollisionHandler" data-throw-if-not-resolved="false"></xref> or change its motion type to <xref href="ShapeEngine.Geometry.CollisionSystem.MotionType.Dynamic" data-throw-if-not-resolved="false"></xref> temporarily.

    Failing to do so will result in the <xref href="ShapeEngine.Geometry.CollisionSystem.Collider" data-throw-if-not-resolved="false"></xref>s of the <xref href="ShapeEngine.Geometry.CollisionSystem.CollisionObject" data-throw-if-not-resolved="false"></xref> to be still in their old position in the collision system.
  example: []
  syntax:
    content: Static = 0
    return:
      type: ShapeEngine.Geometry.CollisionSystem.MotionType
