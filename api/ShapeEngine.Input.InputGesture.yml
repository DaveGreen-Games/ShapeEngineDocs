    id: AutomaticReset
    path: ../ShapeEngine/ShapeEngine/Input/InputGesture.cs
    startLine: 170
  assemblies:
  - ShapeEngine
  namespace: ShapeEngine.Input
  summary: Indicates whether the gesture should automatically reset after completion or failure.
  remarks: >-
    <ul><li>

    If true,

    the gesture will automatically reset to its initial state in the next Update call after being completed or failed.

    </li><li>

    If false, <xref href="ShapeEngine.Input.InputGesture.Reset" data-throw-if-not-resolved="false"></xref> has to be called manually to reset the gesture state.

    Until the gesture is reset,

    it will continue to report the last state and progress values after completion or failure.

    </li></ul>
  example: []
  syntax:
    content: public readonly bool AutomaticReset
    return:
      type: System.Boolean
    content.vb: Public ReadOnly AutomaticReset As Boolean
