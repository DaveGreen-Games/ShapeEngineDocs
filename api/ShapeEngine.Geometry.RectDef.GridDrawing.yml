  namespace: ShapeEngine.Geometry.RectDef
  summary: Draws the grid lines inside the specified rectangular bounds.
  remarks: The method draws <code>Rows + 1</code> horizontal lines and <code>Cols + 1</code> vertical lines so the full cell lattice is outlined.
  example: []
  syntax:
    content: public static void Draw(this Grid grid, Rect bounds, float lineThickness, ColorRgba color)
    parameters:
    - id: grid
      type: ShapeEngine.Core.Structs.Grid
      description: The grid definition containing the row and column counts.
    - id: bounds
      type: ShapeEngine.Geometry.RectDef.Rect
      description: The rectangular area that the grid should occupy.
    - id: lineThickness
      type: System.Single
      description: The thickness of the grid lines.
    - id: color
      type: ShapeEngine.Color.ColorRgba
      description: The color of the grid lines.
