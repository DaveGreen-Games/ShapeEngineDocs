  namespace: ShapeEngine.Geometry.TriangleDef
  summary: Provides static methods for drawing triangles and collections of triangles with various styles and options.
  remarks: >-
    This class contains extension methods for drawing <xref href="ShapeEngine.Geometry.TriangleDef.Triangle" data-throw-if-not-resolved="false"></xref> and <xref href="ShapeEngine.Geometry.Triangulation" data-throw-if-not-resolved="false"></xref> objects,

    as well as static methods for drawing triangles using raw vertex data. Supports filled, outlined, partial, and scaled outlines.
