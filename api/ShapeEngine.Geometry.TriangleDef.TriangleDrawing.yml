  namespace: ShapeEngine.Geometry.TriangleDef
  summary: Draws a certain percentage of a triangle's outline using a <xref href="ShapeEngine.Geometry.LineDrawingInfo" data-throw-if-not-resolved="false"></xref> object, with rotation applied.
  remarks: Useful for animating or highlighting portions of a triangle's outline.
  example: []
  syntax:
    content: public static void DrawLinesPercentage(this Triangle t, float f, LineDrawingInfo lineInfo, float rotDeg, Vector2 rotOrigin)
    parameters:
    - id: t
      type: ShapeEngine.Geometry.TriangleDef.Triangle
      description: The triangle to draw.
    - id: f
      type: System.Single
      description: >-
        Specifies which portion of the triangle's outline to draw, as well as the starting corner and direction.

        <ul><li>The integer part (0-2) selects the starting corner:

        <ul><li><code>Counter-Clockwise</code> -&gt; 0 = a, 1 = b, 2 = c</li><li><code>Clockwise</code> -&gt; 0 = a, 1 = c, 2 = b</li></ul>

        </li><li>The fractional part (0.0-1.0) determines the percentage of the outline to draw, relative to the full perimeter.</li><li>A negative value reverses the drawing direction (clockwise instead of counter-clockwise).</li></ul>

        Examples:

        <ul><li><code>0.35</code> - Start at a, draw 35% of the outline counter-clockwise.</li><li><code>-2.7</code> - Start at b, draw 70% of the outline clockwise.</li></ul>
    - id: lineInfo
      type: ShapeEngine.Geometry.LineDrawingInfo
      description: The line drawing information (thickness, color, cap type, etc.).
    - id: rotDeg
      type: System.Single
      description: The rotation in degrees to apply to the triangle.
    - id: rotOrigin
      type: System.Numerics.Vector2
      description: The origin point to rotate around (absolute coordinates).
