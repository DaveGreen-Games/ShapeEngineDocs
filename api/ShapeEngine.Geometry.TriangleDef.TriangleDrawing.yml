  assemblies:
  - ShapeEngine
  namespace: ShapeEngine.Geometry.TriangleDef
  summary: Draws a certain percentage of a triangle's outline.
  remarks: Useful for animating or highlighting portions of a triangle's outline.
  example: []
  syntax:
    content: public static void DrawTriangleLinesPercentage(Vector2 a, Vector2 b, Vector2 c, float f, float lineThickness, ColorRgba color, LineCapType capType = LineCapType.CappedExtended, int capPoints = 2)
    parameters:
    - id: a
      type: System.Numerics.Vector2
      description: The first vertex of the triangle.
    - id: b
      type: System.Numerics.Vector2
      description: The second vertex of the triangle.
    - id: c
      type: System.Numerics.Vector2
      description: The third vertex of the triangle.
    - id: f
      type: System.Single
      description: >-
        Specifies which portion of the triangle's outline to draw, as well as the starting corner and direction.

        <ul><li>The integer part (0-2) selects the starting corner:

        <ul><li><code>Counter-Clockwise</code> -&gt; 0 = a, 1 = b, 2 = c</li><li><code>Clockwise</code> -&gt; 0 = a, 1 = c, 2 = b</li></ul>

        </li><li>The fractional part (0.0-1.0) determines the percentage of the outline to draw, relative to the full perimeter.</li><li>A negative value reverses the drawing direction (clockwise instead of counter-clockwise).</li></ul>

        Examples:

        <ul><li><code>0.35</code> - Start at a, draw 35% of the outline counter-clockwise.</li><li><code>-2.7</code> - Start at b, draw 70% of the outline clockwise.</li></ul>
    - id: lineThickness
      type: System.Single
      description: The thickness of the outline.
    - id: color
      type: ShapeEngine.Color.ColorRgba
      description: The color of the outline.
    - id: capType
      type: ShapeEngine.Geometry.LineCapType
      description: The style of the line caps.
    - id: capPoints
      type: System.Int32
      description: The number of points used for the cap style.
    content.vb: Public Shared Sub DrawTriangleLinesPercentage(a As Vector2, b As Vector2, c As Vector2, f As Single, lineThickness As Single, color As ColorRgba, capType As LineCapType = LineCapType.CappedExtended, capPoints As Integer = 2)
  overload: ShapeEngine.Geometry.TriangleDef.TriangleDrawing.DrawTriangleLinesPercentage*
