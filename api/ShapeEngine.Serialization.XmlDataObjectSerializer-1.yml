  assemblies:
  - ShapeEngine
  namespace: ShapeEngine.Serialization
  summary: >-
    Provides XML serialization and deserialization for objects of type <code class="typeparamref">T</code>.

    <p>

    <code class="typeparamref">T</code> must inherit from <xref href="ShapeEngine.Serialization.DataObject" data-throw-if-not-resolved="false"></xref> and should be compatible with <xref href="System.Xml.Serialization.XmlSerializer" data-throw-if-not-resolved="false"></xref>.

    </p>
  remarks: >-
    This class supports both instance and static methods for serialization and deserialization. The instance methods allow customization of <xref href="System.Xml.XmlWriterSettings" data-throw-if-not-resolved="false"></xref> and <xref href="System.Xml.Serialization.XmlSerializerNamespaces" data-throw-if-not-resolved="false"></xref>.

    The static methods provide convenience for quick serialization/deserialization without custom settings.
