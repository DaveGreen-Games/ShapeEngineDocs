  syntax:
    content: 'public class XmlDataObjectSerializer<T> where T : DataObject'
    typeParameters:
    - id: T
      description: The type of object to serialize/deserialize. Must inherit from <xref href="ShapeEngine.Serialization.DataObject" data-throw-if-not-resolved="false"></xref> and be XML serializable.
