- uid: ShapeEngine.Core.AdaptiveFpsLimiter.Settings.Advanced(System.Double,System.Int32,System.Single,System.Int32,System.Int32,System.Int32,System.Single,System.Single)
  commentId: M:ShapeEngine.Core.AdaptiveFpsLimiter.Settings.Advanced(System.Double,System.Int32,System.Single,System.Int32,System.Int32,System.Int32,System.Single,System.Single)
  id: Advanced(System.Double,System.Int32,System.Single,System.Int32,System.Int32,System.Int32,System.Single,System.Single)
  parent: ShapeEngine.Core.AdaptiveFpsLimiter.Settings
  langs:
  - csharp
  - vb
  name: Advanced(double, int, float, int, int, int, float, float)
  nameWithType: AdaptiveFpsLimiter.Settings.Advanced(double, int, float, int, int, int, float, float)
  fullName: ShapeEngine.Core.AdaptiveFpsLimiter.Settings.Advanced(double, int, float, int, int, int, float, float)
  type: Method
  source:
    remote:
      path: ShapeEngine/Core/AdaptiveFpsLimiter.cs
      branch: main
      repo: https://github.com/DaveGreen-Games/ShapeEngine.git
    id: Advanced
    path: ../ShapeEngine/ShapeEngine/Core/AdaptiveFpsLimiter.cs
    startLine: 93
  assemblies:
  - ShapeEngine
  namespace: ShapeEngine.Core
  summary: >-
    Creates an advanced preset <xref href="ShapeEngine.Core.AdaptiveFpsLimiter.Settings" data-throw-if-not-resolved="false"></xref> with fully configurable parameters for cooldowns,

    averaging, reduction steps and tolerances. This overload exposes every tunable value for fine-grained

    control of the adaptive FPS limiter's behavior.
  example: []
  syntax:
    content: public static AdaptiveFpsLimiter.Settings Advanced(double raiseFpsCooldownDuration = 2, int requiredConsecutiveChecks = 6, float fasterFrameTimeAverageWeight = 0.5, int framerateReduction = 5, int criticalFramerateReduction = 30, int requiredConsecutiveExtraCooldownChecks = 2, float additionalCooldown = 1, float millisecondTolerance = 1.25)
    parameters:
    - id: raiseFpsCooldownDuration
      type: System.Double
      description: Base raise-FPS cooldown duration in seconds (default 2.0).
    - id: requiredConsecutiveChecks
      type: System.Int32
      description: Number of consecutive faster/slower checks required to trigger an adjustment (default 6).
    - id: fasterFrameTimeAverageWeight
      type: System.Single
      description: Weight used when averaging recent faster frame times (range 0.0..1.0). 0.0 = use only running average; 1.0 = use only most recent frame time (default 0.5f).
    - id: framerateReduction
      type: System.Int32
      description: FPS reduction applied on a normal slowdown (default 5).
    - id: criticalFramerateReduction
      type: System.Int32
      description: FPS reduction applied on a critical slowdown (default 30).
    - id: requiredConsecutiveExtraCooldownChecks
      type: System.Int32
      description: Number of consecutive slow-down adjustments required to add extra raise-FPS cooldown (default 2).
    - id: additionalCooldown
      type: System.Single
      description: Additional cooldown duration in seconds added per consecutive slowdowns (default 1f).
    - id: millisecondTolerance
      type: System.Single
      description: Frame time tolerance in milliseconds (default 1.25f). This is converted to seconds internally.
    return:
      type: ShapeEngine.Core.AdaptiveFpsLimiter.Settings
      description: A new <xref href="ShapeEngine.Core.AdaptiveFpsLimiter.Settings" data-throw-if-not-resolved="false"></xref> instance configured with the provided advanced values.
    content.vb: Public Shared Function Advanced(raiseFpsCooldownDuration As Double = 2, requiredConsecutiveChecks As Integer = 6, fasterFrameTimeAverageWeight As Single = 0.5, framerateReduction As Integer = 5, criticalFramerateReduction As Integer = 30, requiredConsecutiveExtraCooldownChecks As Integer = 2, additionalCooldown As Single = 1, millisecondTolerance As Single = 1.25) As AdaptiveFpsLimiter.Settings
  overload: ShapeEngine.Core.AdaptiveFpsLimiter.Settings.Advanced*
  nameWithType.vb: AdaptiveFpsLimiter.Settings.Advanced(Double, Integer, Single, Integer, Integer, Integer, Single, Single)
  fullName.vb: ShapeEngine.Core.AdaptiveFpsLimiter.Settings.Advanced(Double, Integer, Single, Integer, Integer, Integer, Single, Single)
  name.vb: Advanced(Double, Integer, Single, Integer, Integer, Integer, Single, Single)
