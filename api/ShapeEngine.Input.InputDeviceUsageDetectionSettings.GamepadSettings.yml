    id: .ctor
    path: ../ShapeEngine/ShapeEngine/Input/InputDeviceUsageDetectionSettingsGamepad.cs
    startLine: 202
  assemblies:
  - ShapeEngine
  namespace: ShapeEngine.Input
  summary: >-
    <p>

    Initializes a new instance of the <xref href="ShapeEngine.Input.InputDeviceUsageDetectionSettings.GamepadSettings" data-throw-if-not-resolved="false"></xref> class

    with a set of selection buttons, an optional cooldown duration, and optional exception buttons.

    </p>

    <p>

    This constructor enables selection button mode, where only the specified <code class="paramref">selectionButtons</code> can be used

    to select this device. All other detection methods are disabled by setting <code>MinPressCount</code>, <code>MinPressInterval</code>,

    and <code>MinUsedDuration</code> to -1.

    </p>

    <p>

    <xref href="ShapeEngine.Input.InputDeviceUsageDetectionSettings.GamepadSettings.TriggerThreshold" data-throw-if-not-resolved="false"></xref> is set to <xref href="ShapeEngine.Input.InputDeviceUsageDetectionSettings.GamepadSettings.DefaultTriggerAxisThreshold" data-throw-if-not-resolved="false"></xref>, and <xref href="ShapeEngine.Input.InputDeviceUsageDetectionSettings.GamepadSettings.AxisThreshold" data-throw-if-not-resolved="false"></xref> is set to <xref href="ShapeEngine.Input.InputDeviceUsageDetectionSettings.GamepadSettings.DefaultJoyAxisThreshold" data-throw-if-not-resolved="false"></xref>.

    </p>
  example: []
  syntax:
    content: public GamepadSettings(HashSet<ShapeGamepadButton> selectionButtons, float selectionCooldownDuration = 2, HashSet<ShapeGamepadButton>? exceptionButtons = null)
    parameters:
    - id: selectionButtons
      type: System.Collections.Generic.HashSet{ShapeEngine.Input.ShapeGamepadButton}
      description: >-
        The set of gamepad buttons that can be used to select this device.

        All other means of selection are disabled, even if an empty hash set is used.
    - id: selectionCooldownDuration
      type: System.Single
      description: >-
        Specifies the cooldown duration (in seconds) after this device is selected during which no other input device can be selected.

        Default is 2 seconds. Zero or negative values disable the cooldown.
    - id: exceptionButtons
      type: System.Collections.Generic.HashSet{ShapeEngine.Input.ShapeGamepadButton}
      description: A set of gamepad buttons that will never select this device, even if pressed. Optional.
    content.vb: Public Sub New(selectionButtons As HashSet(Of ShapeGamepadButton), selectionCooldownDuration As Single = 2, exceptionButtons As HashSet(Of ShapeGamepadButton) = Nothing)
