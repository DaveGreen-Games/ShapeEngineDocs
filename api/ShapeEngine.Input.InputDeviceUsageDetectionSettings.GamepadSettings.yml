  assemblies:
  - ShapeEngine
  namespace: ShapeEngine.Input
  summary: >-
    The minimum number of gamepad button presses required, within the specified interval, 

    to consider the gamepad device as "used".
  remarks: >-
    <code>Default is 2 presses within 1 second.</code>

    Does work in combination with <xref href="ShapeEngine.Input.InputDeviceUsageDetectionSettings.GamepadSettings.MinUsedDuration" data-throw-if-not-resolved="false"></xref>  but has a lower priority.

    <xref href="ShapeEngine.Input.InputDeviceUsageDetectionSettings.GamepadSettings.MinUsedDuration" data-throw-if-not-resolved="false"></xref> system will be checked first and if it triggers,

    <xref href="ShapeEngine.Input.InputDeviceUsageDetectionSettings.GamepadSettings.MinPressCount" data-throw-if-not-resolved="false"></xref> / <xref href="ShapeEngine.Input.InputDeviceUsageDetectionSettings.GamepadSettings.MinPressInterval" data-throw-if-not-resolved="false"></xref> system will be reset as well and not checked in the same frame.
  example: []
  syntax:
    content: public int MinPressCount
    return:
      type: System.Int32
    content.vb: Public MinPressCount As Integer
