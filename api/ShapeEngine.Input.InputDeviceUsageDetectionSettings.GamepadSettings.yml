    - id: minPressCount
      type: System.Int32
      description: The minimum number of button presses required within the interval to consider the gamepad as "used".
    - id: minPressInterval
      type: System.Single
      description: The time interval (in seconds) for the button presses.
    - id: selectionCooldownDuration
      type: System.Single
      description: Cooldown duration (in seconds) after selection. Default is 2 seconds.
    - id: exceptionButtons
