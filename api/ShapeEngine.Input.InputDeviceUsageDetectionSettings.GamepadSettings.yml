    startLine: 114
  assemblies:
  - ShapeEngine
  namespace: ShapeEngine.Input
  summary: >-
    Initializes a new instance of the <xref href="ShapeEngine.Input.InputDeviceUsageDetectionSettings.GamepadSettings" data-throw-if-not-resolved="false"></xref> struct with custom axis and trigger thresholds,

    minimum press count, minimum press interval, minimum used duration, and selection cooldown duration.

    <xref href="ShapeEngine.Input.InputDeviceUsageDetectionSettings.GamepadSettings.Detection" data-throw-if-not-resolved="false"></xref> is set to <code>true</code>.
  example: []
  syntax:
    content: public GamepadSettings(float axisThreshold, float triggerThreshold, int minPressCount, float minPressInterval, float minUsedDuration, float selectionCooldownDuration = 2, HashSet<ShapeGamepadButton>? exceptionButtons = null)
    parameters:
    - id: axisThreshold
      type: System.Single
      description: The minimum movement threshold for the analog sticks to consider the gamepad as "used".
    - id: triggerThreshold
      type: System.Single
      description: The minimum threshold for the triggers to consider the gamepad as "used".
    - id: minPressCount
      type: System.Int32
      description: The minimum number of gamepad button presses required within the specified interval.
    - id: minPressInterval
      type: System.Single
      description: The time interval (in seconds) from the first gamepad button press within which <code class="paramref">minPressCount</code> must be reached.
    - id: minUsedDuration
      type: System.Single
      description: The minimum duration (in seconds) of consecutive gamepad use required to consider the gamepad device as "used".
    - id: selectionCooldownDuration
      type: System.Single
      description: >-
        Specifies the cooldown duration (in seconds) after this device is selected

        during which no other input device can be selected.

        <code>Default is 2 seconds.</code>
    - id: exceptionButtons
      type: System.Collections.Generic.HashSet{ShapeEngine.Input.ShapeGamepadButton}
      description: >-
        A set of gamepad buttons that will never select this device, even if pressed.
            Optional.
    content.vb: Public Sub New(axisThreshold As Single, triggerThreshold As Single, minPressCount As Integer, minPressInterval As Single, minUsedDuration As Single, selectionCooldownDuration As Single = 2, exceptionButtons As HashSet(Of ShapeGamepadButton) = Nothing)
