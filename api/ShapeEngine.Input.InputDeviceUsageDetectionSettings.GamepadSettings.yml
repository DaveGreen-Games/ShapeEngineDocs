  summary: >-
    Initializes a new instance of the <xref href="ShapeEngine.Input.InputDeviceUsageDetectionSettings.GamepadSettings" data-throw-if-not-resolved="false"></xref> class

    with custom minimum press count and interval, optional cooldown duration, and optional exception buttons.

    <p>

    <xref href="ShapeEngine.Input.InputDeviceUsageDetectionSettings.GamepadSettings.Detection" data-throw-if-not-resolved="false"></xref> is set to <code>true</code>,

    <xref href="ShapeEngine.Input.InputDeviceUsageDetectionSettings.GamepadSettings.TriggerThreshold" data-throw-if-not-resolved="false"></xref> is set to <xref href="ShapeEngine.Input.InputDeviceUsageDetectionSettings.GamepadSettings.DefaultTriggerAxisThreshold" data-throw-if-not-resolved="false"></xref>, and <xref href="ShapeEngine.Input.InputDeviceUsageDetectionSettings.GamepadSettings.AxisThreshold" data-throw-if-not-resolved="false"></xref> is set to <xref href="ShapeEngine.Input.InputDeviceUsageDetectionSettings.GamepadSettings.DefaultJoyAxisThreshold" data-throw-if-not-resolved="false"></xref>,

    <xref href="ShapeEngine.Input.InputDeviceUsageDetectionSettings.GamepadSettings.MinUsedDuration" data-throw-if-not-resolved="false"></xref> is disabled (-1).

    </p>
  example: []
  syntax:
    content: public GamepadSettings(int minPressCount, float minPressInterval, float selectionCooldownDuration = 2, HashSet<ShapeGamepadButton>? exceptionButtons = null)
