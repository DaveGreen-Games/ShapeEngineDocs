    path: ../ShapeEngine/ShapeEngine/Input/InputDeviceUsageDetectionSettingsGamepad.cs
    startLine: 84
  assemblies:
  - ShapeEngine
  namespace: ShapeEngine.Input
  summary: >-
    Initializes a new instance of the <xref href="ShapeEngine.Input.InputDeviceUsageDetectionSettings.GamepadSettings" data-throw-if-not-resolved="false"></xref> struct with custom detection, axis, and trigger threshold values.

    Other values are set to their defaults: MinPressCount = 2, MinPressInterval = 1f, MinUsedDuration = 0.5f.
  example: []
  syntax:
    content: public GamepadSettings(bool detection, float axisThreshold, float triggerThreshold, float selectionCooldownDuration = 2, HashSet<ShapeGamepadButton>? exceptionButtons = null)
    parameters:
    - id: detection
      type: System.Boolean
      description: Indicates whether gamepad detection is enabled.
    - id: axisThreshold
      type: System.Single
      description: The minimum movement threshold for the analog sticks to consider the gamepad as "used".
    - id: triggerThreshold
      type: System.Single
      description: The minimum threshold for the triggers to consider the gamepad as "used".
    - id: selectionCooldownDuration
      type: System.Single
      description: >-
        Specifies the cooldown duration (in seconds) after this device is selected

        during which no other input device can be selected.

        <code>Default is 2 seconds.</code>
    - id: exceptionButtons
      type: System.Collections.Generic.HashSet{ShapeEngine.Input.ShapeGamepadButton}
      description: >-
        A set of gamepad buttons that will never select this device, even if pressed.
            Optional.
    content.vb: Public Sub New(detection As Boolean, axisThreshold As Single, triggerThreshold As Single, selectionCooldownDuration As Single = 2, exceptionButtons As HashSet(Of ShapeGamepadButton) = Nothing)
