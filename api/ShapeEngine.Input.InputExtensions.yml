  assemblies:
  - ShapeEngine
  namespace: ShapeEngine.Input
  summary: Gets the input state for a gamepad trigger axis (left or right trigger) on a specific gamepad.
  example: []
  syntax:
    content: public static InputState GetInputState(this ShapeGamepadTriggerAxis axis, int gamepadIndex, uint accessTag = 1)
    parameters:
    - id: axis
      type: ShapeEngine.Input.ShapeGamepadTriggerAxis
      description: The trigger axis to query (e.g., left or right trigger).
    - id: gamepadIndex
      type: System.Int32
      description: The index of the gamepad to query.
    - id: accessTag
      type: System.UInt32
      description: >-
        The access tag used to check if the input request has access and can be consumed. Default is <xref href="ShapeEngine.Input.InputSystem.AllAccessTag" data-throw-if-not-resolved="false"></xref>.

        Access is only checked when <xref href="ShapeEngine.Input.InputSystem.Locked" data-throw-if-not-resolved="false"></xref> is set to <code>true</code>.
    return:
