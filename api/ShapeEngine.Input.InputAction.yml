  summary: >-
    Updates the input action state when it is not part of an <xref href="ShapeEngine.Input.InputActionTree" data-throw-if-not-resolved="false"></xref>.

    This method should only be used for standalone actions.

    If the action is in a tree, the update is skipped, because the <xref href="ShapeEngine.Input.InputActionTree" data-throw-if-not-resolved="false"></xref> will handle the update automatically.
  remarks: >-
    Because the <xref href="ShapeEngine.Input.InputAction" data-throw-if-not-resolved="false"></xref> is not part of an <xref href="ShapeEngine.Input.InputActionTree" data-throw-if-not-resolved="false"></xref>,

    the <xref href="ShapeEngine.Input.IInputType" data-throw-if-not-resolved="false"></xref> Block system is not used.
