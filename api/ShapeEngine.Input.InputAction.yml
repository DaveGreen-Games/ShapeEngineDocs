    id: ExecutionOrder
    path: ../ShapeEngine/ShapeEngine/Input/InputAction.cs
    startLine: 125
  assemblies:
  - ShapeEngine
  namespace: ShapeEngine.Input
  summary: >-
    Gets or sets the execution order for this <xref href="ShapeEngine.Input.InputAction" data-throw-if-not-resolved="false"></xref>.


    <p>Input actions with a lower <xref href="ShapeEngine.Input.InputAction.ExecutionOrder" data-throw-if-not-resolved="false"></xref> value are processed first.</p>

    <p>This value is automatically assigned when the action is created, but can be set manually if needed.</p>

    <p>This only has an effect when used with <xref href="ShapeEngine.Input.InputActionTree" data-throw-if-not-resolved="false"></xref> or in other sorted collections

    that use <xref href="ShapeEngine.Input.InputAction.CompareTo(ShapeEngine.Input.InputAction)" data-throw-if-not-resolved="false"></xref> for determining order.</p>
  remarks: >-
    If two <xref href="ShapeEngine.Input.InputAction" data-throw-if-not-resolved="false"></xref> have the same <xref href="ShapeEngine.Input.InputAction.ExecutionOrder" data-throw-if-not-resolved="false"></xref>,

    <xref href="ShapeEngine.Input.InputAction.Id" data-throw-if-not-resolved="false"></xref> is used to determine the order.

    A lower <xref href="ShapeEngine.Input.InputAction.Id" data-throw-if-not-resolved="false"></xref> value is processed first.


    <p>

    This is especially useful when combined with <xref href="ShapeEngine.Input.InputAction.BlocksInput" data-throw-if-not-resolved="false"></xref>,

    as it allows precise control over which <xref href="ShapeEngine.Input.InputAction" data-throw-if-not-resolved="false"></xref> instances can block others based on their execution order.

    </p>
  example: []
  syntax:
    content: public int ExecutionOrder { get; set; }
    parameters: []
    return:
      type: System.Int32
    content.vb: Public Property ExecutionOrder As Integer
  overload: ShapeEngine.Input.InputAction.ExecutionOrder*
