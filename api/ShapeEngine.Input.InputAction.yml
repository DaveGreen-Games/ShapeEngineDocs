- uid: ShapeEngine.Input.InputAction.BlocksInput
  commentId: F:ShapeEngine.Input.InputAction.BlocksInput
  id: BlocksInput
  parent: ShapeEngine.Input.InputAction
  langs:
  - csharp
  - vb
  name: BlocksInput
  nameWithType: InputAction.BlocksInput
  fullName: ShapeEngine.Input.InputAction.BlocksInput
  type: Field
  source:
    remote:
      path: ShapeEngine/Input/InputAction.cs
      branch: main
      repo: https://github.com/DaveGreen-Games/ShapeEngine.git
    id: BlocksInput
    path: ../ShapeEngine/ShapeEngine/Input/InputAction.cs
    startLine: 107
  assemblies:
  - ShapeEngine
  namespace: ShapeEngine.Input
  summary: >-
    Gets or sets whether this input action blocks input types after use.

    <xref href="ShapeEngine.Input.InputAction" data-throw-if-not-resolved="false"></xref> has to be part of an <xref href="ShapeEngine.Input.InputActionTree" data-throw-if-not-resolved="false"></xref> to participate in the blocking system.


    <p>

    If set to <code>true</code>, input types used by this action will be added to the block list for the current frame,

    preventing other actions from using the same input types until the next frame.

    </p>

    <p>

    If <xref href="ShapeEngine.Input.InputAction.Active" data-throw-if-not-resolved="false"></xref> is set to <code>false</code>,

    or if <xref href="ShapeEngine.Input.InputAction.AccessTag" data-throw-if-not-resolved="false"></xref> does not have access,

    this action will not block input types.

    </p>
  remarks: >-
    Only <xref href="ShapeEngine.Input.InputAction" data-throw-if-not-resolved="false"></xref>s with <code>BlocksInput</code> enabled participate in this blocking system.

    If set to <code>false</code>, this action neither blocks input types nor can it be blocked by others.
  example: []
  syntax:
    content: public bool BlocksInput
    return:
      type: System.Boolean
    content.vb: Public BlocksInput As Boolean
