    id: Consume
    path: ../ShapeEngine/ShapeEngine/Input/InputAction.cs
    startLine: 306
  assemblies:
  - ShapeEngine
  namespace: ShapeEngine.Input
  summary: Consumes the current input <xref href="ShapeEngine.Input.InputAction.State" data-throw-if-not-resolved="false"></xref> and marks it as consumed.
  remarks: >-
    Useful for <xref href="ShapeEngine.Input.InputAction" data-throw-if-not-resolved="false"></xref> instances that may be referenced in multiple places, but should only be consumed once per frame.

    For example, a "menu accept" action might be used in several contexts, but should only trigger in the first context that processes it.

    If your system ensures single-use per frame by design, this method is unnecessary. <xref href="ShapeEngine.Input.InputActionTree" data-throw-if-not-resolved="false"></xref>s are helpful for isolating input actions, allowing only one tree to be active at a time.
  example: []
  syntax:
    content: public InputState Consume(out bool valid)
    parameters:
    - id: valid
      type: System.Boolean
      description: True if the state was not already consumed; otherwise, false.
    return:
      type: ShapeEngine.Input.InputState
      description: The previous input state before consumption.
    content.vb: Public Function Consume(valid As Boolean) As InputState
  overload: ShapeEngine.Input.InputAction.Consume*
  nameWithType.vb: InputAction.Consume(Boolean)
  fullName.vb: ShapeEngine.Input.InputAction.Consume(Boolean)
  name.vb: Consume(Boolean)
