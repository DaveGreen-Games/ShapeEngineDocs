    id: AccessTag
    path: ../ShapeEngine/ShapeEngine/Input/InputAction.cs
    startLine: 144
  assemblies:
  - ShapeEngine
  namespace: ShapeEngine.Input
  summary: >-
    The access tag used for locking/unlocking this action.

    <remarks>

    <ul><li>Determines access of this action.</li><li>Only used when input actions are locked.</li><li>If this tag is contained in the lock blacklist while the lock is active, the <xref href="ShapeEngine.Input.InputState" data-throw-if-not-resolved="false"></xref> of this <xref href="ShapeEngine.Input.InputAction" data-throw-if-not-resolved="false"></xref> will not be available.</li><li>If this tag is contained in the lock whitelist while the lock is active, the <xref href="ShapeEngine.Input.InputState" data-throw-if-not-resolved="false"></xref> of this <xref href="ShapeEngine.Input.InputAction" data-throw-if-not-resolved="false"></xref> will always be available.</li><li>If <xref href="ShapeEngine.Input.InputSystem.AllAccessTag" data-throw-if-not-resolved="false"></xref> is used the <xref href="ShapeEngine.Input.InputState" data-throw-if-not-resolved="false"></xref> of this <xref href="ShapeEngine.Input.InputAction" data-throw-if-not-resolved="false"></xref> will always be available, regardless of the lock state.</li></ul>

    </remarks>
  example: []
  syntax:
    content: public uint AccessTag { get; }
    parameters: []
    return:
      type: System.UInt32
    content.vb: Public Property AccessTag As UInteger
  overload: ShapeEngine.Input.InputAction.AccessTag*
