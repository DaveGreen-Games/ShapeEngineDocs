  assemblies:
  - ShapeEngine
  namespace: ShapeEngine.ShapeClipper
  summary: Provides a simple reusable pool of <xref href="ShapeEngine.ShapeClipper.TriMesh" data-throw-if-not-resolved="false"></xref> instances to reduce allocations during repeated triangulation work.
  remarks: >-
    Rented meshes are cleared before being returned to the caller, and returned meshes are cleared again before being stored in the pool.

    This type is intended for manual reuse patterns and does not perform thread synchronization.
  example: []
  syntax:
    content: public class TriMeshPool
    content.vb: Public Class TriMeshPool
