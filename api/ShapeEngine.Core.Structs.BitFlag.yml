  assemblies:
  - ShapeEngine
  namespace: ShapeEngine.Core.Structs
  summary: Represents a bitwise flag structure for efficient flag manipulation using uint values.
  remarks: Provides bitwise operations and utility methods for managing sets of flags. Supports combining multiple flags and checking for their presence.
  example: []
  syntax:
    content: 'public readonly struct BitFlag : IBitwiseOperators<BitFlag, BitFlag.BitValue, BitFlag>, IBitwiseOperators<BitFlag, uint, BitFlag>'
