  namespace: ShapeEngine.Geometry.CollisionSystem
  summary: Thread-safe retrieval of candidate buckets that may contain colliders overlapping the given <code class="paramref">collider</code>.
  remarks: >-
    Uses a thread-local temporary <xref href="System.Collections.Generic.HashSet%601" data-throw-if-not-resolved="false"></xref> to collect cell IDs and avoid per-call allocations.

    If the collider already has cached bucket ids in the register, those are used directly.
  example: []
  syntax:
    content: public int GetCandidateBucketsThreadSafe(Collider collider, ref List<BroadphaseBucket> candidateBuckets)
    parameters:
    - id: collider
      type: ShapeEngine.Geometry.CollisionSystem.Collider
      description: The collider to query. Disabled colliders are ignored.
    - id: candidateBuckets
      type: System.Collections.Generic.List{ShapeEngine.Geometry.CollisionSystem.BroadphaseBucket}
      description: A list to populate with candidate buckets that may contain overlapping colliders.
    return:
      type: System.Int32
      description: The number of buckets added to <code class="paramref">candidateBuckets</code>.
    content.vb: Public Function GetCandidateBucketsThreadSafe(collider As Collider, candidateBuckets As List(Of BroadphaseBucket)) As Integer
