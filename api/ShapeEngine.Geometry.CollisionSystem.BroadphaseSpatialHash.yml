  assemblies:
  - ShapeEngine
  namespace: ShapeEngine.Geometry.CollisionSystem
  summary: >-
    Initializes a new instance of the <xref href="ShapeEngine.Geometry.CollisionSystem.BroadphaseSpatialHash" data-throw-if-not-resolved="false"></xref> class using the provided bounding rectangle

    and a desired bucket size.

    The grid's column and row counts are computed by dividing the bounds' dimensions by

    <code class="paramref">bucketSize</code> and rounding up so the grid fully covers the bounds.
  remarks: >-
    The values of <xref href="ShapeEngine.Geometry.CollisionSystem.BroadphaseSpatialHash.SpacingX" data-throw-if-not-resolved="false"></xref> and <xref href="ShapeEngine.Geometry.CollisionSystem.BroadphaseSpatialHash.SpacingY" data-throw-if-not-resolved="false"></xref> are derived from the resolved

    <xref href="ShapeEngine.Geometry.CollisionSystem.BroadphaseSpatialHash.Rows" data-throw-if-not-resolved="false"></xref> and <xref href="ShapeEngine.Geometry.CollisionSystem.BroadphaseSpatialHash.Cols" data-throw-if-not-resolved="false"></xref> (rather than being set directly from

    <code class="paramref">bucketSize</code>). This ensures the grid cells evenly partition the provided

    <code class="paramref">bounds</code> and that the grid fully covers it even when the bounds' dimensions

    are not exact multiples of the requested bucket size.
  example: []
  syntax:
    content: public BroadphaseSpatialHash(Rect bounds, Size bucketSize)
    parameters:
    - id: bounds
      type: ShapeEngine.Geometry.RectDef.Rect
      description: The bounding rectangle for the grid.
    - id: bucketSize
      type: ShapeEngine.Core.Structs.Size
      description: The desired width and height of each bucket cell.
    content.vb: Public Sub New(bounds As Rect, bucketSize As Size)
  overload: ShapeEngine.Geometry.CollisionSystem.BroadphaseSpatialHash.#ctor*
  nameWithType.vb: BroadphaseSpatialHash.New(Rect, Size)
  fullName.vb: ShapeEngine.Geometry.CollisionSystem.BroadphaseSpatialHash.New(ShapeEngine.Geometry.RectDef.Rect, ShapeEngine.Core.Structs.Size)
