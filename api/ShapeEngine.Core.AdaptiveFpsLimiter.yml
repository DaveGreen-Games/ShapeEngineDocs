  assemblies:
  - ShapeEngine
  namespace: ShapeEngine.Core
  summary: >-
    Adaptive FPS limiter that adjusts the engine's target framerate at runtime based on measured frame times.

    It reduces the target framerate when frames are consistently slower than the current target and raises it

    when frames are consistently faster, honoring configured cooldowns, tolerances and limits.
  remarks: >-
    Construct with a <xref href="ShapeEngine.Core.AdaptiveFpsLimiter.Settings" data-throw-if-not-resolved="false"></xref> instance. The limiter clamps target values to <xref href="ShapeEngine.Core.AdaptiveFpsLimiter.Limit" data-throw-if-not-resolved="false"></xref> and

    is not thread-safe — intended for use from the main/update thread.
  example: []
  syntax:
    content: public sealed class AdaptiveFpsLimiter
    content.vb: Public NotInheritable Class AdaptiveFpsLimiter
  inheritance:
