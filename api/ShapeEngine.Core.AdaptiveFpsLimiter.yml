  commentId: M:ShapeEngine.Core.AdaptiveFpsLimiter.#ctor(ShapeEngine.Core.AdaptiveFpsLimiter.Settings)
  id: '#ctor(ShapeEngine.Core.AdaptiveFpsLimiter.Settings)'
  parent: ShapeEngine.Core.AdaptiveFpsLimiter
  langs:
  - csharp
  - vb
  name: AdaptiveFpsLimiter(Settings)
  nameWithType: AdaptiveFpsLimiter.AdaptiveFpsLimiter(AdaptiveFpsLimiter.Settings)
  fullName: ShapeEngine.Core.AdaptiveFpsLimiter.AdaptiveFpsLimiter(ShapeEngine.Core.AdaptiveFpsLimiter.Settings)
  type: Constructor
  source:
    remote:
      path: ShapeEngine/Core/AdaptiveFpsLimiter.cs
      branch: main
      repo: https://github.com/DaveGreen-Games/ShapeEngine.git
    id: .ctor
    path: ../ShapeEngine/ShapeEngine/Core/AdaptiveFpsLimiter.cs
    startLine: 376
  assemblies:
  - ShapeEngine
  namespace: ShapeEngine.Core
  summary: Initializes a new instance of the <xref href="ShapeEngine.Core.AdaptiveFpsLimiter" data-throw-if-not-resolved="false"></xref> class using the provided <xref href="ShapeEngine.Core.AdaptiveFpsLimiter.Settings" data-throw-if-not-resolved="false"></xref>.
  remarks: >-
    The constructor:

    - Clamps the configured minimum and maximum FPS to the static bounds (<xref href="ShapeEngine.Core.AdaptiveFpsLimiter.MinFpsLimit" data-throw-if-not-resolved="false"></xref> and <xref href="ShapeEngine.Core.AdaptiveFpsLimiter.MaxFpsLimit" data-throw-if-not-resolved="false"></xref>).

    - Swaps min/max when they are supplied in the wrong order.

    - Assigns <xref href="ShapeEngine.Core.AdaptiveFpsLimiter.Limit" data-throw-if-not-resolved="false"></xref>, which will also clamp <xref href="ShapeEngine.Core.AdaptiveFpsLimiter.TargetFps" data-throw-if-not-resolved="false"></xref> to the resulting range.

    - Applies settings to the limiter's public properties. The limiter is not thread-safe and is intended to be used
      from the engine's main/update thread.
  example: []
  syntax:
    content: public AdaptiveFpsLimiter(AdaptiveFpsLimiter.Settings settings)
    parameters:
    - id: settings
      type: ShapeEngine.Core.AdaptiveFpsLimiter.Settings
      description: >-
        Configuration used to initialize enabled state, allowed FPS range, cooldowns,
            averaging weights and reduction steps.
    content.vb: Public Sub New(settings As AdaptiveFpsLimiter.Settings)
