  assemblies:
  - ShapeEngine
  namespace: ShapeEngine.Core
  summary: Current target frames-per-second that the engine should aim for.
  remarks: >-
    Getter is public; setter is private. The limiter updates this value (for example in <xref href="ShapeEngine.Core.AdaptiveFpsLimiter.Update(System.Int32%2cSystem.Double%2cSystem.Double)" data-throw-if-not-resolved="false"></xref> and <xref href="ShapeEngine.Core.AdaptiveFpsLimiter.ChangeSettings(ShapeEngine.Core.AdaptiveFpsLimiter.Settings)" data-throw-if-not-resolved="false"></xref>)

    and it is clamped to the configured <xref href="ShapeEngine.Core.AdaptiveFpsLimiter.Limit" data-throw-if-not-resolved="false"></xref>. Not thread-safe — intended to be used from the main/update thread.
