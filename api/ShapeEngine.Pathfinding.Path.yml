  assemblies:
  - ShapeEngine
  namespace: ShapeEngine.Pathfinding
  summary: Creates a deep copy of this <xref href="ShapeEngine.Pathfinding.Path" data-throw-if-not-resolved="false"></xref>.
  example: []
  syntax:
    content: public Path Copy()
    return:
      type: ShapeEngine.Pathfinding.Path
      description: >-
        A new <xref href="ShapeEngine.Pathfinding.Path" data-throw-if-not-resolved="false"></xref> instance with the same <xref href="ShapeEngine.Pathfinding.Path.Start" data-throw-if-not-resolved="false"></xref> and <xref href="ShapeEngine.Pathfinding.Path.End" data-throw-if-not-resolved="false"></xref> values

        and an independent copy of the internal rectangles list (created via <xref href="ShapeEngine.Pathfinding.Path.GetRectsCopy" data-throw-if-not-resolved="false"></xref>).

        The returned instance is marked as rented; callers can return it to the pool using

        <xref href="ShapeEngine.Pathfinding.Path.ReturnInstance" data-throw-if-not-resolved="false"></xref> / <xref href="ShapeEngine.Pathfinding.Path.ReturnPath(ShapeEngine.Pathfinding.Path)" data-throw-if-not-resolved="false"></xref> when finished or keep it for independent use.

        Once returned to the pool, the original instance should not be accessed further.
