  assemblies:
  - ShapeEngine
  namespace: ShapeEngine.Pathfinding
  summary: >-
    Returns a collection of rented <xref href="ShapeEngine.Pathfinding.Path" data-throw-if-not-resolved="false"></xref> instances to the internal pool.

    Each path will be cleared and enqueued via <xref href="ShapeEngine.Pathfinding.Path.ReturnPath(ShapeEngine.Pathfinding.Path)" data-throw-if-not-resolved="false"></xref>; after calling this

    the caller must not access the returned instances.
  remarks: >-
    <code class="paramref">paths</code> should be cleared after calling this method to avoid accidental access

    to returned instances.
