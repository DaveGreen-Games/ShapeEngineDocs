  summary: >-
    Rent a <xref href="ShapeEngine.Pathfinding.Path" data-throw-if-not-resolved="false"></xref> instance from the pool or create a new one if none are available.

    The returned instance will have its <xref href="ShapeEngine.Pathfinding.Path.Start" data-throw-if-not-resolved="false"></xref> and <xref href="ShapeEngine.Pathfinding.Path.End" data-throw-if-not-resolved="false"></xref> properties set.
