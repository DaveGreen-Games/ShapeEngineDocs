  summary: Provides a read-only view of the internal list of rectangles that compose this path.
  remarks: >-
    Returns the internal <xref href="ShapeEngine.Pathfinding.Path.RectsList" data-throw-if-not-resolved="false"></xref> as an <xref href="System.Collections.Generic.IReadOnlyList%601" data-throw-if-not-resolved="false"></xref>.

