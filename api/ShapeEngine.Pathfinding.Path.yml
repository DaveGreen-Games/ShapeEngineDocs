    id: GetRectsCopy
    path: ../ShapeEngine/ShapeEngine/Pathfinding/Path.cs
    startLine: 134
  assemblies:
  - ShapeEngine
  namespace: ShapeEngine.Pathfinding
  summary: Creates and returns a new list containing the rectangles from the internal backing list.
  remarks: >-
    This method allocates a new list. Prefer using the <xref href="ShapeEngine.Pathfinding.Path.Rects" data-throw-if-not-resolved="false"></xref> property for a non-allocating

    read-only view when possible. Do not rely on the original <xref href="ShapeEngine.Pathfinding.Path" data-throw-if-not-resolved="false"></xref> after it has been

    returned to the pool; the returned copy is the only safe representation to hold beyond that.
  example: []
  syntax:
    content: public List<Rect> GetRectsCopy()
    return:
      type: System.Collections.Generic.List{ShapeEngine.Geometry.RectDef.Rect}
      description: >-
        A new <xref href="System.Collections.Generic.List%601" data-throw-if-not-resolved="false"></xref> containing the path's rectangles. The returned list is a copy and

        can be modified independently of the <xref href="ShapeEngine.Pathfinding.Path" data-throw-if-not-resolved="false"></xref> instance.
    content.vb: Public Function GetRectsCopy() As List(Of Rect)
  overload: ShapeEngine.Pathfinding.Path.GetRectsCopy*
