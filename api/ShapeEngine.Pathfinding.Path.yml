  assemblies:
  - ShapeEngine
  namespace: ShapeEngine.Pathfinding
  summary: >-
    Represents a path used by the pathfinding system.

    Contains the start and end positions and the sequence of rectangles that form the path.

    Instances are intended to be rented from and returned to an internal pool

    using <xref href="ShapeEngine.Pathfinding.Path.RentPath(System.Numerics.Vector2%2cSystem.Numerics.Vector2%2cSystem.Int32)" data-throw-if-not-resolved="false"></xref> and <xref href="ShapeEngine.Pathfinding.Path.ReturnPath(ShapeEngine.Pathfinding.Path)" data-throw-if-not-resolved="false"></xref> to minimize allocations.
  remarks: >-
    Returned instances will have their <xref href="ShapeEngine.Pathfinding.Path.Rects" data-throw-if-not-resolved="false"></xref> collection cleared before being reused.

    Returned instances should not be accessed after being returned to the pool.
  example: []
  syntax:
    content: public class Path
    content.vb: Public Class Path
