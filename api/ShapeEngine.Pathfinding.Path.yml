    content: public static Path RentPath(Vector2 start, Vector2 end, int capacity)
    parameters:
    - id: start
      type: System.Numerics.Vector2
      description: The starting position of the path.
    - id: end
      type: System.Numerics.Vector2
      description: The ending position of the path.
    - id: capacity
      type: System.Int32
      description: Initial capacity for the internal <xref href="ShapeEngine.Pathfinding.Path.Rects" data-throw-if-not-resolved="false"></xref> list.
    return:
      type: ShapeEngine.Pathfinding.Path
      description: A <xref href="ShapeEngine.Pathfinding.Path" data-throw-if-not-resolved="false"></xref> instance ready for use.
