  assemblies:
  - ShapeEngine
  namespace: ShapeEngine.Core
  summary: >-
    Represents a base class for all game objects in the engine.

    Provides lifecycle management, update/draw hooks, and layer/bounds logic.
  remarks: GameObject is intended to be subclassed for specific game logic. It supports kill/revive semantics, event hooks, and parallax/bounds management.
  example: []
  syntax:
