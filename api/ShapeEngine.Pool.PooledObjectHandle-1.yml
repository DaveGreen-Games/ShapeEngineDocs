  assemblies:
  - ShapeEngine
  namespace: ShapeEngine.Pool
  summary: Disposes the handle, returning the contained instance to its owning pool.
  remarks: >-
    This method is idempotent and thread-safe:

    it atomically clears the internal pool reference so that only the first caller actually returns the instance.

    After disposal, accessing <xref href="ShapeEngine.Pool.PooledObjectHandle%601.Value" data-throw-if-not-resolved="false"></xref> throws <xref href="System.ObjectDisposedException" data-throw-if-not-resolved="false"></xref>.
  example: []
  syntax:
    content: public void Dispose()
    content.vb: Public Sub Dispose()
  overload: ShapeEngine.Pool.PooledObjectHandle`1.Dispose*
