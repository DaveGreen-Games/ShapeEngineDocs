  assemblies:
  - ShapeEngine
  namespace: ShapeEngine.Serialization
  summary: >-
    Represents a strongly-typed list of <code class="typeparamref">T</code> objects, where <code class="typeparamref">T</code> is a subclass of <xref href="ShapeEngine.Serialization.DataObject" data-throw-if-not-resolved="false"></xref>.

    Provides methods for retrieving entries by name and for selecting random entries, including type-specific and unique selections.
  remarks: This class extends <xref href="System.Collections.Generic.List%601" data-throw-if-not-resolved="false"></xref> and adds convenience methods for common data object operations, such as random selection and type filtering.
  example: []
  syntax:
    content: 'public class DataObjectList<T> : List<T>, IList<T>, ICollection<T>, IReadOnlyList<T>, IReadOnlyCollection<T>, IEnumerable<T>, IList, ICollection, IEnumerable where T : DataObject'
    typeParameters:
    - id: T
      description: The type of objects in the list. Must inherit from <xref href="ShapeEngine.Serialization.DataObject" data-throw-if-not-resolved="false"></xref>. Each <code class="typeparamref">T</code> must have a unique <code>Name</code> property for retrieval.
