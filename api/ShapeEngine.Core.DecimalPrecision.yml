  assemblies:
  - ShapeEngine
  namespace: ShapeEngine.Core
  summary: Represents a decimal-place precision setting together with its derived base-10 scale factors.
  remarks: >-
    This type is useful when converting floating-point values into quantized integer-like values,

    for example during geometric hashing or when interfacing with systems that operate on scaled coordinates.

    Supported precision values are clamped to the inclusive range <code>0</code> to <code>16</code>.
