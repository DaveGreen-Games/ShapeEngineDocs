  assemblies:
  - ShapeEngine
  namespace: ShapeEngine.Core
  summary: Provides stable 64-bit FNV-1a hashing for quantized floating-point and <xref href="System.Numerics.Vector2" data-throw-if-not-resolved="false"></xref> values.
  remarks: >-
    Values are first quantized through the configured <xref href="ShapeEngine.Core.DecimalQuantizer" data-throw-if-not-resolved="false"></xref>, then folded into

    an FNV-1a hash. This allows callers to generate deterministic hashes that ignore insignificant

    floating-point noise at the selected decimal precision.
