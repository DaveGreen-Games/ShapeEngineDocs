  namespace: ShapeEngine.Geometry.QuadDef
  summary: Represents a quadrilateral (quad) collider used for collision detection in 2D space.
  remarks: >-
    The quad's position, size, and rotation are determined by the (<code>CurTransform</code>).

    Alignment is controlled by an anchor point, allowing flexible positioning relative to the transform.
