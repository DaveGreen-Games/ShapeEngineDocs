  namespace: ShapeEngine.Geometry.CircleDef
  summary: Draws the circle outline as individual line segments clipped by a <xref href="ShapeEngine.Geometry.TriangleDef.Triangle" data-throw-if-not-resolved="false"></xref> mask.
  example: []
  syntax:
    content: public static void DrawLinesMasked(this Circle circle, Triangle mask, LineDrawingInfo lineInfo, float rotDeg, int sides, bool reversedMask = false)
    parameters:
    - id: circle
      type: ShapeEngine.Geometry.CircleDef.Circle
      description: The source <xref href="ShapeEngine.Geometry.CircleDef.Circle" data-throw-if-not-resolved="false"></xref> whose circumference will be approximated by segments.
    - id: mask
      type: ShapeEngine.Geometry.TriangleDef.Triangle
      description: The <xref href="ShapeEngine.Geometry.TriangleDef.Triangle" data-throw-if-not-resolved="false"></xref> used to mask (clip) each generated segment.
    - id: lineInfo
      type: ShapeEngine.Geometry.LineDrawingInfo
      description: Parameters controlling line drawing (thickness, color, cap type, etc.).
    - id: rotDeg
      type: System.Single
      description: Rotation offset in degrees applied to the entire approximated polygon.
    - id: sides
      type: System.Int32
      description: Number of sides used to approximate the circle. Values below 3 will be clamped to 3.
    - id: reversedMask
      type: System.Boolean
      description: If true, draws the parts inside the mask instead of outside.
