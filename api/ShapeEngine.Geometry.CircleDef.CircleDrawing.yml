  remarks: Useful for visualizing grid or checkered overlays on circular shapes.
  example: []
  syntax:
    content: public static void DrawCircleCheckeredLines(Vector2 pos, AnchorPoint alignment, float radius, float spacing, float lineThickness, float angleDeg, ColorRgba lineColorRgba, ColorRgba bgColorRgba, int circleSegments)
