  assemblies:
  - ShapeEngine
  namespace: ShapeEngine.Input
  summary: >-
    <p>

    The process priority of this keyboard device instance.

    </p>

    <p>

    Change this value to change the order in which this device is processed in <xref href="ShapeEngine.Input.ShapeInput" data-throw-if-not-resolved="false"></xref>.

    Lower priorities are processed first.

    </p>
  remarks: A unique value based on the order of instantiation is assigned per default.
