  assemblies:
  - ShapeEngine
  namespace: ShapeEngine.Core
  summary: Represents an object that can be drawn in the game and UI layers.
  remarks: >-
    Implement this interface to provide custom drawing logic for game objects. 

    The <xref href="ShapeEngine.Core.IDrawable.DrawGame(ShapeEngine.Core.Structs.ScreenInfo)" data-throw-if-not-resolved="false"></xref> method is affected by the camera and screen shaders, while <xref href="ShapeEngine.Core.IDrawable.DrawGameUI(ShapeEngine.Core.Structs.ScreenInfo)" data-throw-if-not-resolved="false"></xref> is only affected by screen shaders.
  example: []
  syntax:
    content: public interface IDrawable
    content.vb: Public Interface IDrawable
