  assemblies:
  - ShapeEngine
  namespace: ShapeEngine.ShapeClipper
  summary: Provides reusable helpers for performing boolean clipping operations on Clipper <xref href="Clipper2Lib.Path64" data-throw-if-not-resolved="false"></xref> and <xref href="Clipper2Lib.Paths64" data-throw-if-not-resolved="false"></xref> geometry, as well as engine polygon data represented by <xref href="System.Numerics.Vector2" data-throw-if-not-resolved="false"></xref> lists.
  remarks: >-
    This type wraps a reusable <xref href="Clipper2Lib.Clipper64" data-throw-if-not-resolved="false"></xref> instance and several internal buffers to reduce allocations across repeated clipping operations.

    It is intended for sequential use and does not provide thread synchronization.
