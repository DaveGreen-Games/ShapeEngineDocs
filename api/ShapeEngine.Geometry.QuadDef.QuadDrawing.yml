  assemblies:
  - ShapeEngine
  namespace: ShapeEngine.Geometry.QuadDef
  summary: Draws the quad's outline segments constrained by a generic closed-shape mask.
  remarks: >-
    Forwards the draw call to each segment's <code>DrawMasked</code> overload, allowing per-segment clipping

    by the provided mask. This generic overload enables using any closed-shape provider without

    adding a separate overload for each concrete shape type.
  example: []
  syntax:
    content: 'public static void DrawLinesMasked<T>(this Quad quad, T mask, LineDrawingInfo lineInfo, bool reversedMask = false) where T : IClosedShapeTypeProvider'
    parameters:
    - id: quad
      type: ShapeEngine.Geometry.QuadDef.Quad
      description: The quad whose sides will be drawn (extension receiver).
    - id: mask
      type: '{T}'
      description: Mask used to clip each segment's drawing.
    - id: lineInfo
      type: ShapeEngine.Geometry.LineDrawingInfo
      description: Line drawing parameters (thickness, color, cap type, etc.).
    - id: reversedMask
      type: System.Boolean
      description: If true, draws the parts inside the mask instead of outside.
    typeParameters:
    - id: T
      description: >-
        The mask type. Must implement <xref href="ShapeEngine.Geometry.IClosedShapeTypeProvider" data-throw-if-not-resolved="false"></xref> to provide closed-shape semantics

        required for segment clipping.
    content.vb: Public Shared Sub DrawLinesMasked(Of T As IClosedShapeTypeProvider)(quad As Quad, mask As T, lineInfo As LineDrawingInfo, reversedMask As Boolean = False)
