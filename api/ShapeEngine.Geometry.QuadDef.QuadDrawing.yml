  assemblies:
  - ShapeEngine
  namespace: ShapeEngine.Geometry.QuadDef
  summary: Draws a specified percentage of the outline of a quadrilateral.
  remarks: Useful for animating outlines or highlighting portions of a quad.
  example: []
  syntax:
    content: public static void DrawQuadLinesPercentage(Vector2 a, Vector2 b, Vector2 c, Vector2 d, float f, float lineThickness, ColorRgba color, LineCapType capType = LineCapType.CappedExtended, int capPoints = 2)
    parameters:
    - id: a
      type: System.Numerics.Vector2
      description: The first vertex of the quad.
    - id: b
      type: System.Numerics.Vector2
      description: The second vertex of the quad.
    - id: c
      type: System.Numerics.Vector2
      description: The third vertex of the quad.
    - id: d
      type: System.Numerics.Vector2
      description: The fourth vertex of the quad.
    - id: f
      type: System.Single
      description: >-
        The percentage of the outline to draw. 

        <ul><li>Negative value reverses the direction (clockwise).</li><li>Integer part changes the starting corner (0 = a, 1 = b, etc.).</li><li>Fractional part is the percentage of the outline to draw.</li><li>Example: 0.35 starts at corner a, goes counter-clockwise, and draws 35% of the outline.</li><li>Example: -2.7 starts at b (third corner in cw direction), draws 70% of the outline in cw direction.</li></ul>
    - id: lineThickness
      type: System.Single
      description: The thickness of the outline.
    - id: color
      type: ShapeEngine.Color.ColorRgba
      description: The color of the outline.
    - id: capType
      type: ShapeEngine.Geometry.LineCapType
      description: The style of the line caps.
    - id: capPoints
      type: System.Int32
      description: The number of points used for the cap style.
    content.vb: Public Shared Sub DrawQuadLinesPercentage(a As Vector2, b As Vector2, c As Vector2, d As Vector2, f As Single, lineThickness As Single, color As ColorRgba, capType As LineCapType = LineCapType.CappedExtended, capPoints As Integer = 2)
