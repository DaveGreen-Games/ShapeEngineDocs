  summary: Draws the outline of a <xref href="ShapeEngine.Geometry.QuadDef.Quad" data-throw-if-not-resolved="false"></xref> where each side can be scaled towards the origin of the side.
  remarks: Allows for dynamic scaling and rotation of quad outlines, useful for effects and animations.
  example: []
  syntax:
    content: public static void DrawLinesScaled(this Quad q, LineDrawingInfo lineInfo, float rotDeg, AnchorPoint alignment, float sideScaleFactor, float sideScaleOrigin = 0.5)
    parameters:
    - id: q
      type: ShapeEngine.Geometry.QuadDef.Quad
      description: The quad to outline.
    - id: lineInfo
      type: ShapeEngine.Geometry.LineDrawingInfo
      description: The line drawing information (thickness, color, cap type, etc.).
    - id: rotDeg
      type: System.Single
      description: The rotation of the quad in degrees.
    - id: alignment
      type: ShapeEngine.Core.Structs.AnchorPoint
      description: The anchor point for rotation alignment.
    - id: sideScaleFactor
      type: System.Single
      description: >-
        <p>The scale factor for each side.</p>

        <ul><li>0: No quad is drawn.</li><li>1: The normal quad is drawn.</li><li>0.5: Each side is half as long.</li></ul>
    - id: sideScaleOrigin
      type: System.Single
      description: >-
        The point along the line to scale from, in both directions (0 to 1).

        <ul><li>0: Start of Segment</li><li>0.5: Center of Segment</li><li>1: End of Segment</li></ul>
    content.vb: Public Shared Sub DrawLinesScaled(q As Quad, lineInfo As LineDrawingInfo, rotDeg As Single, alignment As AnchorPoint, sideScaleFactor As Single, sideScaleOrigin As Single = 0.5)
