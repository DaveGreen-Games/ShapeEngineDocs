  assemblies:
  - ShapeEngine
  namespace: ShapeEngine.Serialization
  summary: >-
    Abstract base record for serializable data objects.

    If used for XML serialization,

    XML attributes have to be used and added to <xref href="ShapeEngine.Serialization.DataObject.Name" data-throw-if-not-resolved="false"></xref> and <xref href="ShapeEngine.Serialization.DataObject.SpawnWeight" data-throw-if-not-resolved="false"></xref> members

    using new keyword (see XML code example).
  remarks: >-
    To be serializable by <xref href="ShapeEngine.Serialization.XmlDataObjectSerializer%601" data-throw-if-not-resolved="false"></xref> or <xref href="ShapeEngine.Serialization.JsonDataObjectSerializer%601" data-throw-if-not-resolved="false"></xref>

    all members have to be public and have both getter and setter.

    If used for XML serialization, XML attributes have to be used (See code example).

    For instance the difference between XML attributes and XML elements is:


    <ul><li>[XmlAttribute("Name")] -&gt; XmlAttribute maps a property to an XML attribute, appearing inside the opening tag: <Person Name="John" Age="30"></Person></li><li>[XmlElement("Name")] -&gt; XmlElement maps a property to an XML element, appearing as a child node: <Person><Name>John</Name><Age>30</Age></Person></li></ul>
  example: []
  syntax:
    content: 'public abstract record DataObject : IEquatable<DataObject>'
    content.vb: Public MustInherit Class DataObject Implements IEquatable(Of DataObject)
