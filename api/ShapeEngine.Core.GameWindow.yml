- uid: ShapeEngine.Core.GameWindow.AdaptiveFpsLimiter
  commentId: P:ShapeEngine.Core.GameWindow.AdaptiveFpsLimiter
  id: AdaptiveFpsLimiter
  parent: ShapeEngine.Core.GameWindow
  langs:
  - csharp
  - vb
  name: AdaptiveFpsLimiter
  nameWithType: GameWindow.AdaptiveFpsLimiter
  fullName: ShapeEngine.Core.GameWindow.AdaptiveFpsLimiter
  type: Property
  source:
    remote:
      path: ShapeEngine/Core/GameWindow.cs
      branch: main
      repo: https://github.com/DaveGreen-Games/ShapeEngine.git
    id: AdaptiveFpsLimiter
    path: ../ShapeEngine/ShapeEngine/Core/GameWindow.cs
    startLine: 336
  assemblies:
  - ShapeEngine
  namespace: ShapeEngine.Core
  summary: >-
    If enabled the FPS limiter will dynamically adjust the frame rate limit based on performance.

    If an <xref href="ShapeEngine.Core.GameWindow.FpsLimit" data-throw-if-not-resolved="false"></xref> is set (whether through <xref href="ShapeEngine.Core.GameWindow.VSync" data-throw-if-not-resolved="false"></xref> with a valid monitor refresh rate or manually),

    the adaptive limiter will try to keep the frame rate close to that limit and reduce the limit if performance drops.

    If no <xref href="ShapeEngine.Core.GameWindow.FpsLimit" data-throw-if-not-resolved="false"></xref> is set (0 = unlimited), the adaptive limiter will try to keep the frame rate between its configured minimum and maximum limits,

    trying to reach the maximum limit when possible and never going below the minimum limit.
  remarks: Can be enabled or disabled through <xref href="ShapeEngine.Core.AdaptiveFpsLimiter.Enabled" data-throw-if-not-resolved="false"></xref> at any time.
  example: []
  syntax:
    content: public AdaptiveFpsLimiter AdaptiveFpsLimiter { get; }
    parameters: []
    return:
      type: ShapeEngine.Core.AdaptiveFpsLimiter
    content.vb: Public Property AdaptiveFpsLimiter As AdaptiveFpsLimiter
  overload: ShapeEngine.Core.GameWindow.AdaptiveFpsLimiter*
