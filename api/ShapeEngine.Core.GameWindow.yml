  summary: >-
    Gets or sets the frames-per-second limit used when VSync is disabled. 0 means unlimited.

    <xref href="ShapeEngine.Core.GameWindow.VSync" data-throw-if-not-resolved="false"></xref> has to be <xref href="ShapeEngine.Core.VsyncMode.Disabled" data-throw-if-not-resolved="false"></xref> to allow an unlimited frame rate.
  remarks: >-
    When VSync is disabled, assigning to this property will update <xref href="ShapeEngine.Core.GameWindow.TargetFps" data-throw-if-not-resolved="false"></xref> accordingly.

    Otherwise, changing this property has no immediate effect until VSync is set to <xref href="ShapeEngine.Core.VsyncMode.Disabled" data-throw-if-not-resolved="false"></xref>.
