  assemblies:
  - ShapeEngine
  namespace: ShapeEngine.Input
  summary: >-
    Determines if the specified access tag has access.

    <remarks>

    <xref href="ShapeEngine.Input.ShapeInput.AllAccessTag" data-throw-if-not-resolved="false"></xref> always returns true (has access).

    <ul><li>If <code>tag</code> is contained in the current blacklist, this function will return false (no access).</li><li>If <code>tag</code> is not contained in the current blacklist and <code>tag</code> is contained in the current whitelist,

    or the current whitelist is empty, this function will return true (has access).</li></ul>

    </remarks>
  example: []
  syntax:
    content: public static bool HasAccess(uint tag)
    parameters:
    - id: tag
      type: System.UInt32
      description: The access tag to check.
    return:
      type: System.Boolean
      description: True if access is granted; otherwise, false.
    content.vb: Public Shared Function HasAccess(tag As UInteger) As Boolean
  overload: ShapeEngine.Input.ShapeInput.HasAccess*
  nameWithType.vb: ShapeInput.HasAccess(UInteger)
