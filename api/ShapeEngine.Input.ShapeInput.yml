  assemblies:
  - ShapeEngine
  namespace: ShapeEngine.Input
  summary: >-
    Indicates if the input system is currently locked.

    When set to <code>true</code>, <xref href="ShapeEngine.Input.InputAction" data-throw-if-not-resolved="false"></xref>s and other input requests will only be processed

    if they have the <xref href="ShapeEngine.Input.ShapeInput.AllAccessTag" data-throw-if-not-resolved="false"></xref> or their access tag is contained in the lock whitelist.

    All <xref href="ShapeEngine.Input.InputAction" data-throw-if-not-resolved="false"></xref>s and input request with an access tag contained in the lock blacklist will not be processed.
