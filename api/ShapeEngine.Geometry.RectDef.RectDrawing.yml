  assemblies:
  - ShapeEngine
  namespace: ShapeEngine.Geometry.RectDef
  summary: Draws a certain percentage of a rectangle's outline, starting at a specified corner and direction.
  remarks: Useful for progress indicators or animated outlines.
  example: []
  syntax:
    content: public static void DrawRectLinesPercentage(Vector2 topLeft, Vector2 bottomRight, float f, float lineThickness, ColorRgba color, LineCapType capType = LineCapType.CappedExtended, int capPoints = 2)
    parameters:
    - id: topLeft
      type: System.Numerics.Vector2
      description: The top-left corner of the rectangle.
    - id: bottomRight
      type: System.Numerics.Vector2
      description: The bottom-right corner of the rectangle.
    - id: f
      type: System.Single
      description: >-
        Specifies which portion of the rectangle's outline to draw, as well as the starting corner and direction.

        <ul><li>The integer part (0-3) selects the starting corner:

        <ul><li><code>Counter-Clockwise</code> -&gt; 0 = top-left, 1 = bottom-left, 2 = bottom-right, 3 = top-right.</li><li><code>Clockwise</code> -&gt; 0 = top-left, 1 = top-right, 2 = bottom-right, 3 = bottom-left.</li></ul>

        </li><li>The fractional part (0.0-1.0) determines the percentage of the outline to draw, relative to the full perimeter.</li><li>A negative value reverses the drawing direction (clockwise instead of counter-clockwise).</li></ul>

        Examples:

        <ul><li><code>0.35</code> - Start at top-left, draw 35% of the outline counter-clockwise.</li><li><code>-2.7</code> - Start at bottom-right, draw 70% of the outline clockwise.</li></ul>
    - id: lineThickness
      type: System.Single
      description: The thickness of the outline.
    - id: color
      type: ShapeEngine.Color.ColorRgba
      description: The color of the outline.
    - id: capType
      type: ShapeEngine.Geometry.LineCapType
      description: The type of line cap to use.
    - id: capPoints
      type: System.Int32
      description: The number of points for the cap.
    content.vb: Public Shared Sub DrawRectLinesPercentage(topLeft As Vector2, bottomRight As Vector2, f As Single, lineThickness As Single, color As ColorRgba, capType As LineCapType = LineCapType.CappedExtended, capPoints As Integer = 2)
