  namespace: ShapeEngine.Core.Shapes
  summary: Generates a polygon around the given segment. Points are generated ccw around the segment beginning with the segment start.
  example: []
  syntax:
    content: public static Polygon Generate(Segment segment, float magMin = 0.1, float magMax = 0.25, float minSectionLength = 0.025, float maxSectionLength = 0.1)
    parameters:
    - id: segment
      type: ShapeEngine.Core.Shapes.Segment
      description: The segment to build a polygon around.
    - id: magMin
      type: System.Single
      description: The minimum perpendicular magnitude factor for generating a point. (0-1)
    - id: magMax
      type: System.Single
      description: The maximum perpendicular magnitude factor for generating a point. (0-1)
    - id: minSectionLength
      type: System.Single
      description: The minimum factor of the length between points along the line.(0-1)
    - id: maxSectionLength
      type: System.Single
      description: The maximum factor of the length between points along the line.(0-1)
    return:
      type: ShapeEngine.Core.Shapes.Polygon
      description: Returns the a generated polygon.
    content.vb: Public Shared Function Generate(segment As Segment, magMin As Single = 0.1, magMax As Single = 0.25, minSectionLength As Single = 0.025, maxSectionLength As Single = 0.1) As Polygon
