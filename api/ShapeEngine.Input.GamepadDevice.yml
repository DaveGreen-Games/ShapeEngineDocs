  namespace: ShapeEngine.Input
  summary: >-
    Determines if the combined axis (from two buttons) is "down".

    Returns true if either button is pressed enough to exceed the deadzone thresholds,

    considering an optional modifier key set.
  example: []
  syntax:
    content: public bool IsDown(ShapeGamepadButton neg, ShapeGamepadButton pos, float axisDeadzone = 0.15, float triggerDeadzone = 0.15, ModifierKeySet? modifierKeySet = null)
