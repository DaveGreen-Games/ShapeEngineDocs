    - id: neg
      type: ShapeEngine.Input.ShapeGamepadButton
      description: The button representing the negative direction.
    - id: pos
      type: ShapeEngine.Input.ShapeGamepadButton
      description: The button representing the positive direction.
    - id: axisDeadzone
      type: System.Single
      description: Deadzone for axis input.
    - id: triggerDeadzone
      type: System.Single
      description: Deadzone for trigger input.
    - id: modifierKeySet
      type: ShapeEngine.Input.ModifierKeySet
      description: Optional modifier key set to check if active.
    return:
      type: System.Boolean
      description: True if the axis is down; otherwise, false.
