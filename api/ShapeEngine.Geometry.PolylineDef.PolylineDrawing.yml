  namespace: ShapeEngine.Geometry.PolylineDef
  summary: Draws a specified percentage of the polyline's outline.
  remarks: Useful for progress indicators or animated outlines.
  example: []
  syntax:
    content: public static void DrawPercentage(this Polyline polyline, float f, float lineThickness, ColorRgba color, LineCapType capType = LineCapType.CappedExtended, int capPoints = 2)
    parameters:
    - id: polyline
      type: ShapeEngine.Geometry.PolylineDef.Polyline
      description: The polyline to draw.
    - id: f
      type: System.Single
      description: >-
        Specifies the starting corner and the percentage of the outline to draw.

        <ul><li>The integer part selects the starting corner (0 = first corner, 1 = second, etc.).</li><li>The decimal part specifies the percentage of the outline to draw, as a fraction (0.0 to 1.0).</li><li>Negative values draw in the clockwise direction; positive values draw counter-clockwise.</li><li>Example: <code>0.35</code> starts at corner 0, draws 35% of the outline counter-clockwise.</li><li>Example: <code>-2.7</code> starts at corner 2, draws 70% of the outline clockwise.</li></ul>
    - id: lineThickness
      type: System.Single
      description: The thickness of the line segments.
    - id: color
      type: ShapeEngine.Color.ColorRgba
      description: The color to use for the polyline.
    - id: capType
      type: ShapeEngine.Geometry.LineCapType
      description: The type of line cap to use at segment ends.
    - id: capPoints
      type: System.Int32
      description: The number of points used for the cap rendering.
