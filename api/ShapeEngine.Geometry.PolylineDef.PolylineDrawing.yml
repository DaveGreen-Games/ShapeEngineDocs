  namespace: ShapeEngine.Geometry.PolylineDef
  summary: Provides extension methods for drawing polylines with various styles, colors, and transformations.
  remarks: >-
    This static class contains a variety of drawing utilities for <xref href="ShapeEngine.Geometry.PolylineDef.Polyline" data-throw-if-not-resolved="false"></xref> objects, including support for color gradients,

    partial outlines, scaling, and glow effects. All methods are intended for rendering purposes and do not modify the polyline data.
