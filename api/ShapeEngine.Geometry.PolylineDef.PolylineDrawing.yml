  assemblies:
  - ShapeEngine
  namespace: ShapeEngine.Geometry.PolylineDef
  summary: Draws a portion of the polyline's perimeter, as a percentage of the total outline.
  example: []
  syntax:
    content: public static void DrawPercentage(this Polyline polyline, float f, LineDrawingInfo lineInfo)
    parameters:
    - id: polyline
      type: ShapeEngine.Geometry.PolylineDef.Polyline
      description: The polyline to draw.
    - id: f
      type: System.Single
      description: >-
        Specifies the starting corner and the percentage of the outline to draw.

        <ul><li>The integer part selects the starting corner (0 = first corner, 1 = second, etc.).</li><li>The decimal part specifies the percentage of the outline to draw, as a fraction (0.0 to 1.0).</li><li>Negative values draw in the clockwise direction; positive values draw counter-clockwise.</li><li>Example: <code>0.35</code> starts at corner 0, draws 35% of the outline counter-clockwise.</li><li>Example: <code>-2.7</code> starts at corner 2, draws 70% of the outline clockwise.</li></ul>
    - id: lineInfo
      type: ShapeEngine.Geometry.LineDrawingInfo
      description: The drawing information, including thickness, color, and cap type.
    content.vb: Public Shared Sub DrawPercentage(polyline As Polyline, f As Single, lineInfo As LineDrawingInfo)
