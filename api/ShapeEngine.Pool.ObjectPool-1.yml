  assemblies:
  - ShapeEngine
  namespace: ShapeEngine.Pool
  summary: >-
    Creates a disposable handle that wraps a pooled instance.

    The handle will return the instance to this pool when the handle is disposed.
  remarks: >-
    Use the returned handle in a `using` statement (or dispose it manually) to ensure the instance

    is returned to the pool promptly. This method obtains a single instance via <xref href="ShapeEngine.Pool.ObjectPool%601.Rent" data-throw-if-not-resolved="false"></xref>.
  example: []
  syntax:
    content: public PooledObjectHandle<T> GetDisposableHandle()
    return:
      type: ShapeEngine.Pool.PooledObjectHandle{{T}}
      description: A <xref href="ShapeEngine.Pool.PooledObjectHandle%601" data-throw-if-not-resolved="false"></xref> containing a pooled <code class="typeparamref">T</code> instance.
    content.vb: Public Function GetDisposableHandle() As PooledObjectHandle(Of T)
  overload: ShapeEngine.Pool.ObjectPool`1.GetDisposableHandle*
  nameWithType.vb: ObjectPool(Of T).GetDisposableHandle()
  fullName.vb: ShapeEngine.Pool.ObjectPool(Of T).GetDisposableHandle()
