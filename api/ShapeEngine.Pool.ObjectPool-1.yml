  assemblies:
  - ShapeEngine
  namespace: ShapeEngine.Pool
  summary: A thread-safe object pool for reusing instances of type <code class="typeparamref">T</code>.
  remarks: >-
    Uses a thread-safe <xref href="System.Collections.Concurrent.ConcurrentBag%601" data-throw-if-not-resolved="false"></xref> to store available instances.

    Provide a <xref href="System.Func%601" data-throw-if-not-resolved="false"></xref> to create new instances and an optional

    <xref href="System.Action%601" data-throw-if-not-resolved="false"></xref> to reset instances when they are returned to the pool.

    If extension is needed, prefer a wrapper that delegates to <code>ObjectPool</code> rather than deriving from it.
  example: []
  syntax:
    content: 'public sealed class ObjectPool<T> where T : class'
    typeParameters:
    - id: T
      description: The reference type being pooled.
    content.vb: Public NotInheritable Class ObjectPool(Of T As Class)
