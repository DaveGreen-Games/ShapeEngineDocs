  assemblies:
  - ShapeEngine
  namespace: ShapeEngine.Pool
  summary: Removes all objects currently stored in the pool's internal container.
  remarks: >-
    This clears only the available instances held by the pool; instances already checked out

    via <xref href="ShapeEngine.Pool.ObjectPool%601.Rent" data-throw-if-not-resolved="false"></xref> are not affected. The underlying operation uses the thread-safe

    <xref href="System.Collections.Concurrent.ConcurrentBag%601" data-throw-if-not-resolved="false"></xref> implementation.
  example: []
  syntax:
    content: public void Clear()
    content.vb: Public Sub Clear()
  overload: ShapeEngine.Pool.ObjectPool`1.Clear*
  nameWithType.vb: ObjectPool(Of T).Clear()
  fullName.vb: ShapeEngine.Pool.ObjectPool(Of T).Clear()
