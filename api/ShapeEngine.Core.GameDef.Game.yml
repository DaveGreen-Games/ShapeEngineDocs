  assemblies:
  - ShapeEngine
  namespace: ShapeEngine.Core.GameDef
  summary: Gets whether the fixed physics update system is enabled.
  remarks: >-
    When true, the fixed update functions will be called at the FixedPhysicsFramerate.

    Fixed Update call order:

    <ul><li><xref href="ShapeEngine.Core.GameDef.Game.Update(ShapeEngine.Core.Structs.GameTime%2cShapeEngine.Core.Structs.ScreenInfo%2cShapeEngine.Core.Structs.ScreenInfo%2cShapeEngine.Core.Structs.ScreenInfo)" data-throw-if-not-resolved="false"></xref> with variable timing.</li><li><xref href="ShapeEngine.Core.GameDef.Game.FixedUpdate(ShapeEngine.Core.Structs.GameTime%2cShapeEngine.Core.Structs.ScreenInfo%2cShapeEngine.Core.Structs.ScreenInfo%2cShapeEngine.Core.Structs.ScreenInfo)" data-throw-if-not-resolved="false"></xref> with fixed timing.</li><li><xref href="ShapeEngine.Core.GameDef.Game.InterpolateFixedUpdate(ShapeEngine.Core.Structs.GameTime%2cShapeEngine.Core.Structs.ScreenInfo%2cShapeEngine.Core.Structs.ScreenInfo%2cShapeEngine.Core.Structs.ScreenInfo%2cSystem.Single)" data-throw-if-not-resolved="false"></xref> with variable timing.</li><li><xref href="ShapeEngine.Core.GameDef.Game.DrawGame(ShapeEngine.Core.Structs.ScreenInfo)" data-throw-if-not-resolved="false"></xref></li><li><xref href="ShapeEngine.Core.GameDef.Game.DrawGameUI(ShapeEngine.Core.Structs.ScreenInfo)" data-throw-if-not-resolved="false"></xref></li><li><xref href="ShapeEngine.Core.GameDef.Game.DrawUI(ShapeEngine.Core.Structs.ScreenInfo)" data-throw-if-not-resolved="false"></xref></li></ul>

    Unlocked Update call order:

    <ul><li><xref href="ShapeEngine.Core.GameDef.Game.Update(ShapeEngine.Core.Structs.GameTime%2cShapeEngine.Core.Structs.ScreenInfo%2cShapeEngine.Core.Structs.ScreenInfo%2cShapeEngine.Core.Structs.ScreenInfo)" data-throw-if-not-resolved="false"></xref> with variable timing.</li><li><xref href="ShapeEngine.Core.GameDef.Game.DrawGame(ShapeEngine.Core.Structs.ScreenInfo)" data-throw-if-not-resolved="false"></xref></li><li><xref href="ShapeEngine.Core.GameDef.Game.DrawGameUI(ShapeEngine.Core.Structs.ScreenInfo)" data-throw-if-not-resolved="false"></xref></li><li><xref href="ShapeEngine.Core.GameDef.Game.DrawUI(ShapeEngine.Core.Structs.ScreenInfo)" data-throw-if-not-resolved="false"></xref></li></ul>
  example: []
  syntax:
