  assemblies:
  - ShapeEngine
  namespace: ShapeEngine.Core.GameDef
  summary: >-
    The core game class.

    Inherit this class, create a new instance of this class and call <xref href="ShapeEngine.Core.GameDef.Game.Run(System.String%5b%5d)" data-throw-if-not-resolved="false"></xref> to start the game.

    Only one instance of the game should be created per application.

    A singleton <xref href="ShapeEngine.Core.GameDef.Game.Instance" data-throw-if-not-resolved="false"></xref> property will be set to the newly created game instance and will only allow one instance of the game to be created per application.
  remarks: >-
    Main Game loop call order:

    <ul><li><xref href="ShapeEngine.Core.GameDef.Game.LoadContent" data-throw-if-not-resolved="false"></xref> - Called once.</li><li><xref href="ShapeEngine.Core.GameDef.Game.BeginRun" data-throw-if-not-resolved="false"></xref> - Called once.</li><li><xref href="ShapeEngine.Core.GameDef.Game.Update(ShapeEngine.Core.Structs.GameTime%2cShapeEngine.Core.Structs.ScreenInfo%2cShapeEngine.Core.Structs.ScreenInfo%2cShapeEngine.Core.Structs.ScreenInfo)" data-throw-if-not-resolved="false"></xref> - Called every frame with variable timing.</li><li><xref href="ShapeEngine.Core.GameDef.Game.DrawGame(ShapeEngine.Core.Structs.ScreenInfo)" data-throw-if-not-resolved="false"></xref>- Called every frame.</li><li><xref href="ShapeEngine.Core.GameDef.Game.DrawGameUI(ShapeEngine.Core.Structs.ScreenInfo)" data-throw-if-not-resolved="false"></xref> - Called every frame.</li><li><xref href="ShapeEngine.Core.GameDef.Game.DrawUI(ShapeEngine.Core.Structs.ScreenInfo)" data-throw-if-not-resolved="false"></xref> - Called every frame.</li><li><xref href="ShapeEngine.Core.GameDef.Game.EndRun" data-throw-if-not-resolved="false"></xref> - Called once.</li><li><xref href="ShapeEngine.Core.GameDef.Game.UnloadContent" data-throw-if-not-resolved="false"></xref> - Called once.</li></ul>

    Fixed Game loop call order:

    <ul><li><xref href="ShapeEngine.Core.GameDef.Game.LoadContent" data-throw-if-not-resolved="false"></xref> - Called once.</li><li><xref href="ShapeEngine.Core.GameDef.Game.BeginRun" data-throw-if-not-resolved="false"></xref> - Called once.</li><li><xref href="ShapeEngine.Core.GameDef.Game.Update(ShapeEngine.Core.Structs.GameTime%2cShapeEngine.Core.Structs.ScreenInfo%2cShapeEngine.Core.Structs.ScreenInfo%2cShapeEngine.Core.Structs.ScreenInfo)" data-throw-if-not-resolved="false"></xref> - Called every frame with variable timing.</li><li><xref href="ShapeEngine.Core.GameDef.Game.FixedUpdate(ShapeEngine.Core.Structs.GameTime%2cShapeEngine.Core.Structs.ScreenInfo%2cShapeEngine.Core.Structs.ScreenInfo%2cShapeEngine.Core.Structs.ScreenInfo)" data-throw-if-not-resolved="false"></xref> - Called in a fixed interval with fixed timing.</li><li><xref href="ShapeEngine.Core.GameDef.Game.InterpolateFixedUpdate(ShapeEngine.Core.Structs.GameTime%2cShapeEngine.Core.Structs.ScreenInfo%2cShapeEngine.Core.Structs.ScreenInfo%2cShapeEngine.Core.Structs.ScreenInfo%2cSystem.Single)" data-throw-if-not-resolved="false"></xref> - Called every frame with variable timing.</li><li><xref href="ShapeEngine.Core.GameDef.Game.DrawGame(ShapeEngine.Core.Structs.ScreenInfo)" data-throw-if-not-resolved="false"></xref> - Called every frame.</li><li><xref href="ShapeEngine.Core.GameDef.Game.DrawGameUI(ShapeEngine.Core.Structs.ScreenInfo)" data-throw-if-not-resolved="false"></xref> - Called every frame.</li><li><xref href="ShapeEngine.Core.GameDef.Game.DrawUI(ShapeEngine.Core.Structs.ScreenInfo)" data-throw-if-not-resolved="false"></xref> - Called every frame.</li><li><xref href="ShapeEngine.Core.GameDef.Game.EndRun" data-throw-if-not-resolved="false"></xref> - Called once.</li><li><xref href="ShapeEngine.Core.GameDef.Game.UnloadContent" data-throw-if-not-resolved="false"></xref> - Called once.</li></ul>
