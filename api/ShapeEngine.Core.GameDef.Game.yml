  summary: >-
    Saves information about the current savegame slot,

    including the active slot, number of used slots, and maximum slots.
  remarks: >-
    Saves the information to a file named "CurrentSavegameSlot.txt" in the <xref href="ShapeEngine.Core.GameDef.Game.SavegameDirectoryPath" data-throw-if-not-resolved="false"></xref>.

    Requires <xref href="ShapeEngine.Core.GameDef.Game.IsSavegameDirectoryValid" data-throw-if-not-resolved="false"></xref> to be true.

    When constructing the <xref href="ShapeEngine.Core.GameDef.Game" data-throw-if-not-resolved="false"></xref> object,

    ensure that <xref href="ShapeEngine.Core.Structs.GameSettings.SaveDirectory" data-throw-if-not-resolved="false"></xref> and <xref href="ShapeEngine.Core.Structs.GameSettings.ApplicationName" data-throw-if-not-resolved="false"></xref> are set

    in <xref href="ShapeEngine.Core.Structs.GameSettings" data-throw-if-not-resolved="false"></xref> to create a valid savegame backup directory.
  example: []
  syntax:
