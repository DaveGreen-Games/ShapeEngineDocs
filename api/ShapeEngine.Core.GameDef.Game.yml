    path: ../ShapeEngine/ShapeEngine/Core/GameDef/GameSavegameSystem.cs
    startLine: 419
  assemblies:
  - ShapeEngine
  namespace: ShapeEngine.Core.GameDef
  summary: >-
    Applies the previous backup based on the current backup number,

    total created backups, and maximum allowed backups.

    If <code class="paramref">maxBackups</code> is less than or equal to 0, the previous backup will be applied or the backup 0 if the current is 0. I

    f <code class="paramref">maxBackups</code> is greater than 0, than <xref href="ShapeEngine.Core.GameDef.Game.GetPreviousBackup(System.Int32%2cSystem.Int32)" data-throw-if-not-resolved="false"></xref> is used to determine the previous backup to apply.

    Otherwise, calculates the previous backup using <xref href="ShapeEngine.Core.GameDef.Game.GetPreviousBackup(System.Int32%2cSystem.Int32)" data-throw-if-not-resolved="false"></xref> and applies it.
  remarks: >-
    If successful, this function will overwrite the current savegame directory with the contents of the selected backup.

    Requires <xref href="ShapeEngine.Core.GameDef.Game.IsSavegameBackupDirectoryValid" data-throw-if-not-resolved="false"></xref> to be true.

    When constructing the <xref href="ShapeEngine.Core.GameDef.Game" data-throw-if-not-resolved="false"></xref> object,

    ensure that <xref href="ShapeEngine.Core.Structs.GameSettings.SaveDirectory" data-throw-if-not-resolved="false"></xref> and <xref href="ShapeEngine.Core.Structs.GameSettings.ApplicationName" data-throw-if-not-resolved="false"></xref> are set

    in <xref href="ShapeEngine.Core.Structs.GameSettings" data-throw-if-not-resolved="false"></xref> to create a valid savegame backup directory.
  example: []
  syntax:
    content: public bool ApplyBackup(int currentBackupNumber, int createdBackups, int maxBackups)
    parameters:
    - id: currentBackupNumber
      type: System.Int32
      description: The current backup number.
    - id: createdBackups
      type: System.Int32
      description: The total number of backups created.
    - id: maxBackups
      type: System.Int32
      description: >-
        The maximum number of backups allowed.
            If less than or equal to 0, unlimited backups are allowed.
    return:
      type: System.Boolean
      description: True if the backup was applied successfully; otherwise, false.
    content.vb: Public Function ApplyBackup(currentBackupNumber As Integer, createdBackups As Integer, maxBackups As Integer) As Boolean
  overload: ShapeEngine.Core.GameDef.Game.ApplyBackup*
