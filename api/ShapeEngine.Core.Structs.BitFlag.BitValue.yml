  summary: >-
    Returns the uint value representing 2 raised to the specified power.

    Ensures the power is non-negative.
  example: []
  syntax:
    content: public static uint GetPowerOfTwoValue(int power)
    parameters:
    - id: power
      type: System.Int32
      description: The exponent for the power of two (negative values are converted to positive).
    return:
      type: System.UInt32
      description: The ulong value of 2^power.
