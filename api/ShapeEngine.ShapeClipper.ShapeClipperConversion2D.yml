  summary: Provides Clipper/world-space conversion helpers for 2D paths, polygons, rectangles, points, and related enums.
  remarks: >-
    These helpers centralize conversion between ShapeEngine geometry types and Clipper2 types using the

    precision configured on <xref href="ShapeEngine.ShapeClipper.ShapeClipper2D" data-throw-if-not-resolved="false"></xref>.

