  syntax:
    content: public ModifierKeyKeyboardButton(ShapeKeyboardButton modifierKey, bool reverseModifier = false)
    parameters:
    - id: modifierKey
      type: ShapeEngine.Input.ShapeKeyboardButton
      description: The keyboard button to use as a modifier.
    - id: reverseModifier
      type: System.Boolean
      description: If set to <code>true</code>, the modifier is considered active when the button is not pressed.
    content.vb: Public Sub New(modifierKey As ShapeKeyboardButton, reverseModifier As Boolean = False)
