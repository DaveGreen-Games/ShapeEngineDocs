  summary: Initializes a new instance of the <xref href="ShapeEngine.Input.ModifierKeyKeyboardButton" data-throw-if-not-resolved="false"></xref> class.
  remarks: >-
    The <code class="paramref">reverseModifier</code> parameter is used to prevent an input from being triggered when a modifier combination is pressed.

    For example, if you have two inputs: Shift + Space and Space, configuring input Space with Shift as a reverse modifier ensures that pressing Shift + Space will not also trigger Space.
