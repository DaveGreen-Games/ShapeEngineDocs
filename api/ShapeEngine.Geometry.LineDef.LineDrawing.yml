  namespace: ShapeEngine.Geometry.LineDef
  summary: Draws a line at a given point, in a specified direction, with a given length, thickness, and color.
  remarks: >-
    If <code class="paramref">length</code> is less than or equal to 0,

    <code class="paramref">thickness</code> is less than or equal to 0,

    or <code class="paramref">direction</code> is a zero vector, the line is not drawn.
  example: []
  syntax:
    content: public static void DrawLine(Vector2 point, Vector2 direction, float length, float thickness, ColorRgba color)
    parameters:
    - id: point
      type: System.Numerics.Vector2
      description: The center point of the line.
    - id: direction
      type: System.Numerics.Vector2
      description: The normalized direction vector of the line.
    - id: length
      type: System.Single
      description: The length of the line.
    - id: thickness
      type: System.Single
      description: The thickness of the line.
    - id: color
      type: ShapeEngine.Color.ColorRgba
      description: The color of the line.
