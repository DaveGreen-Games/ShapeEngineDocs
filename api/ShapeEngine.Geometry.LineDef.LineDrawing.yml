  assemblies:
  - ShapeEngine
  namespace: ShapeEngine.Geometry.LineDef
  summary: >-
    Draws a masked portion of the line centered on <code class="paramref">line</code> with the specified <code class="paramref">length</code>,

    using a mask of generic type <code class="typeparamref">T</code> which implements <xref href="ShapeEngine.Geometry.IClosedShapeTypeProvider" data-throw-if-not-resolved="false"></xref>.
  remarks: >-
    If <code class="paramref">line</code> is not valid, <code class="paramref">length</code> is less than or equal to 0,

    or <code class="paramref">lineInfo</code> has non-positive thickness, nothing will be drawn.
  example: []
  syntax:
    content: 'public static void DrawMasked<T>(this Line line, float length, T mask, LineDrawingInfo lineInfo, bool reversedMask = false) where T : IClosedShapeTypeProvider'
    parameters:
    - id: line
      type: ShapeEngine.Geometry.LineDef.Line
      description: The source <xref href="ShapeEngine.Geometry.LineDef.Line" data-throw-if-not-resolved="false"></xref>. Must be valid to draw.
    - id: length
      type: System.Single
      description: Total length of the segment to draw (must be greater than 0).
    - id: mask
      type: '{T}'
      description: Mask used to clip the drawn segment.
    - id: lineInfo
      type: ShapeEngine.Geometry.LineDrawingInfo
      description: Line drawing configuration (thickness, color, etc.).
    - id: reversedMask
      type: System.Boolean
      description: If true, draws the parts inside the mask instead of outside.
    typeParameters:
    - id: T
      description: The mask type that provides a closed shape for clipping (must implement <xref href="ShapeEngine.Geometry.IClosedShapeTypeProvider" data-throw-if-not-resolved="false"></xref>).
