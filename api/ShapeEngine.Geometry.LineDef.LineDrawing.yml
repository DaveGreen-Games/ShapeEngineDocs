  assemblies:
  - ShapeEngine
  namespace: ShapeEngine.Geometry.LineDef
  summary: Draws a line using a <code>Line</code> object, with the specified length, thickness, and color.
  remarks: >-
    If <code class="paramref">line</code> is not valid,

    or <code class="paramref">length</code> is less than or equal to 0,

    or <code class="paramref">thickness</code> is less than or equal to 0, the line is not drawn.
  example: []
  syntax:
    content: public static void Draw(this Line line, float length, float thickness, ColorRgba color)
    parameters:
    - id: line
      type: ShapeEngine.Geometry.LineDef.Line
      description: The <code>Line</code> object to draw.
    - id: length
      type: System.Single
      description: The length of the line.
    - id: thickness
      type: System.Single
      description: The thickness of the line.
    - id: color
      type: ShapeEngine.Color.ColorRgba
      description: The color of the line.
    content.vb: Public Shared Sub Draw(line As Line, length As Single, thickness As Single, color As ColorRgba)
