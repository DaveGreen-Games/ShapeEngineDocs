  assemblies:
  - ShapeEngine
  namespace: ShapeEngine.Core.GameDef
  summary: >-
    Represents an event that triggers at a specified interval, allowing actions to be executed

    at regular time steps or every frame.
  remarks: >-
    ScheduledGameEvents are sorted first by their <code>Order</code> property, then by a unique internal id. 

    If two ScheduledGameEvents have the same order, the one created earlier (with a lower id) is processed first.
  example: []
  syntax:
    content: 'public abstract class Game.CustomEvent : IComparable<Game.CustomEvent>'
    content.vb: Public MustInherit Class Game.CustomEvent Implements IComparable(Of Game.CustomEvent)
