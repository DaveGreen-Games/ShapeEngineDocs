      description: ''
    - id: mass1
      type: System.Single
      description: ''
    - id: position2
      type: System.Numerics.Vector2
      description: ''
    - id: velocity2
      type: System.Numerics.Vector2
      description: ''
    - id: mass2
      type: System.Single
      description: ''
    - id: r
      type: System.Single
      description: The elasticity of the collision. 0 means all energy is lost after collision, 1 means full energy is retained after collision.
