  namespace: ShapeEngine.StaticLib
  summary: >-
    Calculates the drag-induced velocity delta to apply to an object over the given time step.

    This is a gameplay damping helper, not a Newtonian force calculation.
  remarks: >-
    Returns a zero vector if the drag coefficient is less than or equal to 0,
        and returns <code>-velocity</code> if the drag coefficient is greater than or equal to 1.
  example: []
  syntax:
    content: public static Vector2 CalculateDragForce(Vector2 velocity, float dragCoefficient, float deltaTime)
    parameters:
    - id: velocity
      type: System.Numerics.Vector2
      description: The current velocity of the object.
    - id: dragCoefficient
      type: System.Single
      description: The drag coefficient (between 0 and 1). 0 means no drag, 1 means full stop in one frame.
    - id: deltaTime
      type: System.Single
      description: The time step over which to apply the drag.
    return:
      type: System.Numerics.Vector2
      description: The velocity delta produced by drag over the time step.
