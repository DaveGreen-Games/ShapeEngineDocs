    id: ShapePhysics
    path: ../ShapeEngine/ShapeEngine/StaticLib/ShapePhysics.cs
    startLine: 34
  assemblies:
  - ShapeEngine
  namespace: ShapeEngine.StaticLib
  summary: Provides gameplay-oriented and physics-inspired 2D motion helpers.
  remarks: >-
    <p>

    This type contains two categories of helpers:

    </p>

    <ul><li><b>Gameplay / arcade helpers</b> such as frame-rate-independent drag scaling and simplified motion utilities that are convenient in a game engine but are not strict real-world physics.</li><li><b>Physics-inspired helpers</b> whose formulas are closer to classical mechanics, such as inverse-square attraction or quadratic drag. These still operate in engine units, not necessarily SI units.</li></ul>

    <p>

    In this engine, a returned vector is usually meant to be passed to <xref href="ShapeEngine.Core.PhysicsObject.AddForce(System.Numerics.Vector2)" data-throw-if-not-resolved="false"></xref>, unless the method remarks explicitly say otherwise.

    <xref href="ShapeEngine.Core.PhysicsObject.AddForce(System.Numerics.Vector2)" data-throw-if-not-resolved="false"></xref> converts a force-like vector into acceleration by dividing by mass. A mass less than or equal to zero is treated as <code>1</code> by the helpers in this class.

    </p>

    <p>

    Be aware that some older APIs use the word <code>Force</code> for gameplay damping values that are actually applied as a change in velocity rather than a Newtonian force.

    In particular, <xref href="ShapeEngine.StaticLib.ShapePhysics.CalculateDragForce(System.Numerics.Vector2%2cSystem.Single%2cSystem.Single)" data-throw-if-not-resolved="false"></xref> and its directional overload return the velocity delta produced by drag over a time step, while <xref href="ShapeEngine.StaticLib.ShapePhysics.CalculateDragForceRealistic(System.Numerics.Vector2%2cSystem.Single%2cSystem.Single%2cSystem.Single)" data-throw-if-not-resolved="false"></xref> returns a force-like vector based on the drag equation.

    </p>

    <p>

    Methods named <code>Calculate*</code> return values and do not mutate inputs, except where a compatibility overload is explicitly documented otherwise.

    Methods named <code>Apply*</code> mutate one or more <xref href="ShapeEngine.Core.PhysicsObject" data-throw-if-not-resolved="false"></xref> instances by adding forces or changing velocity.

    </p>
