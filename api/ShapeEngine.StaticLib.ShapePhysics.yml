  assemblies:
  - ShapeEngine
  namespace: ShapeEngine.StaticLib
  summary: >-
    Calculates a directionally scaled reverse-attraction force using a distance range.

    At a distance equal to <code class="paramref">attractionRadius</code> with a velocity directly aligned away from the origin,

    the force equals <code class="paramref">attractionForce</code>.

    If the velocity points toward the origin or the distance is zero, the force is zero.
  example: []
  syntax:
    content: public static Vector2 CalculateReverseAttractionForceDirectional(Vector2 attractionOrigin, float attractionForce, ValueRange attractionRadius, Vector2 objectPosition, Vector2 objectVelocity)
    parameters:
    - id: attractionOrigin
      type: System.Numerics.Vector2
      description: The origin of the attraction force.
    - id: attractionForce
      type: System.Single
      description: The force to apply, scaled by direction and distance factors.
    - id: attractionRadius
      type: ShapeEngine.Core.Structs.ValueRange
      description: >-
        The distance range at which minimum and maximum force is calculated.
            Distances below the attractionRadius.Min result in 0 force.
    - id: objectPosition
      type: System.Numerics.Vector2
      description: The position of the object.
    - id: objectVelocity
      type: System.Numerics.Vector2
      description: The velocity of the object.
    return:
      type: System.Numerics.Vector2
      description: Returns the final force.
