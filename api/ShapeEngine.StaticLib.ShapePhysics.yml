  namespace: ShapeEngine.StaticLib
  summary: >-
    Calculates a directional drag-induced velocity delta based on the supplied velocity and drag normal.

    This is a gameplay damping helper, not a Newtonian force calculation.
  remarks: If <code class="paramref">dragNormal</code> is too small to normalize, this falls back to the non-directional overload.
  example: []
  syntax:
    content: public static Vector2 CalculateDragForce(Vector2 velocity, float dragCoefficient, Vector2 dragNormal, float deltaTime)
    parameters:
    - id: velocity
      type: System.Numerics.Vector2
      description: The velocity of the object.
    - id: dragCoefficient
      type: System.Single
      description: A value between 0-1.
    - id: dragNormal
      type: System.Numerics.Vector2
      description: >-
        Drag is applied against the drag normal.
            A velocity pointing in the same direction as the dragNormal does not receive any drag.
            A velocity pointing in the opposite direction as the dragNormal does receive max drag force.
    - id: deltaTime
      type: System.Single
      description: ''
    return:
      type: System.Numerics.Vector2
      description: ''
