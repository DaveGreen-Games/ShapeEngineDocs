  assemblies:
  - ShapeEngine
  namespace: ShapeEngine.Core.Structs
  summary: Gets the current frames per second (FPS) based on the elapsed time between frames.
  remarks: >-
    This property calculates FPS by taking the inverse of the elapsed seconds.

    If elapsed time is zero or negative, it returns 0 to avoid division by zero.
  example: []
  syntax:
    content: public int Fps { get; }
    parameters: []
    return:
      type: System.Int32
      description: >-
        The current frames per second as an integer value.

        Returns 0 if no time has elapsed between frames.
    content.vb: Public ReadOnly Property Fps As Integer
  overload: ShapeEngine.Core.Structs.GameTime.Fps*
