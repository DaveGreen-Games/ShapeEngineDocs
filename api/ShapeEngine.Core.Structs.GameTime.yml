  assemblies:
  - ShapeEngine
  namespace: ShapeEngine.Core.Structs
  summary: Indicates whether this GameTime instance represents a fixed timestep delta.
  remarks: >-
    When true, the <xref href="ShapeEngine.Core.Structs.GameTime.ElapsedSeconds" data-throw-if-not-resolved="false"></xref> value corresponds to a fixed simulation step

    (useful for deterministic physics or game logic). When false, the delta is the variable

    elapsed time between frames.
