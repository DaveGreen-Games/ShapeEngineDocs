  namespace: ShapeEngine.Geometry.CollisionSystem
  summary: >-
    Adds a new entry for the specified <code class="paramref">collider</code> to the register or resets an existing entry.

    If the collider was already added this frame, returns null. Otherwise, returns a cleared or new <xref href="System.Collections.Generic.HashSet%601" data-throw-if-not-resolved="false"></xref> with the specified <code class="paramref">capacity</code>.
  example: []
  syntax:
    content: public HashSet<T>? AddEntry(Collider collider, int capacity)
    parameters:
    - id: collider
      type: ShapeEngine.Geometry.CollisionSystem.Collider
      description: The collider to add or reset in the register.
    - id: capacity
      type: System.Int32
      description: The initial capacity for the associated <xref href="System.Collections.Generic.HashSet%601" data-throw-if-not-resolved="false"></xref>.
    return:
      type: System.Collections.Generic.HashSet{{T}}
      description: The <xref href="System.Collections.Generic.HashSet%601" data-throw-if-not-resolved="false"></xref> associated with the collider, or null if the collider was already added this frame.
    content.vb: Public Function AddEntry(collider As Collider, capacity As Integer) As HashSet(Of T)
