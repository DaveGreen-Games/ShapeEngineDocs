  namespace: ShapeEngine.Text
  summary: Called when the mouse enters a word or text region, allowing for custom emphasis.
  example: []
  syntax:
    content: Emphasis? OnMouseEntered(string curWord, string completeWord, Rect rect)
    parameters:
    - id: curWord
      type: System.String
      description: The current word under the mouse.
    - id: completeWord
      type: System.String
      description: The complete word or region under the mouse.
    - id: rect
      type: ShapeEngine.Geometry.RectDef.Rect
      description: The rectangle area of the word or region.
    return:
      type: ShapeEngine.Text.Emphasis
      description: An <xref href="ShapeEngine.Text.Emphasis" data-throw-if-not-resolved="false"></xref> to apply, or null for no emphasis.
    content.vb: Function OnMouseEntered(curWord As String, completeWord As String, rect As Rect) As Emphasis
