    Generates striped segments for an outer shape while optionally excluding areas covered by an inner shape.

    The method dispatches to specific overloads for supported shape types (Circle, Triangle, Rectangle, Quad, Polygon).
  example: []
  syntax:
    content: public static Segments GenerateStripedSegments<TO, TI>(TO outsideShape, TI insideShape, float spacing, float angleDeg, float spacingOffset = 0)
    parameters:
    - id: outsideShape
      type: '{TO}'
      description: The outer shape to fill with stripe lines.
    - id: insideShape
      type: '{TI}'
      description: The inner shape to exclude from stripes (may be null or of a supported type).
    - id: spacing
      type: System.Single
      description: Distance between adjacent stripe lines in the same units as shape coordinates.
    - id: angleDeg
      type: System.Single
      description: Stripe angle in degrees, measured from the x-axis.
    - id: spacingOffset
      type: System.Single
      description: Optional offset to shift the stripe pattern along its perpendicular direction.
    typeParameters:
    - id: TO
      description: >-
        Type of the outside shape.
            Only allowed shapes are: <xref href="ShapeEngine.Geometry.CircleDef.Circle" data-throw-if-not-resolved="false"></xref>, <xref href="ShapeEngine.Geometry.TriangleDef.Triangle" data-throw-if-not-resolved="false"></xref>, <xref href="ShapeEngine.Geometry.RectDef.Rect" data-throw-if-not-resolved="false"></xref>, <xref href="ShapeEngine.Geometry.QuadDef.Quad" data-throw-if-not-resolved="false"></xref>, <xref href="ShapeEngine.Geometry.PolygonDef.Polygon" data-throw-if-not-resolved="false"></xref>).
    - id: TI
      description: >-
        Type of the inside (excluded) shape.
            Only allowed shapes are: <xref href="ShapeEngine.Geometry.CircleDef.Circle" data-throw-if-not-resolved="false"></xref>, <xref href="ShapeEngine.Geometry.TriangleDef.Triangle" data-throw-if-not-resolved="false"></xref>, <xref href="ShapeEngine.Geometry.RectDef.Rect" data-throw-if-not-resolved="false"></xref>, <xref href="ShapeEngine.Geometry.QuadDef.Quad" data-throw-if-not-resolved="false"></xref>, <xref href="ShapeEngine.Geometry.PolygonDef.Polygon" data-throw-if-not-resolved="false"></xref>).
    return:
      type: ShapeEngine.Geometry.SegmentsDef.Segments
      description: A <xref href="ShapeEngine.Geometry.SegmentsDef.Segments" data-throw-if-not-resolved="false"></xref> collection containing the generated stripe segments; may be empty if no stripes are produced.
