  assemblies:
  - ShapeEngine
  namespace: ShapeEngine.Geometry.StripedDrawingDef
  summary: >-
    Generates striped segments clipped to the given outside triangle while excluding the area of an inside shape.

    The method casts parallel lines/rays across the outside triangle and subtracts intersections with the

    provided inside shape to produce the final visible stripe segments.
  example: []
  syntax:
    content: public static Segments GenerateStripedSegments<T>(this Triangle outsideShape, T insideShape, float spacing, float angleDeg, float spacingOffset = 0)
    parameters:
    - id: outsideShape
      type: ShapeEngine.Geometry.TriangleDef.Triangle
      description: Triangle that defines the outer boundary for the stripes.
    - id: insideShape
      type: '{T}'
      description: Shape to be excluded from the stripes.
    - id: spacing
      type: System.Single
      description: Distance between adjacent stripes. Values &lt;= 0 will produce an empty result.
    - id: angleDeg
      type: System.Single
      description: Orientation of the stripes in degrees (0 = vertical, 90 = horizontal).
    - id: spacingOffset
      type: System.Single
      description: Normalized offset in the range [0,1] used to shift the pattern (useful for animation).
    typeParameters:
    - id: T
      description: >-
        Type of the inside shape.
            Allowed types are handled inside the method.
            Supported inside shape types: <xref href="ShapeEngine.Geometry.TriangleDef.Triangle" data-throw-if-not-resolved="false"></xref>, <xref href="ShapeEngine.Geometry.CircleDef.Circle" data-throw-if-not-resolved="false"></xref>,
            <xref href="ShapeEngine.Geometry.RectDef.Rect" data-throw-if-not-resolved="false"></xref>, <xref href="ShapeEngine.Geometry.QuadDef.Quad" data-throw-if-not-resolved="false"></xref>, <xref href="ShapeEngine.Geometry.PolygonDef.Polygon" data-throw-if-not-resolved="false"></xref>.
    return:
      type: ShapeEngine.Geometry.SegmentsDef.Segments
      description: >-
        A <xref href="ShapeEngine.Geometry.SegmentsDef.Segments" data-throw-if-not-resolved="false"></xref> instance containing segments that lie inside <code class="paramref">outsideShape</code>

        but outside <code class="paramref">insideShape</code>.
    content.vb: Public Shared Function GenerateStripedSegments(Of T)(outsideShape As Triangle, insideShape As T, spacing As Single, angleDeg As Single, spacingOffset As Single = 0) As Segments
  overload: ShapeEngine.Geometry.StripedDrawingDef.StripedDrawing.GenerateStripedSegments*
