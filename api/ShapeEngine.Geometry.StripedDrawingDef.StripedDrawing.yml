  assemblies:
  - ShapeEngine
  namespace: ShapeEngine.Geometry.StripedDrawingDef
  summary: >-
    Generates a collection of line segments representing a striped pattern clipped to the specified polygon,

    where the distance between consecutive stripes is determined by a <xref href="ShapeEngine.Core.CurveFloat" data-throw-if-not-resolved="false"></xref>.
  example: []
  syntax:
    content: public static Segments GenerateStripedSegments(this Polygon polygon, CurveFloat spacingCurve, float angleDeg)
    parameters:
    - id: polygon
      type: ShapeEngine.Geometry.PolygonDef.Polygon
      description: The polygon to populate with striped segments.
    - id: spacingCurve
      type: ShapeEngine.Core.CurveFloat
      description: A curve that defines the spacing along the pattern. The curve must have keys and sampled values must be &gt; 0; otherwise the method returns an empty result.
    - id: angleDeg
      type: System.Single
      description: Orientation of the stripes in degrees (0 = vertical, 90 = horizontal).
    return:
