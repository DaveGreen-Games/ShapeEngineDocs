  namespace: ShapeEngine.Geometry.StripedDrawingDef
  summary: >-
    Draws the given <xref href="ShapeEngine.Geometry.SegmentsDef.Segments" data-throw-if-not-resolved="false"></xref> using two alternating <xref href="ShapeEngine.Geometry.LineDrawingInfo" data-throw-if-not-resolved="false"></xref> instances.

    The first segment uses <code class="paramref">striped</code>, the second uses <code class="paramref">alternatingStriped</code>,

    and the pattern repeats for the remaining segments.
