  assemblies:
  - ShapeEngine
  namespace: ShapeEngine.Geometry.StripedDrawingDef
  summary: >-
    Generates a collection of radial segments that form a striped ring.

    Each segment starts at the ring's inner radius and ends at the outer radius,

    positioned at evenly spaced angles around the specified center.
  example: []
  syntax:
    content: public static Segments GenerateStripedRing(Vector2 center, float innerRadius, float outerRadius, float angleSpacingDeg, float angleOffset = 0)
    parameters:
    - id: center
      type: System.Numerics.Vector2
      description: Center point of the ring.
    - id: innerRadius
      type: System.Single
      description: Inner radius of the ring. Negative values are clamped to zero; if greater than <code class="paramref">outerRadius</code> values are swapped.
    - id: outerRadius
      type: System.Single
      description: Outer radius of the ring. Negative values are clamped to zero.
    - id: angleSpacingDeg
      type: System.Single
      description: Angular spacing in degrees between consecutive lines. Must be greater than zero.
    - id: angleOffset
      type: System.Single
      description: Normalized offset in the range [0,1) applied to the starting angle as a fraction of <code class="paramref">angleSpacingDeg</code> (default 0).
    return:
      type: ShapeEngine.Geometry.SegmentsDef.Segments
      description: A <xref href="ShapeEngine.Geometry.SegmentsDef.Segments" data-throw-if-not-resolved="false"></xref> collection containing the generated radial segments.
    content.vb: Public Shared Function GenerateStripedRing(center As Vector2, innerRadius As Single, outerRadius As Single, angleSpacingDeg As Single, angleOffset As Single = 0) As Segments
