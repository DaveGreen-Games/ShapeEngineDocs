    - id: segments
      type: ShapeEngine.Geometry.SegmentsDef.Segments
      description: The collection of segments to render.
    - id: striped
      type: ShapeEngine.Geometry.LineDrawingInfo
      description: Line drawing parameters applied to even-indexed segments (0-based).
    - id: alternatingStriped
      type: ShapeEngine.Geometry.LineDrawingInfo
      description: Line drawing parameters applied to odd-indexed segments.
    content.vb: Public Shared Sub DrawGeneratedSegments(segments As Segments, striped As LineDrawingInfo, alternatingStriped As LineDrawingInfo)
