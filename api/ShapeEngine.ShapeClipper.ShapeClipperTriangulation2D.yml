  summary: Triangulates the stroked outline of a Clipper polygon-with-holes input into a <xref href="ShapeEngine.ShapeClipper.TriMesh" data-throw-if-not-resolved="false"></xref>.
  remarks: >-
    The outline is produced by offsetting the input paths outward and inward, subtracting the inner result from the outer result,

    and triangulating the resulting ring paths.
  example: []
  syntax:
    content: public static void CreatePolygonOutlineTriangulation(Paths64 polygonWithHoles, float thickness, float miterLimit, bool beveled, bool useDelaunay, TriMesh result)
