  assemblies:
  - ShapeEngine
  namespace: ShapeEngine.ShapeClipper
  summary: Provides Clipper-backed triangulation helpers for polygons, polygon outlines, and polyline strokes in 2D.
  remarks: >-
    These helpers build <xref href="ShapeEngine.ShapeClipper.TriMesh" data-throw-if-not-resolved="false"></xref> or <xref href="ShapeEngine.Geometry.TriangulationDef.Triangulation" data-throw-if-not-resolved="false"></xref> results from world-space polygon data,

    reusing shared intermediate buffers together with services exposed by <xref href="ShapeEngine.ShapeClipper.ShapeClipper2D" data-throw-if-not-resolved="false"></xref>.

    The class is intended for sequential use and is not thread-safe.
