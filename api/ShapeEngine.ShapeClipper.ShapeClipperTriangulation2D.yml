    id: CreatePolygonOutlineTriangulationMasked
    path: ../ShapeEngine/ShapeEngine/ShapeClipper/ShapeClipperTriangulation2D.cs
    startLine: 560
  assemblies:
  - ShapeEngine
  namespace: ShapeEngine.ShapeClipper
  summary: Triangulates the outline of Clipper paths after subtracting mask paths from them, writing the result into a <xref href="ShapeEngine.ShapeClipper.TriMesh" data-throw-if-not-resolved="false"></xref>.
  remarks: >-
    The method first subtracts <code class="paramref">masks</code> from <code class="paramref">polygonWithHoles</code>, optionally removes holes from the clipped result,

    and then generates and triangulates an outline from the remaining closed paths.
  example: []
  syntax:
    content: public static void CreatePolygonOutlineTriangulationMasked(Paths64 polygonWithHoles, Paths64 masks, float thickness, float miterLimit, bool beveled, bool useDelaunay, bool keepHoles, TriMesh result)
    parameters:
    - id: polygonWithHoles
      type: Clipper2Lib.Paths64
      description: The closed source paths whose outline should be triangulated.
    - id: masks
      type: Clipper2Lib.Paths64
      description: The closed mask paths to subtract from <code class="paramref">polygonWithHoles</code>.
    - id: thickness
      type: System.Single
      description: The outline thickness in world units.
    - id: miterLimit
      type: System.Single
      description: The maximum miter length factor used for sharp joins.
    - id: beveled
      type: System.Boolean
      description: Whether joins that exceed the miter limit should use beveled corners.
    - id: useDelaunay
      type: System.Boolean
      description: Whether Delaunay refinement should be applied during triangulation.
    - id: keepHoles
      type: System.Boolean
      description: Whether holes produced by the mask difference should be preserved before outline generation.
    - id: result
      type: ShapeEngine.ShapeClipper.TriMesh
      description: The destination mesh that receives the generated geometry.
    content.vb: Public Shared Sub CreatePolygonOutlineTriangulationMasked(polygonWithHoles As Paths64, masks As Paths64, thickness As Single, miterLimit As Single, beveled As Boolean, useDelaunay As Boolean, keepHoles As Boolean, result As TriMesh)
