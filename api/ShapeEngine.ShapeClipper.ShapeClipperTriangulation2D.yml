  assemblies:
  - ShapeEngine
  namespace: ShapeEngine.ShapeClipper
  summary: Triangulates the outline of a polygon after subtracting a mask polygon from it, writing the result into a <xref href="ShapeEngine.ShapeClipper.TriMesh" data-throw-if-not-resolved="false"></xref>.
  remarks: >-
    The method first subtracts <code class="paramref">polygonMask</code> from <code class="paramref">polygonCCW</code>, optionally removes any holes from the clipped result,

    and then generates and triangulates an outline from the remaining closed paths.
  example: []
  syntax:
    content: public static void CreatePolygonOutlineTriangulationMasked(IReadOnlyList<Vector2> polygonCCW, IReadOnlyList<Vector2> polygonMask, float thickness, float miterLimit, bool beveled, bool useDelaunay, bool keepHoles, TriMesh result)
    parameters:
    - id: polygonCCW
      type: System.Collections.Generic.IReadOnlyList{System.Numerics.Vector2}
      description: The source polygon vertices, expected in counterclockwise order.
    - id: polygonMask
      type: System.Collections.Generic.IReadOnlyList{System.Numerics.Vector2}
      description: The polygon vertices to subtract from the source polygon.
    - id: thickness
      type: System.Single
      description: The outline thickness in world units.
    - id: miterLimit
      type: System.Single
      description: The maximum miter length factor used for sharp joins.
    - id: beveled
      type: System.Boolean
      description: Whether joins that exceed the miter limit should use beveled corners.
    - id: useDelaunay
      type: System.Boolean
      description: Whether Delaunay refinement should be applied during triangulation.
    - id: keepHoles
      type: System.Boolean
      description: Whether holes produced by the mask difference should be preserved before outline generation.
    - id: result
      type: ShapeEngine.ShapeClipper.TriMesh
      description: The destination mesh that receives the generated geometry.
    content.vb: Public Shared Sub CreatePolygonOutlineTriangulationMasked(polygonCCW As IReadOnlyList(Of Vector2), polygonMask As IReadOnlyList(Of Vector2), thickness As Single, miterLimit As Single, beveled As Boolean, useDelaunay As Boolean, keepHoles As Boolean, result As TriMesh)
