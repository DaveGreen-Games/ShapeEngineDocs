  assemblies:
  - ShapeEngine
  namespace: ShapeEngine.ShapeClipper
  summary: Triangulates the outline of a partial polygon perimeter measured by traveled distance into a <xref href="ShapeEngine.ShapeClipper.TriMesh" data-throw-if-not-resolved="false"></xref>.
  example: []
  syntax:
    content: public static void CreatePolygonOutlineTriangulationPerimeter(IReadOnlyList<Vector2> polygonCCW, float perimeter, int startIndex, float thickness, float miterLimit, bool beveled, ShapeClipperEndType endType, bool useDelaunay, TriMesh result)
    parameters:
    - id: polygonCCW
      type: System.Collections.Generic.IReadOnlyList{System.Numerics.Vector2}
      description: The polygon vertices, expected in counterclockwise order.
    - id: perimeter
      type: System.Single
      description: The perimeter distance to trace.
    - id: startIndex
      type: System.Int32
      description: The starting polygon vertex index.
    - id: thickness
      type: System.Single
      description: The outline thickness in world units.
    - id: miterLimit
      type: System.Single
      description: The maximum miter length factor used for sharp joins.
    - id: beveled
      type: System.Boolean
      description: Whether joins that exceed the miter limit should use beveled corners.
    - id: endType
      type: ShapeEngine.ShapeClipper.ShapeClipperEndType
      description: The cap style used for the generated open outline section.
    - id: useDelaunay
      type: System.Boolean
      description: Whether Delaunay refinement should be applied during triangulation.
    - id: result
      type: ShapeEngine.ShapeClipper.TriMesh
      description: The destination mesh that receives the generated geometry.
