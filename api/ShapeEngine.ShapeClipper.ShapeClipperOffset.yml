  namespace: ShapeEngine.ShapeClipper
  summary: Wraps a <xref href="Clipper2Lib.ClipperOffset" data-throw-if-not-resolved="false"></xref> instance to offset polygons and polylines using the engine's world-space coordinate conventions.
  remarks: >-
    Input geometry is converted to Clipper's integer-based path representation using <xref href="ShapeEngine.ShapeClipper.ShapeClipperOffset.Scale" data-throw-if-not-resolved="false"></xref>, then written to the provided <xref href="Clipper2Lib.Paths64" data-throw-if-not-resolved="false"></xref> collection.

    This type reuses internal buffers to reduce allocations and is intended for repeated offset operations.
