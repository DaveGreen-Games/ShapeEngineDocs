      type: System.Collections.Generic.IReadOnlyList{System.Numerics.Vector2}
      description: The polyline vertices to offset.
    - id: offsetPositive
      type: System.Single
      description: The positive offset distance in world units used to build the stroked outline.
    - id: miterLimit
      type: System.Single
      description: The miter limit to use when selecting join behavior for sharp corners.
    - id: beveled
      type: System.Boolean
      description: Whether non-miter joins should use beveled corners instead of square corners.
    - id: endType
      type: ShapeEngine.ShapeClipper.ShapeClipperEndType
      description: The end-cap style to use for the open polyline.
    - id: result
      type: Clipper2Lib.Paths64
