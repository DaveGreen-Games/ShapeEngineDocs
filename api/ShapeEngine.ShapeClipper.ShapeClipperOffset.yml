    id: OffsetPolygon
    path: ../ShapeEngine/ShapeEngine/ShapeClipper/ShapeClipperOffset.cs
    startLine: 88
  assemblies:
  - ShapeEngine
  namespace: ShapeEngine.ShapeClipper
  summary: Offsets a closed polygon and writes the resulting paths into <code class="paramref">result</code>.
  remarks: >-
    If <code class="paramref">offset</code> is zero, this method returns a single path equivalent to the input polygon.

    If the polygon contains fewer than three points, no output is produced.
  example: []
  syntax:
    content: public void OffsetPolygon(IReadOnlyList<Vector2> polygonCCW, float offset, float miterLimit, bool beveled, Paths64 result)
    parameters:
    - id: polygonCCW
      type: System.Collections.Generic.IReadOnlyList{System.Numerics.Vector2}
      description: The polygon vertices to offset. The polygon is expected to be wound counterclockwise.
    - id: offset
      type: System.Single
      description: The offset distance in world units. Positive values expand the polygon and negative values shrink it.
    - id: miterLimit
      type: System.Single
      description: The miter limit to use when selecting join behavior for sharp corners.
    - id: beveled
      type: System.Boolean
      description: Whether non-miter joins should use beveled corners instead of square corners.
    - id: result
      type: Clipper2Lib.Paths64
      description: The destination collection that will be cleared and populated with the generated offset paths.
    content.vb: Public Sub OffsetPolygon(polygonCCW As IReadOnlyList(Of Vector2), offset As Single, miterLimit As Single, beveled As Boolean, result As Paths64)
