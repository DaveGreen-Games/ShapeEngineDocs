    id: LoadFontsFromDirectory
    path: ../ShapeEngine/ShapeEngine/Content/ContentLoader.cs
    startLine: 1380
  assemblies:
  - ShapeEngine
  namespace: ShapeEngine.Content
  summary: Loads all fonts from a directory and returns a dictionary mapping relative file paths to Font objects.
  remarks: >-
    Only loads files with valid font extensions [".ttf", ".otf"].

    The key is the relative path from the directory to the font file.
  example: []
  syntax:
    content: public static Dictionary<string, Font> LoadFontsFromDirectory(string directoryPath, int fontSize = 100, TextureFilter textureFilter = TextureFilter.Trilinear, bool recursive = false)
    parameters:
    - id: directoryPath
      type: System.String
      description: The directory path containing font files.
    - id: fontSize
      type: System.Int32
      description: The size of the fonts to load. Default is 100.
    - id: textureFilter
      type: Raylib_cs.TextureFilter
      description: The texture filter to apply to the font textures. Default is Trilinear.
    - id: recursive
      type: System.Boolean
      description: Whether to search recursively in subdirectories. Default is false.
    return:
      type: System.Collections.Generic.Dictionary{System.String,Raylib_cs.Font}
      description: A dictionary mapping relative file paths to loaded Font objects.
    content.vb: Public Shared Function LoadFontsFromDirectory(directoryPath As String, fontSize As Integer = 100, textureFilter As TextureFilter = TextureFilter.Trilinear, recursive As Boolean = False) As Dictionary(Of String, Font)
  overload: ShapeEngine.Content.ContentLoader.LoadFontsFromDirectory*
  nameWithType.vb: ContentLoader.LoadFontsFromDirectory(String, Integer, TextureFilter, Boolean)
