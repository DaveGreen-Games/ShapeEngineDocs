    id: LoadFont
    path: ../ShapeEngine/ShapeEngine/Content/ContentLoader.cs
    startLine: 136
  assemblies:
  - ShapeEngine
  namespace: ShapeEngine.Content
  summary: Loads a font from a file with the specified font size and texture filter.
  remarks: >-
    Automatically resolves resource paths for macOS application bundles.

    By default, file paths should be relative to the executable's directory.
  example:
  - >-
    If all resources are in a `Resources` folder at the project root, the following paths would be valid:

    <ul><li>"Resources/Fonts/font.ttf"</li><li>"Resources/Audio/Music/BackgroundMusic.mp3"</li><li>"Resources/Audio/Sounds/Jump.wav"</li><li>"Resources/Images/Background.png"</li></ul>
  syntax:
    content: public static Font LoadFont(string filePath, int fontSize = 100, TextureFilter textureFilter = TextureFilter.Trilinear)
    parameters:
    - id: filePath
      type: System.String
      description: The path to the font file.
    - id: fontSize
      type: System.Int32
      description: The size of the font to load. Default is 100.
    - id: textureFilter
      type: Raylib_cs.TextureFilter
      description: The texture filter to apply to the font texture. Default is Trilinear.
    return:
      type: Raylib_cs.Font
      description: The loaded Font object.
    content.vb: Public Shared Function LoadFont(filePath As String, fontSize As Integer = 100, textureFilter As TextureFilter = TextureFilter.Trilinear) As Font
  overload: ShapeEngine.Content.ContentLoader.LoadFont*
  nameWithType.vb: ContentLoader.LoadFont(String, Integer, TextureFilter)
  fullName.vb: ShapeEngine.Content.ContentLoader.LoadFont(String, Integer, Raylib_cs.TextureFilter)
  name.vb: LoadFont(String, Integer, TextureFilter)
