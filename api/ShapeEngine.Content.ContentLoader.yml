    id: GetMacOsAppBundleResourcePath
    path: ../ShapeEngine/ShapeEngine/Content/ContentLoader.cs
    startLine: 89
  assemblies:
  - ShapeEngine
  namespace: ShapeEngine.Content
  summary: Resolves the full path to a resource file when running inside a macOS application bundle.
  remarks: >-
    In macOS .app bundles, the executable is located in Contents/MacOS/ while resources are in Contents/Resources/.

    This method handles the path conversion for proper resource loading in both development and deployed scenarios.
  example: []
  syntax:
    content: public static string GetMacOsAppBundleResourcePath(string relativePath)
    parameters:
    - id: relativePath
      type: System.String
      description: The relative path to the resource.
    return:
      type: System.String
      description: >-
        If running in a macOS .app bundle, returns the full path within the bundle's Resources directory.

        Otherwise, returns the original relativePath unchanged.
    content.vb: Public Shared Function GetMacOsAppBundleResourcePath(relativePath As String) As String
