  assemblies:
  - ShapeEngine
  namespace: ShapeEngine.Content
  summary: Provides a simple wrapper to load all types of Raylib resources and JSON strings.
  remarks: >-
    Resources and content refer to assets shipped with the game, such as textures, fonts, audio files, shaders, and similar files.

    Text-based data files (e.g. XML, JSON) included with the game can be loaded as strings using this class.

    For loading previously saved game data, use the <xref href="ShapeEngine.StaticLib.ShapeFileManager" data-throw-if-not-resolved="false"></xref> class instead.
  example: []
  syntax:
    content: public static class ContentLoader
