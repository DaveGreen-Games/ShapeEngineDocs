      description: The color of the lines.
    - id: cornerFactors
      type: System.Collections.Generic.List{System.Single}
      description: A list of factors (0-1) for each corner. Cycles if fewer than corners.
    - id: capType
      type: ShapeEngine.Geometry.LineCapType
      description: The type of line cap to use.
    - id: capPoints
      type: System.Int32
      description: The number of points for the cap.
