  summary: Draws lines from each corner of the polygon outward, using relative factors for each corner.
  remarks: >-
    Each factor determines how far along the edge the corner line extends.

    A corner is defined by three points: <code>previous [i-1]</code>, <code>current [i]</code>, and <code>next [i+1]</code>.

    <code>CornerFactors</code> are used to interpolate from previous to current and from current to next point to form a corner.
