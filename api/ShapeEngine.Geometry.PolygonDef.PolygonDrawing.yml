  assemblies:
  - ShapeEngine
  namespace: ShapeEngine.Geometry.PolygonDef
  summary: Draws the polygon filled with the specified color. Uses triangulation for polygons with more than 3 vertices.
  remarks: >-
    For polygons with exactly 3 vertices, an optimized triangle drawing method is used.

    For polygons with more than 3 vertices, the polygon is triangulated and each triangle is drawn.

    For best performance with static polygons, precompute the triangulation and draw the result directly.
  example: []
  syntax:
    content: public static void Draw(this Polygon poly, ColorRgba color)
    parameters:
    - id: poly
      type: ShapeEngine.Geometry.PolygonDef.Polygon
      description: The polygon to draw.
    - id: color
      type: ShapeEngine.Color.ColorRgba
      description: The fill color.
    content.vb: Public Shared Sub Draw(poly As Polygon, color As ColorRgba)
  overload: ShapeEngine.Geometry.PolygonDef.PolygonDrawing.Draw*
