  namespace: ShapeEngine.Geometry.PolygonDef
  summary: Provides extension methods for drawing polygons with various styles and options.
  remarks: >-
    These methods extend the <xref href="ShapeEngine.Geometry.PolygonDef.Polygon" data-throw-if-not-resolved="false"></xref> class to support a wide range of drawing operations,

    including filled, outlined, cornered, and vertex-based renderings.

    Many methods support relative transformations and color gradients.
