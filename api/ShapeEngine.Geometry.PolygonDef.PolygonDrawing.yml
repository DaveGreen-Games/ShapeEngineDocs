    id: DrawGlow
    path: ../ShapeEngine/ShapeEngine/Geometry/PolygonDef/PolygonDrawing.cs
    startLine: 741
  assemblies:
  - ShapeEngine
  namespace: ShapeEngine.Geometry.PolygonDef
  summary: Draws the polygon with a glow effect, interpolating width and color along each segment.
  remarks: >-
    This method creates a glowing outline effect by drawing multiple segments on top of each other, interpolating width and color across all steps.

    <ul><li>The first step uses <code class="paramref">width</code> and <code class="paramref">color</code>.</li><li>The last step uses <code class="paramref">endWidth</code> and <code class="paramref">endColorRgba</code>.</li><li>Intermediate steps interpolate between <code class="paramref">width</code> / <code class="paramref">endWidth</code> and <code class="paramref">color</code> / <code class="paramref">endColorRgba</code>.</li><li>Because steps are drawn on top of each other <code class="paramref">width</code> should be bigger than <code class="paramref">endWidth</code>.</li></ul>
  example: []
  syntax:
    content: public static void DrawGlow(this Polygon polygon, float width, float endWidth, ColorRgba color, ColorRgba endColorRgba, int steps, LineCapType capType = LineCapType.CappedExtended, int capPoints = 2)
    parameters:
    - id: polygon
      type: ShapeEngine.Geometry.PolygonDef.Polygon
      description: The polygon to draw.
    - id: width
      type: System.Single
      description: The starting width of the glow. Should be bigger than <code>endWidth</code>
    - id: endWidth
      type: System.Single
      description: The ending width of the glow. Should be smaller than <code>width</code>
    - id: color
      type: ShapeEngine.Color.ColorRgba
      description: The starting color of the glow.
    - id: endColorRgba
      type: ShapeEngine.Color.ColorRgba
      description: The ending color of the glow.
    - id: steps
      type: System.Int32
      description: The number of interpolation steps for the glow effect.
    - id: capType
      type: ShapeEngine.Geometry.LineCapType
      description: The type of line cap to use at segment ends.
    - id: capPoints
      type: System.Int32
      description: The number of points used for the cap rendering.
    content.vb: Public Shared Sub DrawGlow(polygon As Polygon, width As Single, endWidth As Single, color As ColorRgba, endColorRgba As ColorRgba, steps As Integer, capType As LineCapType = LineCapType.CappedExtended, capPoints As Integer = 2)
  overload: ShapeEngine.Geometry.PolygonDef.PolygonDrawing.DrawGlow*
