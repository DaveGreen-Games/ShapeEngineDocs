  assemblies:
  - ShapeEngine
  namespace: ShapeEngine.Core
  summary: >-
    Sets the current drawing color in RLGL.

    This affects all subsequent vertices until the color is changed again or the batch ends.

    This method can be used to change colors between vertices within the same batch.
  remarks: Batch must be active before using this function. Use <xref href="ShapeEngine.Core.TriangleBatch.StartImmediateBatch(ShapeEngine.Color.ColorRgba)" data-throw-if-not-resolved="false"></xref> to start a batch before setting the color.
