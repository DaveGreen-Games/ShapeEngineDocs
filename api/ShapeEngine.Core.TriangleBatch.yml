  assemblies:
  - ShapeEngine
  namespace: ShapeEngine.Core
  summary: >-
    A class for efficient triangle drawing using Raylib's RLGL, supporting both persistent batches and immediate-mode drawing.


    <p>

    This class serves two main purposes:

    </p>

    <ul><li>

    <b>Pooled Instances:</b> obtain an instance via <xref href="ShapeEngine.Core.TriangleBatch.Get(ShapeEngine.Color.ColorRgba%2cSystem.Int32)" data-throw-if-not-resolved="false"></xref> to manage a persistent list of vertices.

    This is ideal for static geometry that doesn't change often. The batch can be drawn repeatedly with <xref href="ShapeEngine.Core.TriangleBatch.Draw" data-throw-if-not-resolved="false"></xref>.

    Remember to return it to the pool with <xref href="ShapeEngine.Core.TriangleBatch.Return(ShapeEngine.Core.TriangleBatch)" data-throw-if-not-resolved="false"></xref> when finished.

    </li><li>

    <b>Immediate Mode (Static):</b> use static methods like <xref href="ShapeEngine.Core.TriangleBatch.StartImmediateBatch(ShapeEngine.Color.ColorRgba)" data-throw-if-not-resolved="false"></xref>, <xref href="ShapeEngine.Core.TriangleBatch.AddImmediateVertex(System.Single%2cSystem.Single)" data-throw-if-not-resolved="false"></xref>,

    and <xref href="ShapeEngine.Core.TriangleBatch.EndImmediateBatch" data-throw-if-not-resolved="false"></xref> for dynamic, per-frame triangle drawing without managing a specific object instance.

    </li></ul>

    <p>

    Both approaches utilize <xref href="Raylib_cs.DrawMode.Triangles" data-throw-if-not-resolved="false"></xref>, meaning every 3 consecutive vertices form a single triangle.

    </p>
