  namespace: ShapeEngine.Core.Structs
  summary: Calculates the absolute transform for a child object based on its relative offset and the parent’s absolute transform.
  example: []
  syntax:
    content: public static Transform2D UpdateTransform(Transform2D parentTransform, Transform2D childOffset, bool moves = true, bool rotates = true, bool scales = true)
    parameters:
    - id: parentTransform
      type: ShapeEngine.Core.Structs.Transform2D
      description: The absolute <xref href="ShapeEngine.Core.Structs.Transform2D" data-throw-if-not-resolved="false"></xref> of the parent.
    - id: childOffset
      type: ShapeEngine.Core.Structs.Transform2D
      description: The relative <xref href="ShapeEngine.Core.Structs.Transform2D" data-throw-if-not-resolved="false"></xref> offset of the child to the parent.
    - id: moves
      type: System.Boolean
      description: If true, the child moves with the parent; if false, the child remains at a fixed position.
    - id: rotates
      type: System.Boolean
      description: If true, the child rotates with the parent; if false, the child retains its own rotation.
    - id: scales
      type: System.Boolean
      description: If true, the child scales with the parent; if false, the child retains its own scale and size.
    return:
      type: ShapeEngine.Core.Structs.Transform2D
      description: The absolute <xref href="ShapeEngine.Core.Structs.Transform2D" data-throw-if-not-resolved="false"></xref> of the child, computed from the parent transform and the child offset.
    content.vb: Public Shared Function UpdateTransform(parentTransform As Transform2D, childOffset As Transform2D, moves As Boolean = True, rotates As Boolean = True, scales As Boolean = True) As Transform2D
