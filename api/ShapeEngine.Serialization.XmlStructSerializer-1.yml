  assemblies:
  - ShapeEngine
  namespace: ShapeEngine.Serialization
  summary: Provides XML serialization and deserialization for value types (structs) using <xref href="System.Xml.Serialization.XmlSerializer" data-throw-if-not-resolved="false"></xref>.
  remarks: >-
    This class is designed for types that are structs (value types). It omits the XML namespace declaration

    and uses UTF-8 encoding without BOM. The class supports both instance and static usage for serialization and deserialization.
  example: []
  syntax:
    content: 'public class XmlStructSerializer<T> where T : struct'
    typeParameters:
    - id: T
      description: The value type to serialize/deserialize. Must be a struct.
    content.vb: Public Class XmlStructSerializer(Of T As Structure)
