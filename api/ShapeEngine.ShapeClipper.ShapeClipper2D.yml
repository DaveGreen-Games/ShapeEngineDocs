  assemblies:
  - ShapeEngine
  namespace: ShapeEngine.ShapeClipper
  summary: >-
    Provides shared Clipper-backed 2D geometry utilities and configuration for path extraction, clipping, offsetting,

    shape creation, simplification, winding analysis, and hole filtering.
  remarks: >-
    This type acts as the shared foundation for the higher-level <xref href="ShapeEngine.ShapeClipper.ShapeClipperConversion2D" data-throw-if-not-resolved="false"></xref>,

    <xref href="ShapeEngine.ShapeClipper.ShapeClipperTriangulation2D" data-throw-if-not-resolved="false"></xref>, and <xref href="ShapeEngine.ShapeClipper.ShapeClipperDrawing2D" data-throw-if-not-resolved="false"></xref> helpers.

    It reuses static buffers and engine instances to reduce allocations during repeated geometry operations,

    so it is intended for sequential use and is not thread-safe.
