    path: ../ShapeEngine/ShapeEngine/Core/Structs/FramerateSettings.cs
    startLine: 57
  assemblies:
  - ShapeEngine
  namespace: ShapeEngine.Core.Structs
  summary: >-
    Fixed update framerate (in frames per second) used for a fixed-timestep update loop.

    A value of 0 disables fixed-timestep updates. When enabled the constructor will

    clamp this value to <xref href="ShapeEngine.Core.Structs.FramerateSettings.MinFrameRate" data-throw-if-not-resolved="false"></xref> / <xref href="ShapeEngine.Core.Structs.FramerateSettings.MaxFrameRate" data-throw-if-not-resolved="false"></xref> if those bounds are active.
  remarks: >-
    A fixed frame rate guarantees consistent update intervals regardless of rendering performance.

    The fixed framerate is not affected by <xref href="ShapeEngine.Core.Structs.FramerateSettings.IdleFrameRateLimit" data-throw-if-not-resolved="false"></xref> or <xref href="ShapeEngine.Core.Structs.FramerateSettings.UnfocusedFrameRateLimit" data-throw-if-not-resolved="false"></xref>.
  example: []
  syntax:
    content: public readonly int FixedFramerate
    return:
      type: System.Int32
    content.vb: Public ReadOnly FixedFramerate As Integer
