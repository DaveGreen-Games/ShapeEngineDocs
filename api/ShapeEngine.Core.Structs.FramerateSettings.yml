  assemblies:
  - ShapeEngine
  namespace: ShapeEngine.Core.Structs
  summary: >-
    Initializes a new <xref href="ShapeEngine.Core.Structs.FramerateSettings" data-throw-if-not-resolved="false"></xref> instance with the specified values.

    Values are validated and clamped where appropriate.
  example: []
  syntax:
    content: public FramerateSettings(int frameRateLimit, int fixedFramerate, int minFrameRate, int maxFrameRate, int unfocusedFrameRateLimit, int idleFrameRateLimit, float idleTimeThreshold, AdaptiveFpsLimiter.Settings adaptiveFpsLimiterSettings, double maxDeltaTime = 0.2, int minDynamicSubsteppingFramerate = 30, int maxDynamicSubsteps = 6)
    parameters:
    - id: frameRateLimit
      type: System.Int32
      description: >-
        Global frame rate limit. 0 or less means unlimited;
            clamped to <code class="paramref">minFrameRate</code> / <code class="paramref">maxFrameRate</code> when those bounds are set.
    - id: fixedFramerate
      type: System.Int32
      description: Fixed update framerate. 0 or less disables fixed-timestep; otherwise clamped to bounds.
    - id: minFrameRate
      type: System.Int32
      description: Minimum allowed frame rate bound. Set to 0 to disable the lower bound.
    - id: maxFrameRate
      type: System.Int32
      description: Maximum allowed frame rate bound. Set to 0 to disable the upper bound.
    - id: unfocusedFrameRateLimit
      type: System.Int32
      description: >-
        Frame rate limit applied when the application is unfocused.
            0 or less disables the unfocused-specific limit; clamped to bounds when set.
    - id: idleFrameRateLimit
      type: System.Int32
      description: >-
        Frame rate limit applied when the application is idle.
            0 or less disables the idle-specific limit.
    - id: idleTimeThreshold
      type: System.Single
      description: >-
        Seconds without input after which the application is considered idle.
            0 or less disables idle detection.
    - id: adaptiveFpsLimiterSettings
      type: ShapeEngine.Core.AdaptiveFpsLimiter.Settings
      description: Settings for the adaptive FPS limiter.
    - id: maxDeltaTime
      type: System.Double
      description: Maximum allowed delta time (seconds) for a single frame. Defaults to 0.25.
    - id: minDynamicSubsteppingFramerate
      type: System.Int32
      description: Minimum allowed target framerate (in frames per second) used for dynamic substepping.
    - id: maxDynamicSubsteps
      type: System.Int32
      description: Maximum number of dynamic substeps allowed when dynamic substepping is active. Setting this to 0 disables dynamic substepping.
