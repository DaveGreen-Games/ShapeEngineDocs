  nameWithType: FramerateSettings.FramerateSettings(int, int, int, int, int, int, float, AdaptiveFpsLimiter.Settings, double, int, int)
  fullName: ShapeEngine.Core.Structs.FramerateSettings.FramerateSettings(int, int, int, int, int, int, float, ShapeEngine.Core.AdaptiveFpsLimiter.Settings, double, int, int)
  type: Constructor
  source:
    remote:
      path: ShapeEngine/Core/Structs/FramerateSettings.cs
