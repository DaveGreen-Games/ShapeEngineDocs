      description: The filter type for selecting a collision point.
    - id: referencePoint
      type: System.Numerics.Vector2
      description: The reference point that is used for closest, furthest, pointing towards, and pointing away calculations.
    return:
      type: ShapeEngine.Geometry.CollisionSystem.CollisionPoint
      description: ''
    content.vb: Public Function Filter(filterType As CollisionPointsFilterType, referencePoint As Vector2 = Nothing) As CollisionPoint
  overload: ShapeEngine.Geometry.CollisionSystem.CollisionPoints.Filter*
