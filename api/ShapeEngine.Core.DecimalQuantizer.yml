  namespace: ShapeEngine.Core
  summary: Quantizes floating-point values and vectors using a shared <xref href="ShapeEngine.Core.DecimalPrecision" data-throw-if-not-resolved="false"></xref> setting.
  remarks: >-
    This type converts floating-point values into deterministic integer-like buckets so that equality and hashing

    can be made tolerant to small rounding differences.
