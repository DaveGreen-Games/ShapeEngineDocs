  assemblies:
  - ShapeEngine
  namespace: ShapeEngine.Geometry.CircleDef
  summary: Represents a sector (pie slice) of a circle, defined by a center, radius, rotation, and sector angle.
  remarks: >-
    The <xref href="ShapeEngine.Geometry.CircleDef.CircleSector" data-throw-if-not-resolved="false"></xref> class provides methods to generate polygons, points, and segments representing the sector.

    The arc of the sector can be approximated with a configurable number of points.
