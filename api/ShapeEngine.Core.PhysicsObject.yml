  namespace: ShapeEngine.Core
  summary: Gets the accumulated force input to be applied on the next update.
  remarks: >-
    This member stores force-like input in engine units.

    It is converted to acceleration during the physics step by dividing it by the effective mass.

    Calling <xref href="ShapeEngine.Core.PhysicsObject.AddForce(System.Numerics.Vector2)" data-throw-if-not-resolved="false"></xref> changes <xref href="ShapeEngine.Core.PhysicsObject.AccumulatedForce" data-throw-if-not-resolved="false"></xref>.
