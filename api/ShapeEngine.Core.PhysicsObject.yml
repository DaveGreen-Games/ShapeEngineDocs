  assemblies:
  - ShapeEngine
  namespace: ShapeEngine.Core
  summary: Represents a game object with simple gameplay-oriented 2D physics state and integration.
  remarks: >-
    <p>

    <xref href="ShapeEngine.Core.PhysicsObject" data-throw-if-not-resolved="false"></xref> extends <xref href="ShapeEngine.Core.GameObject" data-throw-if-not-resolved="false"></xref> with velocity, mass, drag, constant acceleration,

    and per-frame accumulated force, acceleration, and impulse inputs.

    </p>

    <p>

    The simulation step is intentionally simple and game-friendly:

    accumulated impulses are applied directly to velocity,

    accumulated force inputs are converted to acceleration,

    accumulated acceleration inputs are applied directly,

    drag is applied,

    and then position is advanced using the resulting velocity.

    </p>

    <p>

    A mass less than or equal to zero is treated as <code>1</code> for force and impulse conversion.

    </p>

    <p>

    In this class, <b>force</b> is mass-dependent input that is converted to acceleration during the physics step,

    <b>acceleration</b> is mass-independent input that is applied directly to velocity over time,

    and <b>impulse</b> is an immediate velocity change that is applied before acceleration and drag for the current step.

    Use <xref href="ShapeEngine.Core.PhysicsObject.AddForce(System.Numerics.Vector2)" data-throw-if-not-resolved="false"></xref> for force-like input,

    <xref href="ShapeEngine.Core.PhysicsObject.AddAcceleration(System.Numerics.Vector2)" data-throw-if-not-resolved="false"></xref> for direct acceleration input,

    and <xref href="ShapeEngine.Core.PhysicsObject.AddImpulse(System.Numerics.Vector2)" data-throw-if-not-resolved="false"></xref> for one-shot impacts, jumps, knockback, or collision responses.

    </p>
  example: []
