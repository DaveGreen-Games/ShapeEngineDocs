  summary: Provides serialization and deserialization functionality for <code class="typeparamref">T</code> objects using System.Text.Json.
  remarks: >-
    This class supports custom <xref href="System.Text.Json.JsonSerializerOptions" data-throw-if-not-resolved="false"></xref> and static serialization methods for flexibility.

    Use <xref href="ShapeEngine.Serialization.JsonDataObjectSerializer%601.Serialize(%600)" data-throw-if-not-resolved="false"></xref> and <xref href="ShapeEngine.Serialization.JsonDataObjectSerializer%601.Deserialize(System.String)" data-throw-if-not-resolved="false"></xref> for instance-based operations,

    or the static methods for generic usage.
  example: []
  syntax:
    content: 'public class JsonDataObjectSerializer<T> where T : DataObject'
    typeParameters:
    - id: T
      description: >-
        The type of <xref href="ShapeEngine.Serialization.DataObject" data-throw-if-not-resolved="false"></xref> to serialize/deserialize.

        <code class="typeparamref">T</code> must inherit from <xref href="ShapeEngine.Serialization.DataObject" data-throw-if-not-resolved="false"></xref>.
