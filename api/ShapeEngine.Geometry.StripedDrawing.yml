  assemblies:
  - ShapeEngine
  namespace: ShapeEngine.Geometry
  summary: >-
    Draw a sector of an alternating striped ring.Draws lines across the circumference of the ring.

    Each line starts on the inner radius and ends on the outer radius.
  example: []
  syntax:
    content: public static void DrawStripedRing(Vector2 center, float innerRadius, float outerRadius, float angleSpacingDeg, float minAngleDeg, float maxAngleDeg, LineDrawingInfo striped, LineDrawingInfo alternatingStriped, float angleOffset = 0)
    parameters:
    - id: center
      type: System.Numerics.Vector2
      description: The center of the ring.
    - id: innerRadius
      type: System.Single
      description: >-
        The inner radius of the ring.
            Should be positive and smaller than the outer radius.
    - id: outerRadius
      type: System.Single
      description: >-
        The outer radius of the ring.
            Should be positive and bigger than the inner radius.
    - id: angleSpacingDeg
      type: System.Single
      description: The spacing between each line in degrees.
    - id: minAngleDeg
      type: System.Single
      description: >-
        The start of the sector in degrees.
            Can be negative and/or bigger than maxAngleDeg.
    - id: maxAngleDeg
      type: System.Single
      description: >-
        The end of the sector in degrees.
            Can be negative and/or smaller than the minAngleDeg.
    - id: striped
      type: ShapeEngine.Geometry.LineDrawingInfo
      description: The line drawing info for how to draw the even numbered lines.
    - id: alternatingStriped
      type: ShapeEngine.Geometry.LineDrawingInfo
      description: The line drawing info for how to draw the odd numbered lines.
    - id: angleOffset
      type: System.Single
      description: >-
        The start offset.
            Value is wrapped between 0 and 1 and multiplied with the angleSpacingDeg.
            So the min offset is zero and the max offset is angleSpacingDeg!
    content.vb: Public Shared Sub DrawStripedRing(center As Vector2, innerRadius As Single, outerRadius As Single, angleSpacingDeg As Single, minAngleDeg As Single, maxAngleDeg As Single, striped As LineDrawingInfo, alternatingStriped As LineDrawingInfo, angleOffset As Single = 0)
