  summary: >-
    Draw a striped ring.Draws lines across the circumference of the ring.

    Each line starts on the inner radius and ends on the outer radius.
  example: []
  syntax:
    content: public static void DrawStripedRing(Vector2 center, float innerRadius, float outerRadius, float angleSpacingDeg, LineDrawingInfo striped, float angleOffset = 0)
    parameters:
    - id: center
      type: System.Numerics.Vector2
      description: The center of the ring.
    - id: innerRadius
      type: System.Single
      description: >-
        The inner radius of the ring.
            Should be positive and smaller than the outer radius.
    - id: outerRadius
      type: System.Single
      description: >-
        The outer radius of the ring.
            Should be positive and bigger than the inner radius.
    - id: angleSpacingDeg
      type: System.Single
      description: The spacing between each line in degrees.
    - id: striped
      type: ShapeEngine.Geometry.LineDrawingInfo
      description: The line drawing info for how to draw the lines.
    - id: angleOffset
      type: System.Single
      description: >-
        The start offset.
            Value is wrapped between 0 and 1 and multiplied with the angleSpacingDeg.
            So the min offset is zero and the max offset is angleSpacingDeg!
