  assemblies:
  - ShapeEngine
  namespace: ShapeEngine.Input
  summary: Specifies the maximum number of gamepads supported by the input system.
  remarks: >-
    Setting this to 0 or negative values disables gamepad handling.

    <xref href="ShapeEngine.Input.GamepadDeviceManager" data-throw-if-not-resolved="false"></xref> will not create any gamepad devices, even if gamepads are connected.
  example: []
  syntax:
    content: public readonly int MaxGamepadCount
    return:
      type: System.Int32
    content.vb: Public ReadOnly MaxGamepadCount As Integer
