    id: GamepadMappings
    path: ../ShapeEngine/ShapeEngine/Input/InputSettings.cs
    startLine: 30
  assemblies:
  - ShapeEngine
  namespace: ShapeEngine.Input
  summary: >-
    Additional gamepad mappings to apply at startup.

    Works regardless of the value of <xref href="ShapeEngine.Input.InputSettings.LoadEmbeddedGamepadMappings" data-throw-if-not-resolved="false"></xref> and with <xref href="ShapeEngine.Input.InputSettings.GamepadMappingsFilePath" data-throw-if-not-resolved="false"></xref>.

    Each string should represent a valid gamepad mapping.
  remarks: >-
    These mappings are always applied after the embedded mappings (if <xref href="ShapeEngine.Input.InputSettings.LoadEmbeddedGamepadMappings" data-throw-if-not-resolved="false"></xref> is true)

    or after the mappings loaded from the file specified by <xref href="ShapeEngine.Input.InputSettings.GamepadMappingsFilePath" data-throw-if-not-resolved="false"></xref>.

    You can look at the format of the mappings in the default mapping file source: https://github.com/mdqinc/SDL_GameControllerDB/blob/master/gamecontrollerdb.txt for reference.
  example: []
  syntax:
    content: public List<string>? GamepadMappings
    return:
      type: System.Collections.Generic.List{System.String}
    content.vb: Public GamepadMappings As List(Of String)
